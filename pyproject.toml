[project]
name = "fikus"
readme = "README.md"
license-files = ["LICENSE", "NOTICE", "data/LICENSE"]
authors = [{ name = "Autorzy projektu Fikus" }]
keywords = ["mcp", "mcp-server", "jdg", "podatki", "zus", "ryczałt", "pit", "polska"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Natural Language :: Polish",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Office/Business :: Financial :: Accounting",
]
version = "0.4.5"
description = "Wersjonowane parametry przepisów dla JDG w Polsce, udostępniane przez MCP"
license = "Apache-2.0 AND CC-BY-4.0"
requires-python = ">=3.11"
dependencies = ["mcp>=2.3,<3", "pydantic>=2", "pyyaml>=6", "tzdata; sys_platform == 'win32'"]

[project.optional-dependencies]
dev = ["pytest"]

[project.scripts]
fikus = "fikus.server:main"

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fikus"]

[tool.hatch.build.targets.wheel.force-include]
"data" = "fikus/data"

[project.urls]
Repository = "https://github.com/tmierzwa/fikus"
Issues = "https://github.com/tmierzwa/fikus/issues"
Changelog = "https://github.com/tmierzwa/fikus/blob/main/CHANGELOG.md"

[tool.pytest.ini_options]
pythonpath = ["src"]

[project]
name = "fikus"
version = "0.1.0"
description = "Wersjonowane parametry przepisów dla JDG w Polsce, udostępniane przez MCP"
license = "Apache-2.0"
requires-python = ">=3.11"
dependencies = ["mcp>=2.3,<3", "pydantic>=2", "pyyaml>=6", "tzdata; sys_platform == 'win32'"]

[project.optional-dependencies]
dev = ["pytest"]

[project.scripts]
fikus = "fikus.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fikus"]

[tool.hatch.build.targets.wheel.force-include]
"data" = "fikus/data"

[project.urls]
Repository = "https://github.com/tmierzwa/fikus"
Issues = "https://github.com/tmierzwa/fikus/issues"

[tool.pytest.ini_options]
pythonpath = ["src"]

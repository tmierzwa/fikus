          quote: "przekroczyły w tym okresie kwotę 60 000 zł i nie przekroczyły kwoty 300 000 zł"
          article: art. 81 ust. 2e, 2f i 2g
        - title: ZUS, Informacja w sprawie podstawy wymiaru składki oraz kwoty składki na ubezpieczenie zdrowotne w 2026 r.
          url: https://www.zus.pl/en/-/informacja-w-sprawie-podstawy-wymiaru-sk%C5%82adki-oraz-kwoty-sk%C5%82adki-na-ubezpieczenie-zdrowotne-w-2026-r.
          kind: control

          url: https://api.sejm.gov.pl/eli/acts/DU/2025/1461/text.pdf
          quote: "Składka na ubezpieczenie zdrowotne wynosi 9 % podstawy wymiaru składki"
          article: art. 81 ust. 2f, art. 79 ust. 1
        - title: Komunikat ZUS z 2 lutego 2026 r., informacja w sprawie podstawy wymiaru składki oraz kwoty składki na ubezpieczenie zdrowotne w 2026 r. (ryczałt; podaje wszystkie trzy kwoty, cytat dla progu powyżej 300 000 zł)
          url: https://www.zus.pl/-/informacja-w-sprawie-podstawy-wymiaru-sk%C5%82adki-oraz-kwoty-sk%C5%82adki-na-ubezpieczenie-zdrowotne-w-2026-r.

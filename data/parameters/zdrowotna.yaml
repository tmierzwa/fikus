- id: zdrowotna.ryczalt.progi
  name: Progi przychodu dla składki zdrowotnej na ryczałcie
  unit: PLN
  applies_to: {tax_form: [ryczalt]}
  versions:
    - valid_from: 2025-01-01
      value: {do_60000: 60000, do_300000: 300000}
      note: >-
        Przychód (od początku roku albo roczny) pomniejszony o składki społeczne bez FP.
        Klucze odpowiadają kluczom w zdrowotna.ryczalt.skladka. Wcześniejszych wersji nie wprowadzono.
      sources:
        - title: Dz.U. 2025 poz. 1461, tekst jednolity ustawy o świadczeniach opieki zdrowotnej
          url: https://api.sejm.gov.pl/eli/acts/DU/2025/1461/text.pdf
          quote: "przekroczyły w tym okresie kwotę 60 000 zł i nie przekroczyły kwoty 300 000 zł"
          article: art. 81 ust. 2e, 2f i 2g
        - title: ZUS, Informacja w sprawie podstawy wymiaru składki oraz kwoty składki na ubezpieczenie zdrowotne w 2026 r.
          url: https://www.zus.pl/en/-/informacja-w-sprawie-podstawy-wymiaru-sk%C5%82adki-oraz-kwoty-sk%C5%82adki-na-ubezpieczenie-zdrowotne-w-2026-r.
          kind: control
          quote: "osiągnięte od początku roku kalendarzowego, przekroczyły kwotę 60 000 zł i nie przekroczyły kwoty 300 000 zł"
          as_of: 2026-11-26
        - title: ZUS, poradnik „Polski Ład. Co zmienia się w przepisach dotyczących rozliczania składki na ubezpieczenie zdrowotne”, stan prawny na 1 stycznia 2025 r.
          url: https://www.zus.pl/documents/10182/3996913/Polski+%C3%83%E2%80%A6%C3%82%C2%81ad+-+poradnik.pdf/f4f5043f-4487-2e82-e93a-8f8d7cc6c5f9
          kind: control
          quote: "przekroczyły 60 000 zł, ale nie przekroczyły 300 000 zł"
          as_of: 2026-11-26
      verification: {checked_at: 2026-11-26, agent_check: 2026-11-26}

- id: zdrowotna.skala.stawka
  name: Stopa składki zdrowotnej przy skali podatkowej
  unit: "% podstawy"
  applies_to: {tax_form: [skala]}
  versions:
    - valid_from: 2025-02-01
      value: 9
      note: >-
        Ogólna stopa składki zdrowotnej. Tekst jednolity potwierdza stan prawny z 2025 r., stąd początek obowiązywania
        wersji 2025-02-01 (początek roku składkowego); okresu wcześniejszego ta wersja nie obejmuje.
      sources:
        - title: Dz.U. 2025 poz. 1461, tekst jednolity ustawy o świadczeniach opieki zdrowotnej
          url: https://api.sejm.gov.pl/eli/acts/DU/2025/1461/text.pdf
          article: art. 79 ust. 1
          quote: "Składka na ubezpieczenie zdrowotne wynosi 9 % podstawy wymiaru składki"
        - title: ZUS, poradnik „Polski Ład. Co zmienia się w przepisach dotyczących rozliczania składki na ubezpieczenie zdrowotne”, stan prawny na 1 stycznia 2025 r.
          url: https://www.zus.pl/documents/10182/3996913/Polski+%C3%83%E2%80%A6%C3%82%C2%81ad+-+poradnik.pdf/f4f5043f-4487-2e82-e93a-8f8d7cc6c5f9
          kind: control
          quote: "Stopa procentowa składki na ubezpieczenie zdrowotne nie uległa zmianie i wynosi 9%"
          as_of: 2026-11-26
      verification: {checked_at: 2026-11-26, agent_check: 2026-11-26}

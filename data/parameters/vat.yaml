          quote: "Prawo do obniżenia kwoty podatku należnego o kwotę podatku naliczonego powstaje w rozliczeniu za okres, w którym w odniesieniu do nabytych lub importowanych przez podatnika towarów i usług powstał obowiązek podatkowy."
          article: art. 86 ust. 10
        - title: Dz.U. 2026 poz. 1263, tekst jednolity ustawy o podatku od towarów i usług (krok 3, otrzymanie faktury)

          quote: "ust. 2 pkt 1 oraz pkt 2 lit. a – powstaje niewcześniej niż w rozliczeniu za okres, w którym podatnik otrzymał fakturę lub dokument celny"
          article: art. 86 ust. 10b pkt 1
        - title: Dz.U. 2026 poz. 1263, tekst jednolity ustawy o podatku od towarów i usług (krok 4)

- id: podatek.liniowy.limit_skladki_zdrowotnej
  name: Roczny limit składki zdrowotnej odliczanej od dochodu albo zaliczanej do kosztów przy podatku liniowym
  unit: PLN/rok
  applies_to: {tax_form: [liniowy]}
  versions:
    - valid_from: 2026-01-01
      valid_to: 2026-12-31
      value: 14100
      note: >-
        Łączny limit składek zaliczonych do kosztów uzyskania przychodów i odliczonych od dochodu w roku podatkowym.
        Kwota z ustawy jest co roku podwyższana i ogłaszana obwieszczeniem w Monitorze Polskim.
        Wcześniejszych wersji nie wprowadzono.
      sources:
        - title: M.P. 2025 poz. 1274, obwieszczenie Ministra Finansów i Gospodarki z 12 grudnia 2025 r.
          url: https://api.sejm.gov.pl/eli/acts/MP/2025/1274/text.pdf
          article: art. 30c ust. 2 pkt 2 i ust. 2c, art. 23 ust. 1 pkt 58 ustawy o podatku dochodowym od osób fizycznych
          quote: "w roku 2026 nie może przekroczyć 14 100 zł"
        - title: podatki.gov.pl (MF), Odliczenie składek na ubezpieczenie zdrowotne PIT, aktualizacja 23.11.2026 (podatek liniowy)
          url: https://podatki.gov.pl/ulgi-i-odliczenia/odliczenie-skladek-na-ubezpieczenie-zdrowotne-pit
          kind: control
          quote: "Wysokość odliczenia nie może jednak przekroczyć: w 2026 r. kwoty 14 100 zł"
          as_of: 2026-11-26
      verification: {checked_at: 2026-11-26, agent_check: 2026-11-26}
    - valid_from: 2027-01-01
      valid_to: 2027-12-31
      value: 15100
      note: >-
        Łączny limit składek zaliczonych do kosztów uzyskania przychodów i odliczonych od dochodu w roku podatkowym 2027.
        Kwotę z ustawy podwyższa się co roku według art. 30c ust. 2b, a minister właściwy do spraw finansów publicznych
        ogłasza ją obwieszczeniem w Monitorze Polskim do końca roku poprzedzającego rok podatkowy (art. 30c ust. 2c).
        Wartość pochodzi wprost z obwieszczenia na 2027 r. Nowelizacje ustawy o podatku dochodowym od osób fizycznych
        ogłoszone po tekście jednolitym Dz.U. 2026 poz. 592 (do 26 listopada 2026 r.) nie zmieniają art. 30c ust. 2 pkt 2,
        ust. 2b i 2c ani art. 23 ust. 1 pkt 58.
      sources:
        - title: M.P. 2026 poz. 1163, obwieszczenie Ministra Finansów i Gospodarki z 16 listopada 2026 r.
          url: https://api.sejm.gov.pl/eli/acts/MP/2026/1163/text.pdf
          article: art. 30c ust. 2 pkt 2 i ust. 2c, art. 23 ust. 1 pkt 58 ustawy o podatku dochodowym od osób fizycznych
          quote: "w roku 2027 nie może przekroczyć 15 100 zł"
        - title: Dz.U. 2026 poz. 592, tekst jednolity ustawy o podatku dochodowym od osób fizycznych (tryb ogłaszania kwoty; sam nie podaje kwoty na 2027 r.)
          url: https://api.sejm.gov.pl/eli/acts/DU/2026/592/text.pdf
          article: art. 30c ust. 2c
          quote: "Minister właściwy do spraw finansów publicznych ogłasza, do końca roku poprzedzającego rok podatkowy, w drodze obwieszczenia"
      verification:
        checked_at: 2026-11-26
        agent_check: 2026-11-26
        open_issue: >-
          Brak drugiego dowodu: na 26 listopada 2026 r. żadna strona urzędu (podatki.gov.pl, biznes.gov.pl) nie podaje
          jeszcze limitu na 2027 r. Pytanie do eksperta: docs/pytania-do-eksperta.md, P30.

- id: podatek.skala
  name: Skala podatkowa (próg, stawki i kwota zmniejszająca podatek)
  unit: "PLN albo % podstawy"
  applies_to: {tax_form: [skala]}
  versions:
    - valid_from: 2025-01-01
      value: {prog: 120000, stawka_do_progu: 12, kwota_zmniejszajaca: 3600, podatek_od_progu: 10800, stawka_ponad_prog: 32}
      note: >-
        Kwoty w złotych, stawki w procentach. Do progu podatek to stawka niższa od podstawy minus kwota zmniejszająca;
        ponad próg to kwota podatku od progu plus stawka wyższa od nadwyżki. Teksty jednolite poz. 163 (przepisy ogłoszone
        przed 9 stycznia 2025 r.) i poz. 592 (stan prawny na 1 kwietnia 2026 r.) mają to samo brzmienie art. 27 ust. 1,
        więc potwierdzają, że ta skala obowiązywała 1 stycznia 2025 r. (nie że wtedy zaczęła obowiązywać).

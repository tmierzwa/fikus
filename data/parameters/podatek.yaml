# Stawki podatku dochodowego. Serwer podaje stawki z podstawą prawną.
# Do jakiego punktu przepisu należy dany przychód, ustala podatnik (zwykle według PKWiU).

- id: ryczalt.stawki
  name: Stawki ryczałtu od przychodów ewidencjonowanych według punktów art. 12 ust. 1
  unit: "% przychodów"
  applies_to: {tax_form: [ryczalt]}
  versions:
    - valid_from: 2024-01-01
      value:
        pkt_1: 17
        pkt_2: 15
        pkt_2a: 14
        pkt_2b: 12
        pkt_3: 10
        pkt_4: {do_100000: 8.5, powyzej_100000: 12.5}
        pkt_5: 8.5
        pkt_6: 5.5
        pkt_7: 3
        pkt_8: 2
      note: >-
        Klucze to punkty art. 12 ust. 1 ustawy o zryczałtowanym podatku dochodowym. Zakres przychodów objętych
        każdym punktem (wolne zawody, usługi według PKWiU) jest w przepisie. Przy pkt 4 stawka 8,5% dotyczy
        przychodów do 100 000 zł, a 12,5% nadwyżki ponad tę kwotę. Gdy ewidencja nie pozwala ustalić przychodów
        z każdego rodzaju działalności, stawkę wyznacza art. 12 ust. 3. Art. 12 ust. 1 ma to samo brzmienie
        w tekstach jednolitych Dz.U. 2024 poz. 776 (przepisy ogłoszone przed 11 kwietnia 2024 r.) i Dz.U. 2025
        poz. 843 (przed 12 czerwca 2025 r.); późniejsze nowelizacje ustawy nie zmieniają art. 12 ust. 1.
        Data początku obowiązywania (2024-01-01) to początek okresu, który potwierdzają te teksty jednolite,
        a nie dzień wejścia stawek w życie: zmiana art. 12 ust. 1, która weszła w życie tego dnia (Dz.U. 2023
        poz. 1414), dotyczyła zakresu przychodów w pkt 7 lit. e, nie wysokości stawek. Według strony MF stawki
        obowiązują od 2022 r.; okresu sprzed 2024 r. ta wersja nie obejmuje.
      sources:
        - title: Dz.U. 2025 poz. 843, tekst jednolity ustawy o zryczałtowanym podatku dochodowym (pkt 1)
          url: https://api.sejm.gov.pl/eli/acts/DU/2025/843/text.pdf
          article: art. 12 ust. 1 pkt 1
          quote: "Ryczałt od przychodów ewidencjonowanych wynosi: 1) 17 % przychodów osiąganych w zakresie wolnych zawodów"
        - title: Dz.U. 2025 poz. 843, tekst jednolity ustawy o zryczałtowanym podatku dochodowym (pkt 2)
          url: https://api.sejm.gov.pl/eli/acts/DU/2025/843/text.pdf
          article: art. 12 ust. 1 pkt 2
          quote: "2) 15 % przychodów ze świadczenia usług"
        - title: Dz.U. 2025 poz. 843, tekst jednolity ustawy o zryczałtowanym podatku dochodowym (pkt 2a)
          url: https://api.sejm.gov.pl/eli/acts/DU/2025/843/text.pdf
          article: art. 12 ust. 1 pkt 2a
          quote: "2a) 14 % przychodów ze świadczenia usług"
        - title: Dz.U. 2025 poz. 843, tekst jednolity ustawy o zryczałtowanym podatku dochodowym (pkt 2b)
          url: https://api.sejm.gov.pl/eli/acts/DU/2025/843/text.pdf
          article: art. 12 ust. 1 pkt 2b
          quote: "2b) 12 % przychodów ze świadczenia usług"
        - title: Dz.U. 2025 poz. 843, tekst jednolity ustawy o zryczałtowanym podatku dochodowym (pkt 3)
          url: https://api.sejm.gov.pl/eli/acts/DU/2025/843/text.pdf
          article: art. 12 ust. 1 pkt 3
          quote: "3) 10 % przychodów ze świadczenia usług w zakresie kupna i sprzedaży nieruchomości"
        - title: Dz.U. 2025 poz. 843, tekst jednolity ustawy o zryczałtowanym podatku dochodowym (pkt 4)
          url: https://api.sejm.gov.pl/eli/acts/DU/2025/843/text.pdf
          article: art. 12 ust. 1 pkt 4
          quote: "8,5 % przychodów do kwoty 100 000 zł oraz 12,5 % przychodów od nadwyżki ponad kwotę 100 000 zł"
        - title: Dz.U. 2025 poz. 843, tekst jednolity ustawy o zryczałtowanym podatku dochodowym (pkt 5)
          url: https://api.sejm.gov.pl/eli/acts/DU/2025/843/text.pdf
          article: art. 12 ust. 1 pkt 5
          quote: "5) 8,5 %: a) przychodów z działalności usługowej"
        - title: Dz.U. 2025 poz. 843, tekst jednolity ustawy o zryczałtowanym podatku dochodowym (pkt 6)
          url: https://api.sejm.gov.pl/eli/acts/DU/2025/843/text.pdf
          article: art. 12 ust. 1 pkt 6
          quote: "6) 5,5 %: a) przychodów z działalności wytwórczej"
        - title: Dz.U. 2025 poz. 843, tekst jednolity ustawy o zryczałtowanym podatku dochodowym (pkt 7)
          url: https://api.sejm.gov.pl/eli/acts/DU/2025/843/text.pdf
          article: art. 12 ust. 1 pkt 7
          quote: "3,0 % przychodów: a) z działalności gastronomicznej"
        - title: Dz.U. 2025 poz. 843, tekst jednolity ustawy o zryczałtowanym podatku dochodowym (pkt 8)
          url: https://api.sejm.gov.pl/eli/acts/DU/2025/843/text.pdf
          article: art. 12 ust. 1 pkt 8
          quote: "8) 2 % przychodów, o których mowa w art. 6 ust. 1d"
        - title: Dz.U. 2024 poz. 776, tekst jednolity ustawy o zryczałtowanym podatku dochodowym (to samo brzmienie, dla daty początku obowiązywania)
          url: https://api.sejm.gov.pl/eli/acts/DU/2024/776/text.pdf
          article: art. 12 ust. 1 pkt 2b
          quote: "2b) 12 % przychodów ze świadczenia usług"
          as_of: 2024-04-10
        - title: biznes.gov.pl, Ryczałt od przychodów ewidencjonowanych, aktualizacja 07.01.2026 (podaje wszystkie dziesięć stawek)
          url: https://www.biznes.gov.pl/pl/portal/00263
          kind: control
          quote: "12% przychodów ze świadczenia usług:"
          as_of: 2026-11-26
        - title: podatki.gov.pl (MF), Stawki i limity, aktualizacja 15.12.2025 (stawki bez 2%)
          url: https://podatki.gov.pl/podatki-firmowe/pit/stawki-i-limity
          kind: control
          quote: "12% - od przychodów ze świadczenia niektórych usług informatycznych"
          as_of: 2026-11-26

    - valid_from: 2027-01-01
      value:
        steps:
          - text: Prowadząc pozarolniczą działalność gospodarczą, nie zaliczasz do kosztów uzyskania przychodów kosztu w tej części, w jakiej płatność dotycząca transakcji określonej w art. 19 Prawa przedsiębiorców została dokonana bez pośrednictwa rachunku płatniczego.
            uses: []
            basis: art. 22p ust. 1 ustawy o PIT
          - text: Transakcja z art. 19 Prawa przedsiębiorców to transakcja, której stroną jest inny przedsiębiorca i której jednorazowa wartość, bez względu na liczbę wynikających z niej płatności, przekracza 15 000 zł lub równowartość tej kwoty. Transakcje w walutach obcych przelicza się na złote według średniego kursu NBP z ostatniego dnia roboczego poprzedzającego dzień dokonania transakcji.
            uses: []
            basis: art. 19 ustawy – Prawo przedsiębiorców
          - text: Jeżeli taki koszt zaliczyłeś już do kosztów, w tej części zmniejszasz koszty uzyskania przychodów, a gdy nie możesz ich zmniejszyć, zwiększasz przychody, w miesiącu, w którym dokonałeś płatności bez pośrednictwa rachunku płatniczego.
            uses: []
            basis: art. 22p ust. 2 ustawy o PIT
          - text: Te same zasady stosujesz odpowiednio przy nabyciu lub wytworzeniu środków trwałych albo nabyciu wartości niematerialnych i prawnych oraz przy płatności dokonanej po likwidacji działalności albo po zmianie formy opodatkowania na zryczałtowaną formę opodatkowania określoną w ustawie o zryczałtowanym podatku dochodowym albo w ustawie o podatku tonażowym. W tych dwóch ostatnich przypadkach zmniejszasz koszty lub zwiększasz przychody za rok, w którym zlikwidowałeś działalność, albo za rok poprzedzający rok zmiany formy opodatkowania.
            uses: []
            basis: art. 22p ust. 3 ustawy o PIT
          - text: Do płatności wynikającej z faktury wystawionej przed 1 stycznia 2027 r. stosujesz art. 22p w brzmieniu sprzed tego dnia, czyli także wyłączenie przelewu na rachunek spoza wykazu podmiotów z art. 96b ust. 1 ustawy o VAT i płatności z pominięciem mechanizmu podzielonej płatności, z wyjątkami z dawnego art. 22p ust. 4 (wersja tej zasady obowiązująca do 31 grudnia 2026 r.).
            uses: []
            basis: art. 3 ust. 2 ustawy z dnia 18 września 2026 r. (Dz.U. 2026 poz. 1371)
      note: >-
        Nowe brzmienie art. 22p ust. 1 i 2 i uchylenie ust. 4 wynikają z ustawy Dz.U. 2026 poz. 1371, która w tym zakresie
        wchodzi w życie 1 stycznia 2027 r. (art. 6); nowego tekstu jednolitego jeszcze nie ogłoszono. Art. 22p ust. 3 cytowany
        jest z tekstu jednolitego Dz.U. 2026 poz. 592, bo nowelizacja go nie zmienia. Pozostałe nowelizacje ustawy o PIT
        ogłoszone po tekście jednolitym (Dz.U. 2026 poz. 779, 846, 1079, 1098, 1123, 1287, 1347, 1354, 1541, 1542 i 1556)
        nie zmieniają art. 22p. Art. 19 Prawa przedsiębiorców według tekstu jednolitego Dz.U. 2026 poz. 1484; ustawa
        Dz.U. 2026 poz. 1542 (od 1 stycznia 2027 r.) zmienia w tej ustawie tylko art. 47. Drugiego źródła urzędowego dla tej
        zasady nie znaleziono.
        Korekta z 28 listopada 2026 r.: usunięty krok 6.
      not_covered: >-
        Obowiązku dokonywania płatności przez rachunek płatniczy i jego skutków poza podatkiem dochodowym, solidarnej
        odpowiedzialności w VAT przy zapłacie na rachunek spoza wykazu (art. 117ba Ordynacji podatkowej) ani obowiązku
        stosowania mechanizmu podzielonej płatności (art. 108a ustawy o VAT).

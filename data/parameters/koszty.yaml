# Koszty uzyskania przychodów na skali i podatku liniowym: limity dla samochodów osobowych, limity amortyzacji
# i podstawowe zasady amortyzacji, wyłączenie z kosztów płatności poza rachunkiem płatniczym.
# Serwer podaje limity z ustaw i opisuje zasady krokami z podstawą prawną. Odpisów i kwot nie liczy;
# robi to klient. Wykazu rocznych stawek amortyzacyjnych (załącznik nr 1 do ustawy o PIT) nie kopiujemy.

- id: koszty.samochod.limity
  name: Limity wartości samochodu osobowego i udziału wydatków w kosztach uzyskania przychodów
  unit: PLN, %
  applies_to: {tax_form: [skala, liniowy]}
  versions:
    - valid_from: 2026-01-01
      value:
        elektryczny_lub_wodorowy: 225000
        spalinowy_co2_ponizej_50: 150000
        spalinowy_co2_od_50: 100000
        ubezpieczenie: 150000
        uzytek_mieszany_niekoszt_procent: 25
        prywatny_koszt_procent: 20
      note: >-
        Trzy pierwsze kwoty to wartość samochodu osobowego, powyżej której odpisy amortyzacyjne nie są kosztem
        (art. 23 ust. 1 pkt 4 ustawy o PIT): dla pojazdu elektrycznego albo napędzanego wodorem w rozumieniu art. 2 pkt 12
        i 15 ustawy o elektromobilności, dla samochodu, którego silnik spalinowy emituje według centralnej ewidencji
        pojazdów mniej niż 50 g CO2 na kilometr, oraz dla samochodu z emisją równą lub wyższą niż 50 g na kilometr.
        Te same kwoty stosuje się do opłat z umowy leasingu, najmu, dzierżawy lub podobnej (art. 23 ust. 1 pkt 47a,
        w związku z pkt 4 lit. b i c oraz ust. 5e); przy leasingu ograniczenie dotyczy tylko części opłaty, która stanowi
        spłatę wartości samochodu (art. 23 ust. 5c), a przy umowie krótszej niż 6 miesięcy wartością samochodu jest
        wartość przyjęta dla celów ubezpieczenia (ust. 5d). Kwota przy ubezpieczeniu dotyczy składek na ubezpieczenie
        samochodu, który nie jest prywatnym samochodem z art. 23 ust. 1 pkt 46 (pkt 47), i nie zależy od emisji CO2.
        Przy samochodzie wykorzystywanym również do celów niezwiązanych z działalnością 25% wydatków na jego używanie
        nie jest kosztem (pkt 46a); przy samochodzie stanowiącym własność podatnika, który nie jest składnikiem majątku
        związanym z działalnością, kosztem jest 20% wydatków i składek na ubezpieczenie (pkt 46). Wydatki i kwoty
        z pkt 46, 46a i 47a obejmują VAT, którego nie można odliczyć (art. 23 ust. 5a); ograniczenie odliczenia VAT
        do 50% opisuje zasada.vat_odliczenie. Bez ewidencji przebiegu pojazdu z art. 86a ust. 4 ustawy o VAT samochód
        uznaje się za wykorzystywany również do celów niezwiązanych z działalnością (art. 23 ust. 5f i 5g).
        Kwoty zależne od emisji CO2 obowiązują od 1 stycznia 2026 r. (art. 41 pkt 4 ustawy Dz.U. 2021 poz. 2269); wcześniej
        dla samochodów innych niż elektryczne i wodorowe było to 150 000 zł, czego ta wersja nie obejmuje. Do pojazdów
        wprowadzonych do ewidencji środków trwałych przed tym dniem stosuje się przepisy dotychczasowe (art. 30 tej
        ustawy). Przepis nie wspomina o leasingu ani najmie; stanowisko MF z odpowiedzi na interpelację nr 12100 (nie treść przepisu) jest takie, że samochody używane na podstawie leasingu operacyjnego, najmu
        lub dzierżawy nie są w tej ewidencji, więc od 1 stycznia 2026 r. stosuje się do nich nowe kwoty, także gdy umowę
        zawarto wcześniej. Udziały procentowe obowiązują od 1 stycznia 2019 r. (Dz.U. 2018 poz. 2159); tu ujęte od
        początku tej wersji. Tekst jednolity Dz.U. 2026 poz. 592 uwzględnia stan prawny na 1 kwietnia 2026 r.; nowelizacje
        ogłoszone później (Dz.U. 2026 poz. 779, 846, 1079, 1098, 1123, 1287, 1347, 1354, 1371, 1541, 1542 i 1556)
        nie zmieniają art. 23 ust. 1 pkt 4, 46, 46a, 47 i 47a ani ust. 5a–5g.
      sources:
        - title: Dz.U. 2026 poz. 592, tekst jednolity ustawy o podatku dochodowym od osób fizycznych (pojazd elektryczny lub wodorowy)
          url: https://api.sejm.gov.pl/eli/acts/DU/2026/592/text.pdf
          article: art. 23 ust. 1 pkt 4 lit. a
          quote: "225 000 zł – w przypadku samochodu osobowego będącego pojazdem elektrycznym w rozumieniu art. 2 pkt 12"
          confirms: [elektryczny_lub_wodorowy]
        - title: Dz.U. 2026 poz. 592, tekst jednolity ustawy o PIT (emisja poniżej 50 g/km)
          url: https://api.sejm.gov.pl/eli/acts/DU/2026/592/text.pdf
          article: art. 23 ust. 1 pkt 4 lit. b
          quote: "150 000 zł – jeśli emisja CO2 silnika spalinowego samochodu osobowego, określona na podstawie danych zawartych w centralnej ewidencji pojazdów, o której mowa w art. 80a ustawy z dnia 20 czerwca 1997 r. – Prawo o ruchu drogowym, wynosi mniej niż 50 g na kilometr"
          confirms: [spalinowy_co2_ponizej_50]
        - title: Dz.U. 2026 poz. 592, tekst jednolity ustawy o PIT (emisja od 50 g/km)
          url: https://api.sejm.gov.pl/eli/acts/DU/2026/592/text.pdf
          article: art. 23 ust. 1 pkt 4 lit. c
          quote: "100 000 zł – jeśli emisja CO2 silnika spalinowego samochodu osobowego, określona na podstawie danych zawartych w centralnej ewidencji pojazdów, o której mowa w art. 80a ustawy z dnia 20 czerwca 1997 r. – Prawo o ruchu drogowym, jest równa lub wyższa niż 50 g na kilometr"
          confirms: [spalinowy_co2_od_50]
        - title: Dz.U. 2026 poz. 592, tekst jednolity ustawy o PIT (ubezpieczenie)
          url: https://api.sejm.gov.pl/eli/acts/DU/2026/592/text.pdf
          article: art. 23 ust. 1 pkt 47
          quote: "w jakiej kwota 150 000 zł pozostaje do wartości samochodu przyjętej dla celów ubezpieczenia"
          confirms: [ubezpieczenie]
        - title: Dz.U. 2026 poz. 592, tekst jednolity ustawy o PIT (użytek mieszany)
          url: https://api.sejm.gov.pl/eli/acts/DU/2026/592/text.pdf
          article: art. 23 ust. 1 pkt 46a
          quote: "25 % poniesionych wydatków, z zastrzeżeniem pkt 36, z tytułu kosztów używania samochodu osobowego"
          confirms: [uzytek_mieszany_niekoszt_procent]
        - title: Dz.U. 2026 poz. 592, tekst jednolity ustawy o PIT (samochód prywatny)
          url: https://api.sejm.gov.pl/eli/acts/DU/2026/592/text.pdf
          article: art. 23 ust. 1 pkt 46
          quote: "te wydatki i składki w wysokości 20 % stanowią jednak koszty uzyskania przychodów"
          confirms: [prywatny_koszt_procent]
        - title: Dz.U. 2026 poz. 592, tekst jednolity ustawy o PIT (leasing i najem, ta sama kwota co przy amortyzacji)
          url: https://api.sejm.gov.pl/eli/acts/DU/2026/592/text.pdf
          article: art. 23 ust. 1 pkt 47a i ust. 5e
          quote: "w jakiej kwota, o której mowa w pkt 4 odpowiednio w lit. b lub c, pozostaje do wartości samochodu osobowego będącego przedmiotem tej umowy"
        - title: Dz.U. 2021 poz. 2269, ustawa o zmianie ustawy o elektromobilności i paliwach alternatywnych oraz niektórych innych ustaw (art. 3, emisja poniżej 50 g/km)
          url: https://api.sejm.gov.pl/eli/acts/DU/2021/2269/text.pdf
          article: art. 3 pkt 1 lit. a
          quote: "150 000 zł – jeśli emisja CO2 silnika spalinowego samochodu osobowego, określona na podstawie danych zawartych w centralnej ewidencji pojazdów, o której mowa w art. 80a ustawy z dnia 20 czerwca 1997 r. – Prawo o ruchu drogowym, wynosi mniej niż 50 g na kilometr"
          confirms: [spalinowy_co2_ponizej_50]
        - title: Dz.U. 2021 poz. 2269 (art. 3, emisja od 50 g/km)
          url: https://api.sejm.gov.pl/eli/acts/DU/2021/2269/text.pdf
          article: art. 3 pkt 1 lit. a
          quote: "100 000 zł – jeśli emisja CO2 silnika spalinowego samochodu osobowego, określona na podstawie danych zawartych w centralnej ewidencji pojazdów, o której mowa w art. 80a ustawy z dnia 20 czerwca 1997 r. – Prawo o ruchu drogowym, jest równa lub wyższa niż 50 g na kilometr"
          confirms: [spalinowy_co2_od_50]
        - title: Dz.U. 2021 poz. 2269 (art. 3, pojazd elektryczny lub wodorowy)
          url: https://api.sejm.gov.pl/eli/acts/DU/2021/2269/text.pdf
          article: art. 3 pkt 1 lit. a
          quote: "225 000 zł – w przypadku samochodu osobowego będącego pojazdem elektrycznym w rozumieniu art. 2 pkt 12"
          confirms: [elektryczny_lub_wodorowy]
        - title: Dz.U. 2021 poz. 2269 (wejście w życie kwot zależnych od emisji CO2)
          url: https://api.sejm.gov.pl/eli/acts/DU/2021/2269/text.pdf
          article: art. 41 pkt 4
          quote: "art. 3 pkt 1 lit. a tiret pierwsze w zakresie lit. b oraz tiret drugie i lit. b oraz art. 4 pkt 1 lit. a tiret pierwsze w zakresie lit. b oraz tiret drugie i lit. b, które wchodzą w życie z dniem 1 stycznia 2026 r."
          confirms: [period]
        - title: Dz.U. 2021 poz. 2269 (przepis przejściowy)
          url: https://api.sejm.gov.pl/eli/acts/DU/2021/2269/text.pdf
          article: art. 30
          quote: "Do pojazdów wprowadzonych do ewidencji środków trwałych i wartości niematerialnych i prawnych podatnika przed dniem wejścia w życie art. 23 ust. 1 pkt 4 i 47a oraz ust. 5e ustawy zmienianej w art. 3"
        - title: Dz.U. 2018 poz. 2159, ustawa o zmianie ustawy o podatku dochodowym od osób fizycznych, ustawy o podatku dochodowym od osób prawnych oraz niektórych innych ustaw (ubezpieczenie)
          url: https://api.sejm.gov.pl/eli/acts/DU/2018/2159/text.pdf
          article: art. 1 (art. 23 ust. 1 pkt 47 ustawy o PIT)
          quote: "w jakiej kwota 150 000 zł pozostaje do wartości samochodu przyjętej dla celów ubezpieczenia"
          confirms: [ubezpieczenie]
        - title: Dz.U. 2018 poz. 2159 (użytek mieszany)
          url: https://api.sejm.gov.pl/eli/acts/DU/2018/2159/text.pdf
          article: art. 1 (art. 23 ust. 1 pkt 46a ustawy o PIT)
          quote: "46a) 25% poniesionych wydatków, z zastrzeżeniem pkt 36, z tytułu kosztów używania samochodu osobowego"
          confirms: [uzytek_mieszany_niekoszt_procent]
        - title: Dz.U. 2018 poz. 2159 (samochód prywatny)
          url: https://api.sejm.gov.pl/eli/acts/DU/2018/2159/text.pdf
          article: art. 1 (art. 23 ust. 1 pkt 46 ustawy o PIT)
          quote: "te wydatki i składki w wysokości 20% stanowią jednak koszty uzyskania przychodów"
          confirms: [prywatny_koszt_procent]
        - title: Ministerstwo Finansów, odpowiedź na interpelację nr 12100 z 17 września 2025 r. (emisja poniżej 50 g/km)

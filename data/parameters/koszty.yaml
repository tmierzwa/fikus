          confirms: [spalinowy_co2_od_50]
          as_of: 2026-11-26
        - title: Ministerstwo Finansów, odpowiedź na interpelację nr 12100 (pojazd elektryczny lub wodorowy)
          url: https://api.sejm.gov.pl/sejm/term10/interpellations/attachment/ATTDLNHSY/i12100-o1.pdf
          kind: control
          quote: "Na niezmienionym poziomie w wysokości 225 000 zł pozostanie natomiast limit odpisów amortyzacyjnych dla samochodów osobowych będących pojazdami elektrycznymi"
          confirms: [elektryczny_lub_wodorowy]
          as_of: 2026-11-26
        - title: Ministerstwo Finansów, odpowiedź na interpelację nr 12100 (data)
          url: https://api.sejm.gov.pl/sejm/term10/interpellations/attachment/ATTDLNHSY/i12100-o1.pdf
          kind: control
          quote: "które wejdą w życie z dniem 1 stycznia 2026 r."
          confirms: [period]
          as_of: 2026-11-26
        - title: Ministerstwo Finansów, odpowiedź na interpelację nr 12100 (leasing i najem zawarte przed 2026 r.)
          url: https://api.sejm.gov.pl/sejm/term10/interpellations/attachment/ATTDLNHSY/i12100-o1.pdf

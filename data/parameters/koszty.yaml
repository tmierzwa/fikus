          as_of: 2026-11-26
        - title: biznes.gov.pl, Podstawowe informacje o księgowości i ewidencjach w przedsiębiorstwie, aktualizacja 14.03.2026 (samochód prywatny)
          url: https://www.biznes.gov.pl/pl/portal/00260

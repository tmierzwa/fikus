          kind: control
          quote: "Limit 150 000 zł znajdzie zastosowanie do odpisów amortyzacyjnych, jeżeli emisja CO2 silnika spalinowego samochodu osobowego będzie wynosiła mniej niż 50g na kilometr."
          confirms: [spalinowy_co2_ponizej_50]
          as_of: 2026-11-26
        - title: Ministerstwo Finansów, odpowiedź na interpelację nr 12100 (emisja od 50 g/km)

# Terminy. day_of_month to dzień miesiąca następującego po okresie rozliczeniowym.
# Gdy termin wypada w sobotę lub dzień wolny, zasadę przesunięcia opisuje zasada.przesuniecie_terminu
# (od 2026-10-01 z otwartą kwestią, czy obejmuje terminy zapłaty; zob. otwarte pytanie przy tej zasadzie).
# Datę liczy klient, nie serwer.

- id: termin.zus
  name: Składki ZUS za siebie (DRA i wpłata)
  kind: deadline
  versions:
    - valid_from: 2024-01-01
      value: {day_of_month: 20}
      note: >-
        Tekst jednolity potwierdza stan prawny na 2026-10-04.
        Data początku obowiązywania (2024-01-01) to data odcięcia danych. Korekta z 28 listopada 2026 r.: zmieniony okres.
      sources:
        - title: Dz.U. 2026 poz. 1474, tekst jednolity ustawy o systemie ubezpieczeń społecznych
          url: https://api.sejm.gov.pl/eli/acts/DU/2026/1474/text.pdf
          quote: "do 20 dnia następnego miesiąca – dla pozostałych płatników składek"
          article: art. 47 ust. 1 pkt 4 i ust. 2
        - title: "ZUS, FAQ: zmiany od 2022 r."
          url: https://www.zus.pl/en/o-zus/o-nas/programy-transformacji-cyfrowej-zus/zmiany-od-2022-r./faq
          kind: control
          quote: "do 20. dnia każdego miesiąca – dla pozostałych płatników składek"
          as_of: 2026-11-26
      verification: {checked_at: 2026-11-28, agent_check: 2026-11-28}


        terminu złożenia zeznania. Tekst jednolity uwzględnia stan prawny na 1 kwietnia 2026 r.; tekst jednolity Dz.U. 2024 poz. 226
        (przepisy ogłoszone przed 6 lutego 2024 r.) ma to samo brzmienie art. 45 ust. 1, 1a i 4. Data początku obowiązywania (2024-01-01) to data odcięcia danych.

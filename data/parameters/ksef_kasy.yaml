# Krajowy System e-Faktur (KSeF) i kasy rejestrujące: od kiedy faktury wystawia się w KSeF, kto jest z tego
# wyłączony, oraz limit sprzedaży zwalniający z ewidencji przy użyciu kasy rejestrującej. Stawki i limit zwolnienia
# podmiotowego z VAT są w vat.yaml.

- id: zasada.ksef_obowiazek
  name: Obowiązek wystawiania faktur w Krajowym Systemie e-Faktur (KSeF)
  kind: rule
  versions:
    - valid_from: 2026-02-01
      valid_to: 2026-12-31
      value:
        steps:
          - text: Jako podatnik VAT masz obowiązek wystawiać faktury ustrukturyzowane przy użyciu Krajowego Systemu e-Faktur. Obowiązek dotyczy także podatnika zwolnionego z VAT na podstawie art. 113 ust. 1 lub 9 ustawy o VAT, gdy wystawia fakturę; ustawa nie wyłącza go z tego obowiązku (wyłączenie dotyczy tylko zwolnienia w procedurze SME z art. 113a ust. 1). Kiedy fakturę w ogóle trzeba wystawić, określa art. 106b; sprzedaży zwolnionej z art. 113 ust. 1 i 9 nie musisz dokumentować fakturą, chyba że nabywca zażąda faktury.
            uses: [vat.limit_zwolnienia]
            basis: art. 106ga ust. 1 i 2 oraz art. 106b ust. 2 i 3 ustawy o podatku od towarów i usług
          - text: Od 1 lutego do 31 marca 2026 r. możesz zamiast faktur ustrukturyzowanych wystawiać faktury elektroniczne lub papierowe, jeżeli łączna wartość Twojej sprzedaży razem z podatkiem nie przekroczyła w 2024 r. 200 000 000 zł.
            uses: []
            basis: art. 145l ustawy o podatku od towarów i usług
          - text: Od 1 kwietnia do 31 grudnia 2026 r. możesz wystawiać faktury elektroniczne lub papierowe, jeżeli łączna wartość sprzedaży razem z podatkiem udokumentowana tymi fakturami wystawionymi w danym miesiącu jest mniejsza lub równa 10 000 zł. Prawo to tracisz począwszy od faktury, którą przekroczono tę wartość, i od tej faktury wystawiasz w KSeF wszystkie kolejne faktury objęte obowiązkiem (wyłączenia z art. 106ga ust. 2 i faktury przy kasach rejestrujących z art. 145n nadal obowiązują). Prawo nie wraca w następnych miesiącach, nawet gdy wartość sprzedaży udokumentowana fakturami jest w nich niższa (tak wyjaśnia MF).
            uses: []
            basis: art. 145m ust. 1 i 2 ustawy o podatku od towarów i usług
          - text: Od 1 lutego do 31 grudnia 2026 r. możesz też wystawiać faktury elektroniczne lub papierowe przy zastosowaniu kas rejestrujących oraz paragony fiskalne uznane za faktury (art. 106e ust. 5 pkt 3).
            uses: []
            basis: art. 145n ust. 1 ustawy o podatku od towarów i usług
          - text: Obowiązek nie dotyczy faktur wystawianych na rzecz osoby fizycznej nieprowadzącej działalności gospodarczej, faktur wystawianych przez podatnika bez siedziby działalności gospodarczej i bez stałego miejsca prowadzenia działalności w kraju (albo ze stałym miejscem, które nie uczestniczy w danej sprzedaży), faktur dokumentujących czynności rozliczane w procedurach szczególnych z działu XII rozdziałów 7, 7a i 9, faktur przy dostawach i usługach określonych w rozporządzeniu wydanym na podstawie art. 106s ani faktur wystawianych przez podatnika korzystającego ze zwolnienia z art. 113a ust. 1. W tych przypadkach wystawiasz faktury elektroniczne lub papierowe; fakturę dla osoby fizycznej nieprowadzącej działalności możesz wystawić w KSeF dobrowolnie.
            uses: []
            basis: art. 106ga ust. 2–4 ustawy o podatku od towarów i usług
          - text: Fakturę ustrukturyzowaną otrzymujesz przy użyciu Krajowego Systemu e-Faktur. Wyjątki dotyczą między innymi nabywcy korzystającego ze zwolnienia z art. 113a ust. 1, nabywcy, który nie posługuje się numerem identyfikacji na potrzeby podatku ani NIP, nabywcy zagranicznego i osoby fizycznej nieprowadzącej działalności gospodarczej, a także sprzedaży z miejscem świadczenia poza krajem; wtedy fakturę udostępnia się nabywcy w sposób z nim uzgodniony.
            uses: []
            basis: art. 106gb ust. 1 i 4 ustawy o podatku od towarów i usług
          - text: Kary pieniężne z art. 106ni ust. 1 (między innymi za niewystawienie wbrew obowiązkowi faktury ustrukturyzowanej w KSeF) stosuje się od 1 stycznia 2027 r.
            uses: []
            basis: art. 106ni ust. 1 ustawy o podatku od towarów i usług w zw. z art. 23 pkt 4 ustawy z dnia 16 czerwca 2023 r. o zmianie ustawy o podatku od towarów i usług oraz niektórych innych ustaw
          - text: Ta zasada nie opisuje wystawiania faktur w trybie offline24 i w czasie awarii albo niedostępności KSeF (art. 106nda–106nh), faktur z załącznikiem (art. 106gba), podawania numeru KSeF przy płatnościach (art. 108g, od 1 stycznia 2027 r.) ani faktur VAT RR.
            uses: []
            basis: art. 106gba, 106nda–106nh, 108g i 116 ustawy o podatku od towarów i usług
      note: >-
        Art. 106ga i art. 145l–145n w brzmieniu nadanym ustawą Dz.U. 2023 poz. 1598, zmienioną ustawami Dz.U. 2024 poz. 852
        i 1721 oraz Dz.U. 2025 poz. 1203, obowiązują od 1 lutego 2026 r. (art. 23 tej ustawy, przytoczony
        w obwieszczeniu do tekstu jednolitego). Uzasadnienie projektu ustawy Dz.U. 2025 poz. 1203 (druk sejmowy
        nr 1407) opisuje obowiązek jako dotyczący podatników czynnych i zwolnionych z VAT. Nowelizacje ogłoszone po tekście
        jednolitym Dz.U. 2026 poz. 1263 (Dz.U. 2026 poz. 1270, 1446, 1509 i 1556) nie zmieniają art. 106ga, 106gb, 106ni
        ani 145l–145n; ustawa Dz.U. 2026 poz. 1270 zmienia w art. 106b tylko odesłanie w ust. 3 pkt 2 (od 1 stycznia 2027 r.).
        Strona MF „Zakres obowiązkowego KSeF” podaje próg 10 000 zł w dwóch ujęciach: w opisie terminów, że podatnicy,
        u których wartość sprzedaży dokumentowana fakturami za okresy miesięczne nie przekracza tej kwoty, do końca 2026 r.
        nie mają obowiązku wystawiania faktur w KSeF, a w punkcie o przepisach epizodycznych prawie dosłownie art. 145m ust. 1
        (mogą wystawiać faktury elektroniczne lub papierowe). Strona pomija art. 145m ust. 2 (utratę prawa od faktury,
        którą przekroczono wartość). Wyjaśnienia MF na ksef.podatki.gov.pl („Co warto wiedzieć przed startem II etapu
        wdrożenia KSeF” z 31.03.2026 i „Najczęstsze pytania” z 15.04.2026, zmienione 29.04.2026) podają wprost, że po przekroczeniu limitu
        obowiązek KSeF obejmuje fakturę, którą przekroczono limit, i wszystkie kolejne, a późniejsze nieprzekroczenie
        limitu nie ma znaczenia. Tak samo opisuje to uzasadnienie projektu (druk sejmowy nr 1407). Korekta z 27 listopada 2026 r.: zmieniony krok o art. 145m.
      sources:

    - valid_from: 2027-01-01
      value:
        steps:
          - text: Jako podatnik VAT masz obowiązek wystawiać faktury ustrukturyzowane przy użyciu Krajowego Systemu e-Faktur. Obowiązek dotyczy także podatnika zwolnionego z VAT na podstawie art. 113 ust. 1 lub 9 ustawy o VAT, gdy wystawia fakturę; ustawa nie wyłącza go z tego obowiązku (wyłączenie dotyczy tylko zwolnienia w procedurze SME z art. 113a ust. 1). Kiedy fakturę w ogóle trzeba wystawić, określa art. 106b; sprzedaży zwolnionej z art. 113 ust. 1 i 9 nie musisz dokumentować fakturą, chyba że nabywca zażąda faktury.
            uses: [vat.limit_zwolnienia]
            basis: art. 106ga ust. 1 i 2 oraz art. 106b ust. 2 i 3 ustawy o podatku od towarów i usług
          - text: Przepisy przejściowe, które pozwalały do końca 2026 r. wystawiać faktury elektroniczne lub papierowe (przy sprzedaży do 10 000 zł miesięcznie, przy zastosowaniu kas rejestrujących i paragony fiskalne uznane za faktury), już nie obowiązują.
            uses: []
            basis: art. 145l–145n ustawy o podatku od towarów i usług
          - text: Obowiązek nie dotyczy faktur wystawianych na rzecz osoby fizycznej nieprowadzącej działalności gospodarczej, faktur wystawianych przez podatnika bez siedziby działalności gospodarczej i bez stałego miejsca prowadzenia działalności w kraju (albo ze stałym miejscem, które nie uczestniczy w danej sprzedaży), faktur dokumentujących czynności rozliczane w procedurach szczególnych z działu XII rozdziałów 7, 7a i 9, faktur przy dostawach i usługach określonych w rozporządzeniu wydanym na podstawie art. 106s ani faktur wystawianych przez podatnika korzystającego ze zwolnienia z art. 113a ust. 1. W tych przypadkach wystawiasz faktury elektroniczne lub papierowe; fakturę dla osoby fizycznej nieprowadzącej działalności możesz wystawić w KSeF dobrowolnie.
            uses: []
            basis: art. 106ga ust. 2–4 ustawy o podatku od towarów i usług
          - text: Fakturę ustrukturyzowaną otrzymujesz przy użyciu Krajowego Systemu e-Faktur. Wyjątki dotyczą między innymi nabywcy korzystającego ze zwolnienia z art. 113a ust. 1, nabywcy, który nie posługuje się numerem identyfikacji na potrzeby podatku ani NIP, nabywcy zagranicznego i osoby fizycznej nieprowadzącej działalności gospodarczej, a także sprzedaży z miejscem świadczenia poza krajem; wtedy fakturę udostępnia się nabywcy w sposób z nim uzgodniony.
            uses: []
            basis: art. 106gb ust. 1 i 4 ustawy o podatku od towarów i usług
          - text: Jeżeli wbrew obowiązkowi nie wystawisz faktury ustrukturyzowanej w KSeF (to jeden z przypadków z art. 106ni ust. 1), naczelnik urzędu skarbowego nakłada w drodze decyzji karę pieniężną do 100% kwoty podatku wykazanego na fakturze wystawionej poza KSeF, a przy fakturze bez wykazanego podatku do 18,7% kwoty należności ogółem.
            uses: []
            basis: art. 106ni ust. 1 ustawy o podatku od towarów i usług
      note: >-
        Okres stosowania art. 145l–145n kończy się 31 grudnia 2026 r. (te przepisy same podają swoje okresy), a art. 106ni
        ust. 1 wchodzi w życie 1 stycznia 2027 r. (odnośnik 23 w tekście jednolitym). Nowelizacje ogłoszone po tekście
        jednolitym Dz.U. 2026 poz. 1263 (Dz.U. 2026 poz. 1270, 1446, 1509 i 1556) nie zmieniają art. 106ga, 106gb ani 106ni;
        ustawa Dz.U. 2026 poz. 1270 zmienia w art. 106b tylko odesłanie w ust. 3 pkt 2. Korekta z 27 listopada 2026 r.:
        usunięty krok 6.
      not_covered: >-
        Wystawiania faktur w trybie offline24 i w czasie awarii albo niedostępności KSeF (art. 106nda–106nh ustawy
        o podatku od towarów i usług), faktur z załącznikiem (art. 106gba), podawania numeru KSeF przy płatnościach
        (art. 108g) i faktur VAT RR (art. 116).

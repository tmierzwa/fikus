          quote: "na rzecz nabywcy towarów lub usług będącego osobą fizyczną nieprowadzącą działalności gospodarczej"
        - title: Dz.U. 2026 poz. 1263, tekst jednolity ustawy o podatku od towarów i usług (zwolnienie z art. 113a)
          url: https://api.sejm.gov.pl/eli/acts/DU/2026/1263/text.pdf

- id: vat.kasa_fiskalna.limit_zwolnienia
  name: Limit sprzedaży na rzecz osób fizycznych zwalniający z ewidencji przy użyciu kasy rejestrującej
  unit: PLN/rok
  versions:
    - valid_from: 2025-01-01
      valid_to: 2027-12-31
      value: 20000
      note: >-
        Obowiązek ewidencji sprzedaży na rzecz osób fizycznych nieprowadzących działalności gospodarczej i rolników
        ryczałtowych przy użyciu kasy rejestrującej wynika z art. 111 ust. 1 ustawy o VAT; zwolnienia określa rozporządzenie
        wydane na podstawie art. 111 ust. 8, na czas określony. Rozporządzenie Dz.U. 2024 poz. 1902 obowiązuje od 1 stycznia
        2025 r. (§ 9), a zwolnienie stosuje się w danym roku podatkowym, nie dłużej niż do 31 grudnia 2027 r. (§ 3 ust. 1).
        Limit dotyczy wartości sprzedaży na rzecz osób fizycznych nieprowadzących działalności gospodarczej i rolników
        ryczałtowych w poprzednim roku podatkowym (§ 3 ust. 1 pkt 1); przy rozpoczęciu tej sprzedaży w poprzednim roku
        albo po 31 grudnia 2024 r. w danym roku kwotę stosuje się w proporcji do okresu wykonywania tych czynności
        (§ 3 ust. 1 pkt 1 i 2). Do wartości sprzedaży nie wlicza się podatku VAT ani dostawy nieruchomości i sprzedaży
        środków trwałych oraz wartości niematerialnych i prawnych udokumentowanej w całości fakturą (§ 3 ust. 3, poz. 40
        i 50 załącznika). Zwolnienia z limitu nie stosuje się do podatnika, który w poprzednim roku był obowiązany do
        ewidencji albo przestał spełniać warunki zwolnienia (§ 3 ust. 2 pkt 1). Zwolnienie traci moc po upływie dwóch
        miesięcy następujących po miesiącu, w którym przekroczono kwotę (§ 5 ust. 1 pkt 1 i 2), a z chwilą wykonania
        czynności z § 4 ust. 1 (§ 5 ust. 2). Niezależnie od wartości sprzedaży zwolnienie nie dotyczy czynności z § 4 ust. 1, między
        innymi dostawy komputerów i wyrobów elektronicznych oraz usług prawniczych, doradztwa podatkowego, opieki medycznej
        lekarzy i lekarzy dentystów, fryzjerskich i kosmetycznych, gastronomicznych i naprawy pojazdów. § 4 ust. 1 ma
        wyjątki, których notatka nie wylicza w całości: między innymi § 4 ust. 2 (poz. 53 i 57 załącznika), § 4 ust. 3
        (na przykład pkt 2 lit. b: usługi z ust. 1 pkt 2 lit. f–h świadczone wyłącznie na odległość na warunkach poz. 42,
        pkt 2 lit. c: usługi z lit. f na warunkach poz. 51), a z samych lit. f i g wyłączone są usługi z poz. 51 i 31
        załącznika. Notatka nie opisuje też przepisów przejściowych § 6–8 (między innymi § 8 ust. 1–4 o towarach
        z § 4 ust. 1 pkt 1 lit. s–u do 30 czerwca 2025 r., usługach parkingowych oraz usługach przewozowych przy
        urządzeniach samoobsługowych do 31 marca 2026 r. oraz innych urządzeniach samoobsługowych do 31 marca 2027 r.). Wartość nie opisuje zwolnień przedmiotowych z załącznika ani zwolnienia przy udziale
        sprzedaży zwolnionej powyżej 80% (§ 3 ust. 1 pkt 3 i 4). Rozporządzenie Dz.U. 2026 poz. 420 zmienia rozporządzenie
        Dz.U. 2024 poz. 1902 tylko w załączniku: zmienia poz. 38 i dodaje poz. 59; kwoty nie zmienia. Innych zmian według API ELI nie było. Wcześniejsze rozporządzenie (Dz.U. 2023 poz. 2605) ta wersja
        nie obejmuje. Ustawy ogłoszone po tekście jednolitym ustawy o VAT Dz.U. 2026 poz. 1263 nie zmieniają art. 111 ust. 1
        ani 8 (ustawa Dz.U. 2026 poz. 1270 zmienia art. 111 ust. 3a pkt 13 i 6l oraz dodaje ust. 6kb).
      sources:
        - title: Dz.U. 2024 poz. 1902, rozporządzenie Ministra Finansów w sprawie zwolnień z obowiązku prowadzenia ewidencji sprzedaży przy zastosowaniu kas rejestrujących (limit)
          url: https://api.sejm.gov.pl/eli/acts/DU/2024/1902/text.pdf
          article: § 3 ust. 1 pkt 1
          quote: "podatników, u których wartość sprzedaży dokonanej na rzecz osób fizycznych nieprowadzących działalności gospodarczej oraz rolników ryczałtowych w poprzednim roku podatkowym nie przekroczyła kwoty 20 000 zł"
        - title: Dz.U. 2024 poz. 1902, rozporządzenie (okres zwolnienia)
          url: https://api.sejm.gov.pl/eli/acts/DU/2024/1902/text.pdf
          article: § 3 ust. 1
          quote: "Zwalnia się z obowiązku prowadzenia ewidencji w danym roku podatkowym, nie dłużej jednak niż do dnia 31 grudnia 2027 r.:"
        - title: Dz.U. 2024 poz. 1902, rozporządzenie (utrata zwolnienia)
          url: https://api.sejm.gov.pl/eli/acts/DU/2024/1902/text.pdf
          article: § 5 ust. 1 pkt 1
          quote: "zwolnienie to traci moc po upływie dwóch miesięcy następujących po miesiącu, w którym wartość sprzedaży"
        - title: Dz.U. 2024 poz. 1902, rozporządzenie (wejście w życie)
          url: https://api.sejm.gov.pl/eli/acts/DU/2024/1902/text.pdf
          article: § 9
          quote: "Rozporządzenie wchodzi w życie z dniem 1 stycznia 2025 r."
        - title: Dz.U. 2026 poz. 1263, tekst jednolity ustawy o podatku od towarów i usług (obowiązek kasy)
          url: https://api.sejm.gov.pl/eli/acts/DU/2026/1263/text.pdf
          article: art. 111 ust. 1
          quote: "Podatnicy dokonujący sprzedaży na rzecz osób fizycznych nieprowadzących działalności gospodarczej oraz rolników ryczałtowych są obowiązani prowadzić ewidencję sprzedaży przy zastosowaniu kas rejestrujących."
        - title: Dz.U. 2026 poz. 420, rozporządzenie zmieniające (zmienia poz. 38 i dodaje poz. 59 załącznika)
          url: https://api.sejm.gov.pl/eli/acts/DU/2026/420/text.pdf
          article: § 1
          quote: "w załączniku wprowadza się następujące zmiany"
        - title: biznes.gov.pl, Kasa fiskalna w firmie, aktualizacja 03.05.2026
          url: https://www.biznes.gov.pl/pl/portal/00243
          kind: control
          quote: "lub rolników ryczałtowych nie przekroczył 20 tys. zł i jednocześnie nie miałeś obowiązku ewidencjonowania sprzedaży"
          as_of: 2026-11-26
      verification: {checked_at: 2026-11-26, agent_check: 2026-11-26}

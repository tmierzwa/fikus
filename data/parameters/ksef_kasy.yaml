          article: art. 106ga ust. 1
          quote: "Podatnicy są obowiązani wystawiać faktury ustrukturyzowane przy użyciu Krajowego Systemu e-Faktur."
        - title: Dz.U. 2026 poz. 1263, obwieszczenie, art. 23 ustawy Dz.U. 2023 poz. 1598 (data początku obowiązywania art. 106ga)
          url: https://api.sejm.gov.pl/eli/acts/DU/2026/1263/text.pdf
          article: art. 23 ustawy Dz.U. 2023 poz. 1598
          quote: "Ustawa wchodzi w życie z dniem 1 lutego 2026 r., z wyjątkiem:"
        - title: Dz.U. 2026 poz. 1263, tekst jednolity ustawy o podatku od towarów i usług (wyłączenia)
          url: https://api.sejm.gov.pl/eli/acts/DU/2026/1263/text.pdf

          quote: "osób zwolnionych z opłacania składek na własne obowiązkowe ubezpieczenia emerytalne i rentowe, za wskazany jeden miesiąc kalendarzowy"
        - title: Dz.U. 2024 poz. 1848, tekst jednolity ustawy o Funduszu Solidarnościowym (miesiąc zwolnienia)

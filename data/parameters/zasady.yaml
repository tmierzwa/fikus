        - title: Dz.U. 2025 poz. 1461, tekst jednolity ustawy o świadczeniach opieki zdrowotnej (przychody ze zbycia w rocznej podstawie)
          url: https://api.sejm.gov.pl/eli/acts/DU/2025/1461/text.pdf

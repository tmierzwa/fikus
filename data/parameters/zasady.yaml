          quote: "wpłaca składkę na ubezpieczenie zdrowotne od miesięcznej podstawy wymiaru składki na ubezpieczenie zdrowotne stanowiącej dochód z działalności gospodarczej uzyskany w miesiącu poprzedzającym miesiąc, za który opłacana jest składka"
        - title: Dz.U. 2025 poz. 1461, tekst jednolity ustawy o świadczeniach opieki zdrowotnej (stopa i minimum)
          url: https://api.sejm.gov.pl/eli/acts/DU/2025/1461/text.pdf

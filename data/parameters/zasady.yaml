        - title: Dz.U. 2025 poz. 1461, tekst jednolity ustawy o świadczeniach opieki zdrowotnej (kilka działalności)
          url: https://api.sejm.gov.pl/eli/acts/DU/2025/1461/text.pdf
          article: art. 82 ust. 2a
          quote: "Jeżeli ubezpieczony prowadzi więcej niż jedną pozarolniczą działalność, o której mowa w art. 81 ust. 2, składka na ubezpieczenie zdrowotne jest opłacana od sumy dochodów"
        - title: Dz.U. 2025 poz. 1461, tekst jednolity ustawy o świadczeniach opieki zdrowotnej (nadpłata w rozliczeniu rocznym)
          url: https://api.sejm.gov.pl/eli/acts/DU/2025/1461/text.pdf

# Zasady obliczeń: kroki słowne z odwołaniami do parametrów i podstawą prawną.
# Serwer ich nie wykonuje. Liczy klient.

- id: zasada.przesuniecie_terminu
  name: Przesunięcie terminu na dzień roboczy
  kind: rule
  versions:
    - valid_from: 2020-01-01
      valid_to: 2026-09-30
      value:
        steps:
          - text: Jeżeli ostatni dzień terminu przypada na sobotę lub dzień ustawowo wolny od pracy (w tym niedzielę), termin upływa następnego dnia, który nie jest sobotą ani dniem wolnym, chyba że ustawa podatkowa stanowi inaczej.
            uses: [kalendarz.dni_wolne]
            basis: art. 12 § 5 Ordynacji podatkowej; art. 1 pkt 1 i 2 ustawy o dniach wolnych od pracy
          - text: Tę samą zasadę stosuje się do terminów składek ZUS.
            uses: [termin.zus]
            basis: art. 31 ustawy o systemie ubezpieczeń społecznych
      note: >-
        Poprawka: dodany krok o składkach ZUS.
        data początku obowiązywania (2020-01-01) nie jest potwierdzona źródłem.
        Zamknięta 2026-09-30: od 1 października 2026 r. art. 12 § 5 ma brzmienie nadane ustawą Dz.U. 2026 poz. 846 (następna wersja).
      sources:
        - title: Dz.U. 2026 poz. 622, tekst jednolity Ordynacji podatkowej
          url: https://api.sejm.gov.pl/eli/acts/DU/2026/622/text.pdf
          quote: "Jeżeli ostatni dzień terminu przypada na sobotę lub dzień ustawowo wolny od pracy, za ostatni dzień terminu uważa się następny dzień po dniu lub dniach wolnych od pracy"
          article: art. 12 § 5
        - title: Dz.U. 2026 poz. 1474, tekst jednolity ustawy o systemie ubezpieczeń społecznych
          url: https://api.sejm.gov.pl/eli/acts/DU/2026/1474/text.pdf
          quote: "Do należności z tytułu składek stosuje się odpowiednio: art. 7a, art. 12"
          article: art. 31
        - title: Dz.U. 2025 poz. 296, tekst jednolity ustawy o dniach wolnych od pracy
          url: https://api.sejm.gov.pl/eli/acts/DU/2025/296/text.pdf
          quote: "drugi dzień Bożego Narodzenia; 2) niedziele"
          article: art. 1 pkt 1 i 2
        - title: biznes.gov.pl, Jak składać JPK_VAT z deklaracją, aktualizacja 03.07.2026 (krok 1, na przykładzie VAT)
          url: https://www.biznes.gov.pl/pl/portal/00237
          kind: control
          quote: "Jeśli 25. dzień miesiąca wypada w sobotę lub dzień ustawowo wolny od pracy, wtedy masz czas do pierwszego dnia roboczego przypadającego po tych dniach"
          as_of: 2026-11-26
        - title: ZUS, Termin składania dokumentów i opłacania składek (krok 2)
          url: https://www.zus.pl/en/firmy/rozliczenia-z-zus/dokumenty-rozliczeniowe/termin-skladania-dokumentow-i-oplacania-skladek
          kind: control
          quote: "Jeżeli koniec tego terminu przypada w święto (dzień ustawowo wolny od pracy), sobotę lub niedzielę, to za ostatni dzień terminu uważa się następny dzień roboczy"
          as_of: 2026-11-26
      verification: {checked_at: 2026-11-26, agent_check: 2026-11-26}
    - valid_from: 2026-10-01
      value:
        steps:
          - text: Jeżeli ostatni dzień terminu do wykonania czynności przypada na sobotę lub dzień ustawowo wolny od pracy (w tym niedzielę), termin upływa następnego dnia, który nie jest sobotą ani dniem wolnym, chyba że ustawa podatkowa stanowi inaczej.
            uses: [kalendarz.dni_wolne]
            basis: art. 12 § 5 Ordynacji podatkowej w brzmieniu od 1 października 2026 r.; art. 1 pkt 1 i 2 ustawy o dniach wolnych od pracy
          - text: Do należności z tytułu składek ZUS art. 12 Ordynacji podatkowej stosuje się odpowiednio. Czy obejmuje to termin opłacenia składek, jest niewyjaśnione (otwarte pytanie do eksperta).
            uses: [termin.zus]
            basis: art. 31 ustawy o systemie ubezpieczeń społecznych
      note: >-
        Od 1 października 2026 r. art. 12 § 5 mówi o „ostatnim dniu terminu do wykonania czynności” (art. 1 pkt 1 ustawy
        Dz.U. 2026 poz. 846, wejście w życie według art. 35). Tekstu jednolitego z tą zmianą jeszcze nie ma: brzmienie wynika
        z tekstu jednolitego poz. 622 i ustawy zmieniającej; późniejsze zmiany Ordynacji (poz. 875, 1098, 1154, 1206) nie dotyczą art. 12. Uzasadnienie projektu (druk sejmowy nr 2287, https://api.sejm.gov.pl/sejm/term10/prints/2287/2287-uzasadnienie.docx): zmiana wyłącza
        przesunięcie końca terminu przedawnienia; przykłady terminów do wykonania czynności to złożenie deklaracji
        i wniesienie odwołania.
      sources:
        - title: Dz.U. 2026 poz. 846, ustawa z 29 maja 2026 r. o zmianie ustawy – Ordynacja podatkowa oraz niektórych innych ustaw (nowe brzmienie)
          url: https://api.sejm.gov.pl/eli/acts/DU/2026/846/text.pdf
          quote: "w art. 12 w § 5 wyrazy „ostatni dzień terminu przypada” zastępuje się wyrazami „ostatni dzień terminu do wykonania czynności przypada”"
          article: art. 1 pkt 1
          as_of: 2026-06-25
        - title: Dz.U. 2026 poz. 846 (wejście w życie)
          url: https://api.sejm.gov.pl/eli/acts/DU/2026/846/text.pdf
          quote: "Ustawa wchodzi w życie z dniem 1 października 2026 r., z wyjątkiem"
          article: art. 35
          as_of: 2026-06-25
        - title: Dz.U. 2026 poz. 622, tekst jednolity Ordynacji podatkowej (pozostała część § 5)
          url: https://api.sejm.gov.pl/eli/acts/DU/2026/622/text.pdf
          quote: "za ostatni dzień terminu uważa się następny dzień po dniu lub dniach wolnych od pracy"
          article: art. 12 § 5
        - title: Dz.U. 2026 poz. 1474, tekst jednolity ustawy o systemie ubezpieczeń społecznych
          url: https://api.sejm.gov.pl/eli/acts/DU/2026/1474/text.pdf
          quote: "Do należności z tytułu składek stosuje się odpowiednio: art. 7a, art. 12"
          article: art. 31
        - title: Dz.U. 2025 poz. 296, tekst jednolity ustawy o dniach wolnych od pracy
          url: https://api.sejm.gov.pl/eli/acts/DU/2025/296/text.pdf
          quote: "drugi dzień Bożego Narodzenia; 2) niedziele"
          article: art. 1 pkt 1 i 2
      verification:
        checked_at: 2026-11-26
        agent_check: 2026-11-26
        open_issue: >-
          Czy art. 12 § 5 w brzmieniu od 1 października 2026 r. („terminu do wykonania czynności”) obejmuje termin zapłaty
          podatku, a przez art. 31 ustawy o systemie ubezpieczeń społecznych termin opłacenia składek? Uzasadnienie (druk 2287)
          wymienia złożenie deklaracji i wniesienie odwołania, zapłaty nie wymienia. Brak drugiego źródła urzędowego po zmianie.
          Pytanie do eksperta: docs/pytania-do-eksperta.md, P5.

- id: zasada.liniowy_podatek
  name: Podatek liniowy i zaliczki miesięczne
  kind: rule
  applies_to: {tax_form: [liniowy]}
  versions:
    - valid_from: 2026-01-01
      value:
        steps:
          - text: Ustal dochód z działalności według art. 9 ust. 1, 2–3b i 5, art. 24 ust. 1, 2, 3b–3e i ust. 4 zdanie pierwsze albo art. 24b ust. 1 i 2, albo art. 23o ustawy o PIT, z uwzględnieniem obniżenia o straty z lat poprzednich na zasadach art. 9 ust. 3. Przy podatkowej księdze przychodów i rozchodów dochodem jest różnica między przychodem a kosztami jego uzyskania, powiększona albo pomniejszona o różnicę między wartością remanentu końcowego i początkowego (art. 24 ust. 2 zdanie pierwsze). Ta zasada nie opisuje ustalania dochodu przy księgach rachunkowych (art. 24 ust. 1) ani dochodu z odpłatnego zbycia składników majątku (art. 24 ust. 2 zdanie drugie).
            uses: []
            basis: art. 30c ust. 2 zdanie pierwsze oraz art. 24 ust. 2 ustawy o podatku dochodowym od osób fizycznych
          - text: Dochód możesz pomniejszyć o składki na ubezpieczenia społeczne z art. 26 ust. 1 pkt 2 lit. a i pkt 2a ustawy o PIT zapłacone w roku podatkowym, na warunkach z tych przepisów (przy pkt 2 bez składek, których podstawą są dochody zwolnione albo dochody, od których zaniechano poboru podatku; przy pkt 2a z zastrzeżeniem art. 26 ust. 13a–13c), jeżeli nie zostały zaliczone do kosztów, odliczone od dochodów opodatkowanych według skali ani od przychodów na ryczałcie i nie zostały zwrócone.
            uses: [zus.stawka.emerytalna, zus.stawka.rentowa, zus.stawka.chorobowa, zus.stawka.wypadkowa_do_9]
            basis: art. 30c ust. 2 pkt 1, ust. 3 i 3a w zw. z art. 26 ust. 1 pkt 2 lit. a i pkt 2a oraz ust. 13a–13c ustawy o podatku dochodowym od osób fizycznych
          - text: Dochód możesz pomniejszyć o składki zdrowotne zapłacone w roku podatkowym z tytułu tej działalności i za osoby współpracujące, z tymi samymi warunkami z art. 30c ust. 3. Składki zdrowotne zaliczone do kosztów i odliczone od dochodu łącznie nie mogą przekroczyć rocznego limitu.
            uses: [podatek.liniowy.limit_skladki_zdrowotnej]
            basis: art. 30c ust. 2 pkt 2, ust. 2b, 2c i 3 oraz art. 23 ust. 1 pkt 58 ustawy o podatku dochodowym od osób fizycznych
          - text: Dochód możesz też pomniejszyć o wpłaty na indywidualne konto zabezpieczenia emerytalnego do wysokości określonej w przepisach o tych kontach (to odliczenie tylko w zeznaniu) oraz o darowiznę na cele kształcenia zawodowego z art. 26 ust. 1 pkt 9 lit. d ustawy o PIT, nie więcej niż 6% dochodu. Do obu stosuje się warunki z art. 30c ust. 3.
            uses: []
            basis: art. 30c ust. 2 pkt 3 i 4, ust. 3, 3a i 3b oraz art. 26 ust. 1 pkt 2b ustawy o podatku dochodowym od osób fizycznych
          - text: Podatek to podstawa pomnożona przez stawkę podatku liniowego. Podstawę opodatkowania i kwotę podatku zaokrąglij do pełnych złotych; końcówki poniżej 50 groszy pomiń, a od 50 groszy podwyższ do pełnego złotego. Ta zasada nie opisuje odliczeń od podstawy obliczenia podatku z art. 26e, 26ga, 26gb, 26h–26he, 26i, 52jb, 52n i 52x ustawy o PIT ani odliczenia podatku zapłaconego za granicą z art. 30c ust. 4.
            uses: [podatek.liniowy.stawka]
            basis: art. 30c ust. 1 ustawy o podatku dochodowym od osób fizycznych; art. 63 § 1 Ordynacji podatkowej
          - text: Przy zaliczkach miesięcznych zaliczka za miesiąc to różnica między podatkiem od dochodu osiągniętego od początku roku, obliczonym według kroków powyżej, a sumą należnych zaliczek za poprzednie miesiące. Przy podatkowej księdze przychodów i rozchodów dochodem do zaliczki jest różnica między przychodem a kosztami wynikającymi z księgi, a różnicę remanentową uwzględniasz tylko wtedy, gdy sporządzasz remanent na koniec miesiąca albo zarządzi to naczelnik urzędu skarbowego (art. 44 ust. 2). Zaliczki można nie wpłacać, jeżeli podatek od dochodu od początku roku pomniejszony o sumę wpłaconych zaliczek nie przekracza 1000 zł. Gdy ta kwota przekroczy 1000 zł, wpłać różnicę między podatkiem od dochodu od początku roku a sumą zaliczek wpłaconych od początku roku. Zamiast tego mały podatnik i podatnik rozpoczynający działalność mogą wpłacać zaliczki kwartalne (art. 44 ust. 3h i 3i), a podatnik może wybrać zaliczki uproszczone (art. 44 ust. 6b–6e i 6h, z obniżeniem o część składki zdrowotnej według art. 44 ust. 6j); ta zasada tych sposobów nie opisuje. Zwolnienie z zaliczek dla podatnika, który po raz pierwszy rozpoczął działalność (art. 44 ust. 7a), nie przysługuje w roku opodatkowania podatkiem liniowym (art. 44 ust. 7c pkt 5). Ta zasada nie opisuje też braku zaliczek w okresie zawieszenia działalności (art. 44 ust. 10) ani korekty dochodu przy niezapłaconych należnościach i zobowiązaniach (art. 44 ust. 17–26).
            uses: [podatek.liniowy.stawka, termin.zaliczka_liniowy]
            basis: art. 44 ust. 2, 3f, 7c pkt 5 i 15 ustawy o podatku dochodowym od osób fizycznych
          - text: Po końcu roku dochód z działalności opodatkowanej podatkiem liniowym wykazujesz w odrębnym zeznaniu rocznym. Przed upływem terminu złożenia zeznania wpłacasz podatek należny wynikający z zeznania albo różnicę między nim a sumą zapłaconych za ten rok zaliczek. Ta zasada nie opisuje doliczania do dochodu części dochodu z roku zwolnienia z zaliczek ani skutków utraty prawa do tego zwolnienia (art. 44 ust. 7f, 7i i 7j).
            uses: []
            basis: art. 45 ust. 1a pkt 2 i ust. 4 pkt 3 oraz art. 44 ust. 7f, 7i i 7j ustawy o podatku dochodowym od osób fizycznych
      note: >-
        Tekst jednolity uwzględnia stan prawny na 1 kwietnia 2026 r.; data początku obowiązywania (2026-01-01)
        nie jest potwierdzona źródłem. Wcześniejszych wersji nie wprowadzono.
      sources:
        - title: Dz.U. 2026 poz. 592, tekst jednolity ustawy o podatku dochodowym od osób fizycznych (zwolnienie z zaliczek tylko na skali)
          url: https://api.sejm.gov.pl/eli/acts/DU/2026/592/text.pdf
          article: art. 44 ust. 7c pkt 5
          quote: "w roku korzystania ze zwolnienia są opodatkowani na zasadach określonych w art. 27"
        - title: Dz.U. 2026 poz. 592, tekst jednolity ustawy o podatku dochodowym od osób fizycznych (dochód przy księdze przychodów i rozchodów)
          url: https://api.sejm.gov.pl/eli/acts/DU/2026/592/text.pdf
          article: art. 24 ust. 2
          quote: "dochodem z działalności jest różnica pomiędzy przychodem w rozumieniu art. 14 a kosztami uzyskania powiększona o różnicę"
        - title: Dz.U. 2026 poz. 592, tekst jednolity ustawy o podatku dochodowym od osób fizycznych (dochód do zaliczki przy księdze)
          url: https://api.sejm.gov.pl/eli/acts/DU/2026/592/text.pdf
          article: art. 44 ust. 2
          quote: "jest różnica pomiędzy wynikającym z tych ksiąg przychodem i kosztami jego uzyskania"
        - title: Dz.U. 2026 poz. 592, tekst jednolity ustawy o podatku dochodowym od osób fizycznych (wpłata po zeznaniu)
          url: https://api.sejm.gov.pl/eli/acts/DU/2026/592/text.pdf
          article: art. 45 ust. 4 pkt 3
          quote: "należny podatek dochodowy wynikający z zeznania, o którym mowa w ust. 1a pkt 2, albo różnicę pomiędzy podatkiem"
        - title: Dz.U. 2026 poz. 592, tekst jednolity ustawy o podatku dochodowym od osób fizycznych (podstawa i odliczenia)
          url: https://api.sejm.gov.pl/eli/acts/DU/2026/592/text.pdf
          article: art. 30c ust. 2
          quote: "Dochód ten podatnicy mogą pomniejszyć o: 1) składki na ubezpieczenia społeczne określone w art. 26 ust. 1 pkt 2 lit. a i pkt 2a"
        - title: Dz.U. 2026 poz. 592, tekst jednolity ustawy o podatku dochodowym od osób fizycznych (stawka)
          url: https://api.sejm.gov.pl/eli/acts/DU/2026/592/text.pdf
          article: art. 30c ust. 1
          quote: "z zastrzeżeniem art. 29 i art. 30, wynosi 19 % podstawy obliczenia podatku"
        - title: Dz.U. 2026 poz. 592, tekst jednolity ustawy o podatku dochodowym od osób fizycznych (zaliczki)
          url: https://api.sejm.gov.pl/eli/acts/DU/2026/592/text.pdf
          article: art. 44 ust. 3f
          quote: "wpłacać na rachunek urzędu skarbowego zaliczki miesięczne w wysokości różnicy między podatkiem należnym od dochodu osiągniętego od początku roku, obliczonym zgodnie z art. 30c"
        - title: Dz.U. 2026 poz. 592, tekst jednolity ustawy o podatku dochodowym od osób fizycznych (zaliczka do 1000 zł)
          url: https://api.sejm.gov.pl/eli/acts/DU/2026/592/text.pdf
          article: art. 44 ust. 15
          quote: "mogą nie wpłacać zaliczki obliczonej według zasad określonych w ust. 3 i ust. 3f–3h"
        - title: Dz.U. 2026 poz. 622, tekst jednolity Ordynacji podatkowej (zaokrąglenia)
          url: https://api.sejm.gov.pl/eli/acts/DU/2026/622/text.pdf
          article: art. 63 § 1
          quote: "Podstawy opodatkowania, kwoty podatków, odsetki za zwłokę, opłaty prolongacyjne, oprocentowanie nadpłat oraz wynagrodzenia przysługujące płatnikom i inkasentom zaokrągla się do pełnych złotych"
        - title: Dz.U. 2026 poz. 592, tekst jednolity ustawy o podatku dochodowym od osób fizycznych (zaliczki uproszczone)
          url: https://api.sejm.gov.pl/eli/acts/DU/2026/592/text.pdf
          article: art. 44 ust. 6j
          quote: "Zaliczkę obliczoną zgodnie z ust. 6h podatnik może obniżyć o kwotę stanowiącą 19 % składki na ubezpieczenie zdrowotne"
        - title: podatki.gov.pl (MF), Opodatkowanie podatkiem liniowym, aktualizacja 24.06.2026
          url: https://podatki.gov.pl/podatki-firmowe/pit/informacje-podstawowe/co-jest-opodatkowane/opodatkowanie-podatkiem-liniowym
          kind: control
          quote: "możesz zaliczać do kosztów uzyskania przychodów lub odliczać od dochodu składki na ubezpieczenie zdrowotne (do wysokości limitu)"
          as_of: 2026-11-26
        - title: podatki.gov.pl (MF), Odliczenie składek na ubezpieczenie zdrowotne PIT, aktualizacja 23.11.2026 (podatek liniowy)
          url: https://podatki.gov.pl/ulgi-i-odliczenia/odliczenie-skladek-na-ubezpieczenie-zdrowotne-pit
          kind: control
          quote: "Odliczasz składki na ubezpieczenie zdrowotne, które zapłaciłeś(-aś) w danym roku podatkowym"
          as_of: 2026-11-26
      verification: {checked_at: 2026-11-26, agent_check: 2026-11-26}

- id: zasada.skala_podatek
  name: Podatek według skali i zaliczki miesięczne
  kind: rule
  applies_to: {tax_form: [skala]}
  versions:
    - valid_from: 2026-01-01
      value:
        steps:
          - text: Ustal dochód z działalności według art. 9, art. 23o, art. 23u, art. 24 ust. 1, 2, 3b–3e, 4–4e, 6 i 21 albo art. 24b ust. 1 i 2 ustawy o PIT, z uwzględnieniem obniżenia o straty z lat poprzednich na zasadach art. 9 ust. 3. Przy podatkowej księdze przychodów i rozchodów dochodem jest różnica między przychodem a kosztami jego uzyskania, powiększona albo pomniejszona o różnicę między wartością remanentu końcowego i początkowego (art. 24 ust. 2 zdanie pierwsze). Ta zasada nie opisuje ustalania dochodu przy księgach rachunkowych (art. 24 ust. 1) ani dochodu z odpłatnego zbycia składników majątku (art. 24 ust. 2 zdanie drugie).
            uses: []
            basis: art. 26 ust. 1 zdanie pierwsze, art. 9 ust. 2 i 3 oraz art. 24 ust. 2 ustawy o podatku dochodowym od osób fizycznych
          - text: Od dochodu odlicz składki na ubezpieczenia społeczne z art. 26 ust. 1 pkt 2 lit. a i pkt 2a ustawy o PIT zapłacone w roku podatkowym, na warunkach z tych przepisów (przy pkt 2 bez składek, których podstawą są dochody zwolnione albo dochody, od których zaniechano poboru podatku; przy pkt 2a z zastrzeżeniem art. 26 ust. 13b i 13c). Odliczasz tylko składki, które nie zostały zaliczone do kosztów uzyskania przychodów, odliczone od dochodów opodatkowanych na zasadach art. 30c ani od przychodu na podstawie ustawy o zryczałtowanym podatku dochodowym i nie zostały zwrócone w jakiejkolwiek formie (art. 26 ust. 13a).
            uses: [zus.stawka.emerytalna, zus.stawka.rentowa, zus.stawka.chorobowa, zus.stawka.wypadkowa_do_9]
            basis: art. 26 ust. 1 pkt 2 lit. a i pkt 2a oraz ust. 13a–13c ustawy o podatku dochodowym od osób fizycznych
          - text: Od podstawy obliczenia podatku do progu podatek to podstawa pomnożona przez stawkę niższą, pomniejszona o kwotę zmniejszającą podatek. Od podstawy ponad próg podatek to kwota podatku od progu powiększona o stawkę wyższą od nadwyżki ponad próg.
            uses: [podatek.skala]
            basis: art. 27 ust. 1 ustawy o podatku dochodowym od osób fizycznych
          - text: Podstawę opodatkowania i kwotę podatku zaokrąglij do pełnych złotych; końcówki poniżej 50 groszy pomiń, a od 50 groszy podwyższ do pełnego złotego.
            uses: []
            basis: art. 63 § 1 Ordynacji podatkowej
          - text: Ta zasada nie opisuje pozostałych odliczeń od dochodu i od podatku (między innymi z art. 26 ust. 1 pkt 2b–9, art. 26e–26i, art. 27f i art. 52jb–52x ustawy o PIT), wspólnego opodatkowania małżonków i osób samotnie wychowujących dzieci (art. 6), łączenia dochodu z działalności z innymi dochodami opodatkowanymi według skali ani dochodów i podatku zagranicznego (metoda z art. 27 ust. 8 i odliczenie podatku zapłaconego za granicą z art. 27 ust. 9 i 9a).
            uses: []
            basis: art. 6, art. 26, art. 27 i art. 27f ustawy o podatku dochodowym od osób fizycznych
          - text: Przy zaliczkach miesięcznych obowiązek zaliczki powstaje od miesiąca, w którym dochody przekroczyły iloraz kwoty zmniejszającej podatek i stawki niższej (art. 44 ust. 3 pkt 1). Zaliczka za ten miesiąc to podatek od tego dochodu obliczony według kroków powyżej, z tym że przy podatkowej księdze przychodów i rozchodów dochodem do zaliczki jest różnica między przychodem a kosztami wynikającymi z księgi, a różnicę remanentową uwzględniasz tylko wtedy, gdy sporządzasz remanent na koniec miesiąca albo zarządzi to naczelnik urzędu skarbowego (art. 44 ust. 2); a za dalsze miesiące różnica między podatkiem od dochodu od początku roku a sumą zaliczek za miesiące poprzedzające. Zaliczki można nie wpłacać, jeżeli podatek od dochodu od początku roku pomniejszony o sumę wpłaconych zaliczek nie przekracza 1000 zł. Gdy ta kwota przekroczy 1000 zł, wpłać różnicę między podatkiem od dochodu od początku roku a sumą zaliczek wpłaconych od początku roku. Mały podatnik i podatnik rozpoczynający działalność mogą zamiast tego wpłacać zaliczki kwartalne (art. 44 ust. 3g i 3i), a podatnik może wybrać zaliczki uproszczone (art. 44 ust. 6b–6e); ta zasada tych sposobów nie opisuje. Nie opisuje też zwolnienia z zaliczek podatnika, który po raz pierwszy rozpoczął działalność (art. 44 ust. 7a–7k), braku zaliczek w okresie zawieszenia działalności (art. 44 ust. 10) ani korekty dochodu przy niezapłaconych należnościach i zobowiązaniach (art. 44 ust. 17–26).
            uses: [podatek.skala, termin.zaliczka_skala]
            basis: art. 44 ust. 2, ust. 3 pkt 1–3 i ust. 15 ustawy o podatku dochodowym od osób fizycznych
          - text: Po końcu roku podatek należny wykazujesz w zeznaniu rocznym. Przed upływem terminu złożenia zeznania wpłacasz różnicę między podatkiem należnym wynikającym z zeznania a sumą zapłaconych za ten rok zaliczek.
            uses: [termin.zeznanie_skala]
            basis: art. 45 ust. 1 i ust. 4 pkt 1 ustawy o podatku dochodowym od osób fizycznych
      note: >-
        Tekst jednolity uwzględnia stan prawny na 1 kwietnia 2026 r.; data początku obowiązywania (2026-01-01)
        nie jest potwierdzona źródłem. Wcześniejszych wersji nie wprowadzono.
      sources:
        - title: Dz.U. 2026 poz. 592, tekst jednolity ustawy o podatku dochodowym od osób fizycznych (podstawa)
          url: https://api.sejm.gov.pl/eli/acts/DU/2026/592/text.pdf
          article: art. 26 ust. 1
          quote: "zapłaconych w roku podatkowym bezpośrednio na własne ubezpieczenia emerytalne, rentowe, chorobowe oraz wypadkowe podatnika oraz osób z nim współpracujących"
        - title: Dz.U. 2026 poz. 592, tekst jednolity ustawy o podatku dochodowym od osób fizycznych (skala)
          url: https://api.sejm.gov.pl/eli/acts/DU/2026/592/text.pdf
          article: art. 27 ust. 1
          quote: "pobiera się od podstawy jego obliczenia według następującej skali podatkowej"
        - title: Dz.U. 2026 poz. 592, tekst jednolity ustawy o podatku dochodowym od osób fizycznych (zaliczki)
          url: https://api.sejm.gov.pl/eli/acts/DU/2026/592/text.pdf
          article: art. 44 ust. 3
          quote: "zaliczkę za dalsze miesiące ustala się w wysokości różnicy pomiędzy podatkiem należnym od dochodu osiągniętego od początku roku a sumą zaliczek za miesiące poprzedzające"
        - title: Dz.U. 2026 poz. 592, tekst jednolity ustawy o podatku dochodowym od osób fizycznych (zaliczka do 1000 zł)
          url: https://api.sejm.gov.pl/eli/acts/DU/2026/592/text.pdf
          article: art. 44 ust. 15
          quote: "pomniejszony o sumę zaliczek wpłaconych od początku roku nie przekracza 1000 zł"
        - title: Dz.U. 2026 poz. 592, tekst jednolity ustawy o podatku dochodowym od osób fizycznych (dochód przy księdze przychodów i rozchodów)
          url: https://api.sejm.gov.pl/eli/acts/DU/2026/592/text.pdf
          article: art. 24 ust. 2
          quote: "dochodem z działalności jest różnica pomiędzy przychodem w rozumieniu art. 14 a kosztami uzyskania powiększona o różnicę"
        - title: Dz.U. 2026 poz. 592, tekst jednolity ustawy o podatku dochodowym od osób fizycznych (początek obowiązku zaliczki)
          url: https://api.sejm.gov.pl/eli/acts/DU/2026/592/text.pdf
          article: art. 44 ust. 3 pkt 1
          quote: "obowiązek wpłacania zaliczki powstaje, poczynając od miesiąca, w którym dochody te przekroczyły kwotę stanowiącą"
        - title: Dz.U. 2026 poz. 592, tekst jednolity ustawy o podatku dochodowym od osób fizycznych (warunki odliczenia składek)
          url: https://api.sejm.gov.pl/eli/acts/DU/2026/592/text.pdf
          article: art. 26 ust. 13a
          quote: "Wydatki na cele określone w ust. 1 podlegają odliczeniu od dochodu, jeżeli nie zostały zaliczone do kosztów uzyskania przychodów"
        - title: Dz.U. 2026 poz. 592, tekst jednolity ustawy o podatku dochodowym od osób fizycznych (dochód do zaliczki przy księdze)
          url: https://api.sejm.gov.pl/eli/acts/DU/2026/592/text.pdf
          article: art. 44 ust. 2
          quote: "jest różnica pomiędzy wynikającym z tych ksiąg przychodem i kosztami jego uzyskania"
        - title: Dz.U. 2026 poz. 592, tekst jednolity ustawy o podatku dochodowym od osób fizycznych (wpłata różnicy po zeznaniu)
          url: https://api.sejm.gov.pl/eli/acts/DU/2026/592/text.pdf
          article: art. 45 ust. 4 pkt 1
          quote: "różnicę między podatkiem należnym wynikającym z zeznania, o którym mowa w ust. 1, a sumą zapłaconych za dany rok zaliczek"
        - title: Dz.U. 2026 poz. 622, tekst jednolity Ordynacji podatkowej (zaokrąglenia)
          url: https://api.sejm.gov.pl/eli/acts/DU/2026/622/text.pdf
          article: art. 63 § 1
          quote: "Podstawy opodatkowania, kwoty podatków, odsetki za zwłokę, opłaty prolongacyjne, oprocentowanie nadpłat oraz wynagrodzenia przysługujące płatnikom i inkasentom zaokrągla się do pełnych złotych"
        - title: biznes.gov.pl, Najważniejsze zasady opodatkowania według skali podatkowej, aktualizacja 07.01.2026
          url: https://www.biznes.gov.pl/pl/portal/00264
          kind: control
          quote: "Składki na ubezpieczenia społeczne możesz odliczyć od dochodu tylko wtedy, gdy nie zostały zaliczone do kosztów uzyskania przychodów albo nie zostały ci zwrócone w jakiejkolwiek formie."
          as_of: 2026-11-26
      verification: {checked_at: 2026-11-26, agent_check: 2026-11-26}

- id: zasada.ryczalt_zdrowotna_prog
  name: Wybór progu składki zdrowotnej na ryczałcie
  kind: rule
  applies_to: {tax_form: [ryczalt]}
  versions:
    - valid_from: 2025-01-01
      valid_to: 2026-12-31
      note: >-
        Poprawka: wcześniej wpisany okres 2026-02-01 – 2027-01-31 dotyczy skali i liniowego, nie ryczałtu,
        a krok 4 powoływał art. 81 ust. 2h, który dotyczy wyboru przychodu z poprzedniego roku.
        Ust. 2e-2i w tym brzmieniu obowiązują od 1 stycznia 2025 r. (Dz.U. 2024 poz. 1915).
        Poprawka 2026-11-26: dodany krok 2 o wyłączeniach z art. 81 ust. 2zd, którego brakowało (wskazał weryfikator).
      value:
        steps:
          - text: Ustal przychód z działalności osiągnięty od początku roku kalendarzowego, pomniejszony o opłacone składki emerytalną, rentową, chorobową i wypadkową, jeżeli nie zostały zaliczone do kosztów ani odliczone od dochodu. Funduszu Pracy nie odejmuj. Zamiast tego możesz przyjąć przychód z poprzedniego roku (zasada.ryczalt_zdrowotna_prog_poprzedni_rok).
            uses: [zasada.ryczalt_zdrowotna_prog_poprzedni_rok]
            basis: art. 81 ust. 2f i 2g ustawy o świadczeniach opieki zdrowotnej
          - text: Do przychodu nie wliczaj przychodów wyłączonych przez art. 81 ust. 2zd, czyli osiągniętych w okresie zawieszenia działalności (z wyjątkami wskazanymi w tym przepisie), niepodlegających opodatkowaniu (poza art. 21 ust. 1 pkt 63a, 63b i 152–154 ustawy o PIT), przychodów, o których mowa w art. 14 ust. 2 pkt 1 i 19 ustawy o PIT, oraz osiągniętych w miesiącu, w którym przysługiwało zwolnienie ze składki (art. 82 ust. 8–9a).
            uses: []
            basis: art. 81 ust. 2zd ustawy o świadczeniach opieki zdrowotnej
          - text: Porównaj tę kwotę z progami. Składka za miesiąc to kwota z parametru dla progu, w którym się mieści.
            uses: [zdrowotna.ryczalt.progi, zdrowotna.ryczalt.skladka]
            basis: art. 81 ust. 2f ustawy o świadczeniach opieki zdrowotnej
          - text: Po przekroczeniu progu w trakcie roku płać kwotę wyższego progu od miesiąca przekroczenia.
            uses: [zdrowotna.ryczalt.skladka]
            basis: art. 81 ust. 2f ustawy o świadczeniach opieki zdrowotnej
          - text: Po końcu roku ustal roczną składkę według progu dla rocznego przychodu, pomnożonej przez liczbę miesięcy podlegania ubezpieczeniu (bez miesięcy zwolnienia ze składki). Porównaj z sumą wpłat. Nadwyżkę odbierz, niedopłatę dopłać w rozliczeniu rocznym.
            uses: [zdrowotna.ryczalt.progi, zdrowotna.ryczalt.skladka, termin.roczne_rozliczenie_zdrowotnej]
            basis: art. 81 ust. 2e, 2ea, 2i, 2j, 2k i 2l ustawy o świadczeniach opieki zdrowotnej
      sources:
        - title: Dz.U. 2025 poz. 1461, tekst jednolity ustawy o świadczeniach opieki zdrowotnej
          url: https://api.sejm.gov.pl/eli/acts/DU/2025/1461/text.pdf
          quote: "osiągnięte od początku roku kalendarzowego, nie przekroczyły kwoty 60 000 zł"
          article: art. 81 ust. 2e-2l
        - title: Dz.U. 2025 poz. 1461, tekst jednolity ustawy o świadczeniach opieki zdrowotnej
          url: https://api.sejm.gov.pl/eli/acts/DU/2025/1461/text.pdf
          quote: "nie uwzględnia się w tych przychodach i kosztach ich uzyskania: 1) przychodów osiągniętych i kosztów poniesionych w okresie zawieszenia wykonywania działalności gospodarczej"
          article: art. 81 ust. 2zd
        - title: ZUS, poradnik „Polski Ład. Co zmienia się w przepisach dotyczących rozliczania składki na ubezpieczenie zdrowotne”, stan prawny na 1 stycznia 2025 r. (krok 1)
          url: https://www.zus.pl/documents/10182/3996913/Polski+%C3%83%E2%80%A6%C3%82%C2%81ad+-+poradnik.pdf/f4f5043f-4487-2e82-e93a-8f8d7cc6c5f9
          kind: control
          quote: "Przychody te pomniejsz o kwoty opłaconych składek na ubezpieczenia emerytalne, rentowe, chorobowe i wypadkowe, jeżeli nie zaliczyłeś ich do kosztów uzyskania przychodów lub odliczyłeś od dochodu"
          as_of: 2026-11-26
        - title: ZUS, poradnik „Polski Ład. Co zmienia się w przepisach dotyczących rozliczania składki na ubezpieczenie zdrowotne”, stan prawny na 1 stycznia 2025 r. (kroki 2 i 3)
          url: https://www.zus.pl/documents/10182/3996913/Polski+%C3%83%E2%80%A6%C3%82%C2%81ad+-+poradnik.pdf/f4f5043f-4487-2e82-e93a-8f8d7cc6c5f9
          kind: control
          quote: "jeśli przekroczysz kwotę przychodów w danym miesiącu, za ten miesiąc musisz rozliczyć składkę od podstawy wymiaru obowiązującej dla kolejnego progu przychodów"
          as_of: 2026-11-26
      verification: {checked_at: 2026-11-26, agent_check: 2026-11-26, open_issue: "Ustawa Dz.U. 2026 poz. 1542 zmienia art. 81 ust. 2zd pkt 2 od 1 stycznia 2027 r. bez przepisu przejściowego. Od którego miesiąca składkowego albo dla przychodów i dochodów z jakiego okresu stosuje się nowe brzmienie? Pytanie do eksperta: docs/pytania-do-eksperta.md, P8."}
    - valid_from: 2027-01-01
      note: >-
        Zmiana względem poprzedniej wersji: od 1 stycznia 2027 r. art. 81 ust. 2zd pkt 2 nie wymienia już art. 21 ust. 1
        pkt 63a ustawy o PIT (Dz.U. 2026 poz. 1542, art. 12); ta sama ustawa uchyla ten punkt w ustawie o PIT (art. 4
        pkt 1). Pozostałe kroki się nie zmieniają. Nowego brzmienia nie ma jeszcze w tekście jednolitym, więc źródłem jest ustawa zmieniająca.

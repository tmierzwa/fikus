- id: zasada.ryczalt_podstawa
  name: Podstawa opodatkowania ryczałtem
  kind: rule
  applies_to: {tax_form: [ryczalt]}
  versions:
    - valid_from: 2024-01-01
      value:
        steps:
          - text: Weź przychód z ewidencji przychodów za okres.
            uses: []
            basis: art. 6 ustawy o zryczałtowanym podatku dochodowym
          - text: Odejmij zapłacone składki społeczne (emerytalna, rentowa, chorobowa, wypadkowa), jeżeli nie zostały odliczone gdzie indziej. Funduszu Pracy i Funduszu Solidarnościowego nie odejmuj.
            uses: [zus.stawka.emerytalna, zus.stawka.rentowa, zus.stawka.chorobowa, zus.stawka.wypadkowa_do_9]
            basis: art. 11 ust. 1 ustawy o zryczałtowanym podatku dochodowym w zw. z art. 26 ust. 1 pkt 2 ustawy o podatku dochodowym od osób fizycznych
          - text: Odejmij 50% składki zdrowotnej zapłaconej w roku podatkowym, jeżeli nie została zwrócona.
            uses: [zdrowotna.ryczalt.skladka]
            basis: art. 11 ust. 1a ustawy o zryczałtowanym podatku dochodowym
          - text: Przy przychodach opodatkowanych różnymi stawkami odliczenia dziel w proporcji do tych przychodów.
            uses: []
            basis: art. 11 ust. 3 ustawy o zryczałtowanym podatku dochodowym
          - text: Jeżeli ewidencja przychodów pozwala ustalić przychody z każdego rodzaju działalności, pomnóż wynik dla każdego rodzaju przychodu przez stawkę z punktu art. 12 ust. 1, który obejmuje ten przychód.
            uses: [ryczalt.stawki]
            basis: art. 12 ust. 1 i ust. 3 zdanie pierwsze ustawy o zryczałtowanym podatku dochodowym
          - text: Jeżeli ewidencja tego nie pozwala, ryczałt wynosi 8,5% przychodów, z tym że przy osiąganiu również przychodów z pkt 1, 2, 2a, 2b, 3 albo 4 art. 12 ust. 1 wynosi stawkę wskazaną dla tego punktu w art. 12 ust. 3 zdanie drugie (dla pkt 1–3 taką samą jak w ust. 1, dla pkt 4 wyższą stawkę tego punktu). Do jakich przychodów stosuje się tę stawkę i którą wybrać przy przychodach z kilku takich punktów, jest niewyjaśnione (otwarte pytanie do eksperta).
            uses: [ryczalt.stawki]
            basis: art. 12 ust. 3 zdanie drugie ustawy o zryczałtowanym podatku dochodowym
      note: >-
        Poprawka: krok o składce zdrowotnej powoływał art. 11 ust. 1c (różnice kursowe), właściwy jest ust. 1a;
        dodany krok o proporcji z ust. 3, który w obecnym brzmieniu dotyczy przychodów od 1 stycznia 2024 r.,
        stąd początek obowiązywania 2024-01-01 (wcześniej 2022-01-01).
        Poprawka 2026-11-26: krok o stawce pomijał warunek z art. 12 ust. 3 zdanie pierwsze (stawki według rodzaju
        przychodu tylko przy ewidencji, która pozwala ustalić przychody z każdego rodzaju działalności); dodany krok
        o stawce bez takiej ewidencji (ust. 3 zdanie drugie), a oba kroki wskazują parametr ze stawkami ryczałtu.
      sources:
        - title: Dz.U. 2025 poz. 843, tekst jednolity ustawy o zryczałtowanym podatku dochodowym
          url: https://api.sejm.gov.pl/eli/acts/DU/2025/843/text.pdf
          quote: "mogą być pomniejszone o 50 % składek na ubezpieczenie zdrowotne zapłaconych w roku podatkowym"
          article: art. 11 ust. 1, 1a i 3, art. 12 ust. 1
        - title: Dz.U. 2025 poz. 843, tekst jednolity ustawy o zryczałtowanym podatku dochodowym (stawki przy różnych rodzajach przychodów)
          url: https://api.sejm.gov.pl/eli/acts/DU/2025/843/text.pdf
          quote: "pod warunkiem, że ewidencja przychodów jest prowadzona w sposób umożliwiający określenie przychodów z każdego rodzaju działalności"
          article: art. 12 ust. 3 zdanie pierwsze
        - title: Dz.U. 2025 poz. 843, tekst jednolity ustawy o zryczałtowanym podatku dochodowym (stawka bez takiej ewidencji)
          url: https://api.sejm.gov.pl/eli/acts/DU/2025/843/text.pdf
          quote: "ryczałt od przychodów ewidencjonowanych wynosi 8,5 % przychodów, z tym że w przypadku osiągania również przychodów"
          article: art. 12 ust. 3 zdanie drugie
        - title: biznes.gov.pl, Jak odliczyć składki ZUS przy rozliczaniu podatków, aktualizacja 23.04.2026 (krok 2)
          url: https://www.biznes.gov.pl/pl/portal/00230
          kind: control
          quote: "Jeśli rozliczasz się ryczałtem, składki na własne ubezpieczenia społeczne możesz odliczyć wyłącznie od przychodu"
          as_of: 2026-11-26
        - title: podatki.gov.pl (MF), Odliczenie składek na ubezpieczenie zdrowotne PIT, aktualizacja 23.11.2026 (kroki 3 i 4)
          url: https://podatki.gov.pl/ulgi-i-odliczenia/odliczenie-skladek-na-ubezpieczenie-zdrowotne-pit
          kind: control
          quote: "możesz od nich odliczyć 50% zapłaconych składek zdrowotnych . Ważne! Jeżeli osiągasz przychody opodatkowane różnymi stawkami, składki zdrowotne odliczasz proporcjonalnie"
          as_of: 2026-11-26
      verification:
        checked_at: 2026-11-26
        agent_check: 2026-11-26
        open_issue: "Art. 12 ust. 3 zdanie drugie ustawy o zryczałtowanym podatku dochodowym nie mówi wprost, czy stawka podwyższona (np. 17% przy przychodach także z pkt 1) dotyczy tylko przychodów z tego punktu, czy wszystkich przychodów, ani którą stawkę stosuje się przy przychodach z kilku punktów. Pytanie do eksperta: docs/pytania-do-eksperta.md, P6."

- id: zasada.zus_fundusz_pracy
  name: Obowiązek opłacania składek na Fundusz Pracy i Fundusz Solidarnościowy za siebie
  kind: rule
  versions:
    - valid_from: 2026-01-01
      value:
        steps:
          - text: Składkę na Fundusz Pracy liczysz od podstawy wymiaru składek emerytalnej i rentowej bez rocznego ograniczenia tej podstawy. Opłacasz ją, jeżeli ta podstawa w przeliczeniu na miesiąc wynosi co najmniej minimalne wynagrodzenie.
            uses: [zus.stawka.fundusz_pracy, wynagrodzenie.minimalne]
            basis: art. 259 ust. 1 pkt 4 ustawy o rynku pracy i służbach zatrudnienia
          - text: Jeżeli podlegasz obowiązkowym ubezpieczeniom emerytalnemu i rentowym także z innych tytułów, obowiązek powstaje, gdy łączna podstawa ze wszystkich tytułów wynosi co najmniej minimalne wynagrodzenie; wtedy składasz oświadczenie każdemu pracodawcy albo w ZUS.
            uses: [wynagrodzenie.minimalne]
            basis: art. 259 ust. 2 i 3 ustawy o rynku pracy i służbach zatrudnienia
          - text: Przy podstawie preferencyjnej, niższej od minimalnego wynagrodzenia, składki na Fundusz Pracy nie opłacasz, chyba że łączna podstawa z poprzedniego kroku osiąga minimalne wynagrodzenie.
            uses: [zus.podstawa_preferencyjna, wynagrodzenie.minimalne]
            basis: art. 259 ust. 1 pkt 4 i ust. 2 ustawy o rynku pracy i służbach zatrudnienia
          - text: Składki na Fundusz Pracy nie opłaca się za kobietę, która ukończyła 55 lat, ani za mężczyznę, który ukończył 60 lat. Nie opłacasz jej też za miesiąc zwolnienia ze składek na własne ubezpieczenia emerytalne i rentowe na podstawie art. 17a ust. 1 ustawy o systemie ubezpieczeń społecznych.
            uses: []
            basis: art. 259 ust. 1 pkt 4 lit. o i art. 261 ustawy o rynku pracy i służbach zatrudnienia
          - text: Do składki na Fundusz Solidarnościowy stosuje się odpowiednio przepisy o składce na Fundusz Pracy. Obie składki liczysz łącznie, według sumy ich stóp, i wykazujesz w deklaracji rozliczeniowej w jednej kwocie. Za miesiąc zwolnienia na podstawie art. 17a ustawy o systemie ubezpieczeń społecznych nie opłacasz za siebie także składki na Fundusz Solidarnościowy.
            uses: [zus.stawka.fundusz_pracy, zus.stawka.fundusz_solidarnosciowy]
            basis: art. 4 ust. 1 i 1a oraz art. 5 ust. 2 ustawy o Funduszu Solidarnościowym
      note: >-
        Wersja zaczyna się razem ze stawkami Funduszu Pracy i Funduszu Solidarnościowego na 2026 r. Te przepisy
        obowiązują wcześniej (ustawa o rynku pracy i służbach zatrudnienia od 1 czerwca 2025 r.), ale okresu sprzed
        2026 r. ta wersja nie obejmuje. Ustawa o rynku pracy nie ma jeszcze tekstu jednolitego; cytowany jest tekst
        ogłoszony, a jej nowelizacje nie zmieniają art. 259–261.
      sources:

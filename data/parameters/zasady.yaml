- id: zasada.ryczalt_podstawa
  name: Podstawa opodatkowania ryczałtem
  kind: rule
  applies_to: {tax_form: [ryczalt]}
  versions:
    - valid_from: 2024-01-01
      value:
        steps:
          - text: Weź przychód z ewidencji przychodów za okres.
            uses: []
            basis: art. 6 ustawy o zryczałtowanym podatku dochodowym
          - text: Odejmij zapłacone składki społeczne (emerytalna, rentowa, chorobowa, wypadkowa), jeżeli nie zostały odliczone gdzie indziej. Funduszu Pracy i Funduszu Solidarnościowego nie odejmuj.
            uses: [zus.stawka.emerytalna, zus.stawka.rentowa, zus.stawka.chorobowa, zus.stawka.wypadkowa_do_9]
            basis: art. 11 ust. 1 ustawy o zryczałtowanym podatku dochodowym w zw. z art. 26 ust. 1 pkt 2 ustawy o podatku dochodowym od osób fizycznych
          - text: Odejmij 50% składki zdrowotnej zapłaconej w roku podatkowym, jeżeli nie została zwrócona.
            uses: [zdrowotna.ryczalt.skladka]
            basis: art. 11 ust. 1a ustawy o zryczałtowanym podatku dochodowym
          - text: Przy przychodach opodatkowanych różnymi stawkami odliczenia dziel w proporcji do tych przychodów.
            uses: []
            basis: art. 11 ust. 3 ustawy o zryczałtowanym podatku dochodowym
          - text: Jeżeli ewidencja przychodów pozwala ustalić przychody z każdego rodzaju działalności, pomnóż wynik dla każdego rodzaju przychodu przez stawkę z punktu art. 12 ust. 1, który obejmuje ten przychód.
            uses: [ryczalt.stawki]
            basis: art. 12 ust. 1 i ust. 3 zdanie pierwsze ustawy o zryczałtowanym podatku dochodowym
          - text: Jeżeli ewidencja tego nie pozwala, ryczałt wynosi 8,5% przychodów, z tym że przy osiąganiu również przychodów z pkt 1, 2, 2a, 2b, 3 albo 4 art. 12 ust. 1 wynosi stawkę wskazaną dla tego punktu w art. 12 ust. 3 zdanie drugie (dla pkt 1–3 taką samą jak w ust. 1, dla pkt 4 wyższą stawkę tego punktu). Do jakich przychodów stosuje się tę stawkę i którą wybrać przy przychodach z kilku takich punktów, jest niewyjaśnione (otwarte pytanie do eksperta).
            uses: [ryczalt.stawki]
            basis: art. 12 ust. 3 zdanie drugie ustawy o zryczałtowanym podatku dochodowym
      note: >-
        Krok o proporcji z ust. 3 w obecnym brzmieniu dotyczy przychodów od 1 stycznia 2024 r., stąd data początku obowiązywania. Korekty: zmieniona podstawa kroku o składce zdrowotnej, zmieniony okres, dodane kroki o proporcji z ust. 3 i o stawce bez ewidencji, która pozwala ustalić przychody z każdego rodzaju działalności (art. 12 ust. 3 zdanie drugie).
      sources:
        - title: Dz.U. 2025 poz. 843, tekst jednolity ustawy o zryczałtowanym podatku dochodowym
          url: https://api.sejm.gov.pl/eli/acts/DU/2025/843/text.pdf
          quote: "mogą być pomniejszone o 50 % składek na ubezpieczenie zdrowotne zapłaconych w roku podatkowym"
          article: art. 11 ust. 1, 1a i 3, art. 12 ust. 1
        - title: Dz.U. 2025 poz. 843, tekst jednolity ustawy o zryczałtowanym podatku dochodowym (stawki przy różnych rodzajach przychodów)
          url: https://api.sejm.gov.pl/eli/acts/DU/2025/843/text.pdf
          quote: "pod warunkiem, że ewidencja przychodów jest prowadzona w sposób umożliwiający określenie przychodów z każdego rodzaju działalności"
          article: art. 12 ust. 3 zdanie pierwsze
        - title: Dz.U. 2025 poz. 843, tekst jednolity ustawy o zryczałtowanym podatku dochodowym (stawka bez takiej ewidencji)
          url: https://api.sejm.gov.pl/eli/acts/DU/2025/843/text.pdf
          quote: "ryczałt od przychodów ewidencjonowanych wynosi 8,5 % przychodów, z tym że w przypadku osiągania również przychodów"
          article: art. 12 ust. 3 zdanie drugie
        - title: podatki.gov.pl (MF), Odliczenie składek na ubezpieczenie zdrowotne PIT, aktualizacja 23.11.2026 (kroki 3 i 4)
          url: https://podatki.gov.pl/ulgi-i-odliczenia/odliczenie-skladek-na-ubezpieczenie-zdrowotne-pit
          quote: "możesz od nich odliczyć 50% zapłaconych składek zdrowotnych . Ważne! Jeżeli osiągasz przychody opodatkowane różnymi stawkami, składki zdrowotne odliczasz proporcjonalnie"
          as_of: 2026-11-26
      verification:
        checked_at: 2026-11-26
        agent_check: 2026-11-26
        open_issue_scope: edge_case
        open_issue: "Art. 12 ust. 3 zdanie drugie ustawy o zryczałtowanym podatku dochodowym nie mówi wprost, czy stawka podwyższona (np. 17% przy przychodach także z pkt 1) dotyczy tylko przychodów z tego punktu, czy wszystkich przychodów, ani którą stawkę stosuje się przy przychodach z kilku punktów. Pytanie do eksperta: docs/pytania-do-eksperta.md, P6."

- id: zasada.zus_fundusz_pracy
  name: Obowiązek opłacania składek na Fundusz Pracy i Fundusz Solidarnościowy za siebie
  kind: rule
  versions:
    - valid_from: 2026-01-01
      value:
        steps:
          - text: Składkę na Fundusz Pracy liczysz od podstawy wymiaru składek emerytalnej i rentowej bez ograniczenia, o którym mowa w art. 19 ust. 1 ustawy o systemie ubezpieczeń społecznych. Opłaca się ją, jeżeli ta podstawa w przeliczeniu na miesiąc wynosi co najmniej minimalne wynagrodzenie.
            uses: [zus.stawka.fundusz_pracy, wynagrodzenie.minimalne]
            basis: art. 259 ust. 1 pkt 4 ustawy o rynku pracy i służbach zatrudnienia
          - text: Jeżeli podlegasz obowiązkowym ubezpieczeniom emerytalnemu i rentowym także z innych tytułów, obowiązek powstaje, gdy łączna podstawa ze wszystkich tytułów wynosi co najmniej minimalne wynagrodzenie.
            uses: [wynagrodzenie.minimalne]
            basis: art. 259 ust. 2 ustawy o rynku pracy i służbach zatrudnienia
          - text: W takim przypadku składasz oświadczenie każdemu pracodawcy albo, jeżeli sam opłacasz składki na ubezpieczenia społeczne, w ZUS.
            uses: []
            basis: art. 259 ust. 3 ustawy o rynku pracy i służbach zatrudnienia
          - text: Przy podstawie preferencyjnej, niższej od minimalnego wynagrodzenia, składki na Fundusz Pracy nie opłacasz, chyba że łączna podstawa z kroku o kilku tytułach osiąga minimalne wynagrodzenie.
            uses: [zus.podstawa_preferencyjna, wynagrodzenie.minimalne]
            basis: art. 259 ust. 1 pkt 4 i ust. 2 ustawy o rynku pracy i służbach zatrudnienia
          - text: Składki na Fundusz Pracy nie opłaca się za kobietę, która ukończyła 55 lat, ani za mężczyznę, który ukończył 60 lat.
            uses: []
            basis: art. 261 ustawy o rynku pracy i służbach zatrudnienia
          - text: Nie opłacasz jej też za miesiąc zwolnienia ze składek na własne ubezpieczenia emerytalne i rentowe na podstawie art. 17a ust. 1 ustawy o systemie ubezpieczeń społecznych.
            uses: []
            basis: art. 259 ust. 1 pkt 4 lit. o ustawy o rynku pracy i służbach zatrudnienia
          - text: Do składki na Fundusz Solidarnościowy stosuje się odpowiednio przepisy o składce na Fundusz Pracy.
            uses: [zus.stawka.fundusz_solidarnosciowy]
            basis: art. 4 ust. 1 ustawy o Funduszu Solidarnościowym
          - text: Obie składki liczysz łącznie, według sumy ich stóp, i wykazujesz w deklaracji rozliczeniowej w jednej kwocie.
            uses: [zus.stawka.fundusz_pracy, zus.stawka.fundusz_solidarnosciowy]
            basis: art. 5 ust. 2 ustawy o Funduszu Solidarnościowym
          - text: Za miesiąc zwolnienia na podstawie art. 17a ustawy o systemie ubezpieczeń społecznych nie opłacasz za siebie także składki na Fundusz Solidarnościowy.
            uses: []
            basis: art. 4 ust. 1a ustawy o Funduszu Solidarnościowym
      note: >-
        Wersja zaczyna się razem ze stawkami Funduszu Pracy i Funduszu Solidarnościowego na 2026 r. Te przepisy
        obowiązują wcześniej (ustawa o rynku pracy i służbach zatrudnienia od 1 czerwca 2025 r.), ale okresu sprzed
        2026 r. ta wersja nie obejmuje. Ustawa o rynku pracy nie ma jeszcze tekstu jednolitego; cytowany jest tekst
        ogłoszony, a jej nowelizacje nie zmieniają art. 259–261. Korekta z 27 listopada 2026 r.: zmienione kroki
        (pięć kroków podzielonych na dziewięć, zmienione brzmienie kroków 1, 3 i 4).
      sources:
        - title: Dz.U. 2025 poz. 620, ustawa z 20 marca 2025 r. o rynku pracy i służbach zatrudnienia
          url: https://api.sejm.gov.pl/eli/acts/DU/2025/620/text.pdf
          article: art. 259 ust. 1
          quote: >-
            Obowiązkowe składki na Fundusz Pracy, ustalone od kwot stanowiących podstawę wymiaru składek na
            ubezpieczenia emerytalne i rentowe bez stosowania ograniczenia, o którym mowa w art. 19 ust. 1 ustawy
            z dnia 13 października 1998 r. o systemie ubezpieczeń społecznych, wynoszących w przeliczeniu na okres
            miesiąca co najmniej minimalne wynagrodzenie za pracę, opłacają
          confirms: [step_1]
        - title: Dz.U. 2025 poz. 620, ustawa o rynku pracy i służbach zatrudnienia (różne źródła)
          url: https://api.sejm.gov.pl/eli/acts/DU/2025/620/text.pdf
          article: art. 259 ust. 2
          quote: >-
            W przypadku gdy kwoty, o których mowa w ust. 1, pochodzą z różnych źródeł, obowiązek opłacania składek
            na Fundusz Pracy powstaje wtedy, gdy łączna kwota stanowiąca podstawę wymiaru składek, ustalona zgodnie
            z ust. 1, wynosi co najmniej minimalne wynagrodzenie za pracę
          confirms: [step_2]
        - title: Dz.U. 2025 poz. 620, ustawa o rynku pracy i służbach zatrudnienia (oświadczenie)
          url: https://api.sejm.gov.pl/eli/acts/DU/2025/620/text.pdf
          article: art. 259 ust. 3
          quote: >-
            Osoba, do której ma zastosowanie przepis ust. 2, składa stosowne oświadczenie każdemu pracodawcy lub
            w terenowej jednostce organizacyjnej Zakładu Ubezpieczeń Społecznych, jeżeli sama opłaca składki na
            ubezpieczenia społeczne.
          confirms: [step_3]
        - title: Dz.U. 2025 poz. 620, ustawa o rynku pracy i służbach zatrudnienia (wiek)
          url: https://api.sejm.gov.pl/eli/acts/DU/2025/620/text.pdf
          article: art. 261
          quote: >-
            Obowiązkowe składki na Fundusz Pracy opłaca się za osoby wymienione w art. 259 ust. 1, które nie
            osiągnęły wieku wynoszącego co najmniej 55 lat w przypadku kobiet i co najmniej 60 lat w przypadku mężczyzn.
          confirms: [step_5]
        - title: Dz.U. 2025 poz. 620, ustawa o rynku pracy i służbach zatrudnienia (miesiąc zwolnienia)
          url: https://api.sejm.gov.pl/eli/acts/DU/2025/620/text.pdf
          article: art. 259 ust. 1 pkt 4 lit. o
          quote: >-
            4) inne niż wymienione w pkt 1–3 osoby podlegające ubezpieczeniom emerytalnemu i rentowym lub
            zaopatrzeniu emerytalnemu, z wyjątkiem: a) duchownych, b) osób pobierających na podstawie ustawy z dnia
            28 listopada 2003 r. o świadczeniach rodzinnych świadczenie pielęgnacyjne lub specjalny zasiłek
            opiekuńczy, c) osób pobierających na podstawie ustawy z dnia 4 kwietnia 2014 r. o ustaleniu i wypłacie
            zasiłków dla opiekunów zasiłek dla opiekuna, d) osób podlegających ubezpieczeniu społecznemu rolników,
            e) żołnierzy niezawodowych w służbie czynnej, f) osób odbywających zastępcze formy służby wojskowej,
            g) osób przebywających na urlopach wychowawczych oraz pobierających zasiłek macierzyński, h) osób
            świadczących pracę na podstawie umowy uaktywniającej, o której mowa w art. 50 ustawy z dnia 4 lutego
            2011 r. o opiece nad dziećmi w wieku do lat 3, i) osób sprawujących osobistą opiekę nad dzieckiem,
            o których mowa w art. 6a ust. 1 ustawy z dnia 13 października 1998 r. o systemie ubezpieczeń
            społecznych, j) osób pobierających zasiłek lub inne świadczenie finansowane z Funduszu Pracy, k) osób
            otrzymujących stypendium doktoranckie, l) pobierających stypendium słuchaczy Krajowej Szkoły
            Administracji Publicznej im. Prezydenta Rzeczypospolitej Polskiej Lecha Kaczyńskiego, m) osób
            pobierających świadczenie szkoleniowe, o którym mowa w art. 217 ust. 6, n) osób niepodejmujących
            zatrudnienia lub innej pracy zarobkowej ze względu na potrzebę udzielenia wsparcia osobie pobierającej
            świadczenie wspierające, o których mowa w art. 6c ust. 1 ustawy z dnia 13 października 1998 r.
            o systemie ubezpieczeń społecznych, o) osób zwolnionych z opłacania składek na własne obowiązkowe
            ubezpieczenia emerytalne i rentowe, za wskazany jeden miesiąc kalendarzowy w danym roku kalendarzowym,
            o których mowa w art. 17a ust. 1 ustawy z dnia 13 października 1998 r. o systemie ubezpieczeń społecznych.
          confirms: [step_6]
        - title: Dz.U. 2024 poz. 1848, tekst jednolity ustawy o Funduszu Solidarnościowym (miesiąc zwolnienia)
          url: https://api.sejm.gov.pl/eli/acts/DU/2024/1848/text.pdf
          article: art. 4 ust. 1a
          quote: >-
            Płatnik składek nie opłaca za siebie składki na Fundusz Solidarnościowy za miesiąc korzystania ze
            zwolnienia z opłacenia składek na ubezpieczenia emerytalne, rentowe i wypadkowe zgodnie z art. 17a
            ustawy z dnia 13 października 1998 r. o systemie ubezpieczeń społecznych
          confirms: [step_9]
        - title: Dz.U. 2024 poz. 1848, tekst jednolity ustawy o Funduszu Solidarnościowym
          url: https://api.sejm.gov.pl/eli/acts/DU/2024/1848/text.pdf
          article: art. 4 ust. 1
          quote: "Do obowiązkowych składek na Fundusz stosuje się odpowiednio przepisy dotyczące obowiązkowych składek na Fundusz Pracy."
          confirms: [step_7]
        - title: Dz.U. 2024 poz. 1848, tekst jednolity ustawy o Funduszu Solidarnościowym (łączne rozliczenie)
          url: https://api.sejm.gov.pl/eli/acts/DU/2024/1848/text.pdf
          article: art. 5 ust. 2
          quote: >-
            Składki na Fundusz płatnik składek oblicza łącznie ze składkami na Fundusz Pracy w wysokości sumy stóp
            procentowych tych składek i wykazuje w deklaracji rozliczeniowej w łącznej kwocie.
          confirms: [step_8]
        - title: ZUS, Składki preferencyjne (Fundusz Pracy i Fundusz Solidarnościowy)
          url: https://www.zus.pl/firmy/rozliczenia-z-zus/skladki-preferencyjne
          quote: >-
            Jeśli opłacasz niższe składki na ubezpieczenia społeczne (czyli obliczone od 30 proc. minimalnego
            wynagrodzenia), z zasady nie opłacasz składek na Fundusz Pracy i Fundusz Solidarnościowy. Wyjątkowo
            opłacasz składkę na Fundusz Pracy i Fundusz Solidarnościowy, jeśli jesteś objęty obowiązkowym
            ubezpieczeniem emerytalnym i obowiązkowymi ubezpieczeniami rentowymi również z innych tytułów (takich
            jak np. umowa o pracę, umowa zlecenia). Ponadto suma kwot, od których obliczane są Twoje składki, musi
            wynosić co najmniej tyle, ile wynosi minimalne wynagrodzenie za pracę.
          as_of: 2026-11-27
          confirms: [step_4]
        - title: ZUS, Fundusz Pracy (wiek i próg minimalnego wynagrodzenia)
          url: https://www.zus.pl/pracujacy/fundusze-pozaubezpieczeniowe/fp
          quote: "Nie musisz opłacać składki na FP, jeśli podstawa wymiaru przeliczona na okres miesiąca jest niższa od minimalnego wynagrodzenia za pracę"
          as_of: 2026-11-26
        - title: ZUS, poradnik „Zasady opłacania składek na Fundusz Pracy, Fundusz Gwarantowanych Świadczeń Pracowniczych, Fundusz Emerytur Pomostowych oraz Fundusz Solidarnościowy”, stan prawny na 1 czerwca 2025 r. (podstawa i próg)
          url: https://www.zus.pl/documents/10182/167567/Zasady+op%C5%82acania+sk%C5%82adek+na+Fundusz+Pracy%2C+Fundusz+Gwarantowanych+%C5%9Awiadcze%C5%84+Pracowniczych+oraz+Fundusz+Emerytur+Pomostowych.pdf/92a5c5b1-cf05-4869-8845-538a48fd5129
          quote: >-
            Składki na Fundusz Pracy są ustalane od kwot stanowiących podstawę wymiaru składek na ubezpieczenia
            emerytalne i rentowe (nie stosuje się ograniczenia, o którym mowa w art. 19 ust. 1 ustawy o s.u.s.),
            które wynoszą – w przeliczeniu na miesiąc – co najmniej minimalne wynagrodzenie za pracę.
          as_of: 2026-11-27
          confirms: [step_1]
        - title: ZUS, poradnik „Zasady opłacania składek na Fundusz Pracy…”, stan prawny na 1 czerwca 2025 r. (kilka tytułów)
          url: https://www.zus.pl/documents/10182/167567/Zasady+op%C5%82acania+sk%C5%82adek+na+Fundusz+Pracy%2C+Fundusz+Gwarantowanych+%C5%9Awiadcze%C5%84+Pracowniczych+oraz+Fundusz+Emerytur+Pomostowych.pdf/92a5c5b1-cf05-4869-8845-538a48fd5129
          quote: >-
            Jeżeli ubezpieczony podlega obowiązkowo ubezpieczeniu emerytalnemu i ubezpieczeniom rentowym z więcej
            niż jednego tytułu, obowiązek opłacania składek na Fundusz Pracy powstaje, gdy łączna kwota, która
            stanowi podstawę wymiaru składek na ubezpieczenia emerytalne i rentowe z tych tytułów, wyniesie co
            najmniej minimalne wynagrodzenie za pracę.
          as_of: 2026-11-27
          confirms: [step_2]
        - title: ZUS, poradnik „Zasady opłacania składek na Fundusz Pracy…”, stan prawny na 1 czerwca 2025 r. (wiek)
          url: https://www.zus.pl/documents/10182/167567/Zasady+op%C5%82acania+sk%C5%82adek+na+Fundusz+Pracy%2C+Fundusz+Gwarantowanych+%C5%9Awiadcze%C5%84+Pracowniczych+oraz+Fundusz+Emerytur+Pomostowych.pdf/92a5c5b1-cf05-4869-8845-538a48fd5129
          quote: "Składek na Fundusz Pracy nie opłaca się za kobiety, które skończyły 55 lat, i mężczyzn, którzy skończyli 60 lat."
          as_of: 2026-11-27
          confirms: [step_5]
        - title: ZUS, poradnik „Zasady opłacania składek na Fundusz Pracy…”, stan prawny na 1 czerwca 2025 r. (Fundusz Solidarnościowy)
          url: https://www.zus.pl/documents/10182/167567/Zasady+op%C5%82acania+sk%C5%82adek+na+Fundusz+Pracy%2C+Fundusz+Gwarantowanych+%C5%9Awiadcze%C5%84+Pracowniczych+oraz+Fundusz+Emerytur+Pomostowych.pdf/92a5c5b1-cf05-4869-8845-538a48fd5129
          quote: "Do obowiązkowych składek na FS należy stosować zasady dotyczące obowiązkowych składek na Fundusz Pracy."
          as_of: 2026-11-27
          confirms: [step_7]
        - title: ZUS, poradnik „Zasady opłacania składek na Fundusz Pracy…”, stan prawny na 1 czerwca 2025 r. (łączne rozliczenie)
          url: https://www.zus.pl/documents/10182/167567/Zasady+op%C5%82acania+sk%C5%82adek+na+Fundusz+Pracy%2C+Fundusz+Gwarantowanych+%C5%9Awiadcze%C5%84+Pracowniczych+oraz+Fundusz+Emerytur+Pomostowych.pdf/92a5c5b1-cf05-4869-8845-538a48fd5129
          quote: >-
            Składki na FS oblicza się łącznie ze składkami na Fundusz Pracy w wysokości sumy stóp procentowych tych
            składek i wykazuje je w łącznej kwocie w polu 01 w bloku VII deklaracji rozliczeniowej ZUS DRA.
          as_of: 2026-11-27
          confirms: [step_8]
        - title: ZUS, „ABC płatnika składek – jednoosobowa działalność gospodarcza” (preferencyjne składki i kilka tytułów)
          url: https://www.zus.pl/documents/10182/167561/ABC_platnika_skladek_skladki_na_ubezpieczenia_wlasne.pdf/cd145d00-c406-48b9-991a-4a427769282a
          quote: >-
            Składek na Fundusz Pracy i Fundusz Solidarnościowy nie musisz opłacać, gdy podstawa wymiaru składek na
            obowiązkowe ubezpieczenia emerytalne i rentowe w przeliczeniu na miesiąc (łącznie ze wszystkich tytułów
            do tych ubezpieczeń, u wszystkich płatników) jest niższa od minimalnego wynagrodzenia. Zatem jeśli
            opłacasz składki na preferencyjnych zasadach (pierwsze 24 miesiące działalności), nie musisz opłacać
            tych składek, pod warunkiem że prowadzenie działalności gospodarczej jest Twoim jedynym tytułem do
            obowiązkowych ubezpieczeń społecznych.
          as_of: 2026-11-27
          confirms: [step_4]
        - title: ZUS, „Wakacje składkowe – zwolnienie z opłacania składek ZUS” (Fundusz Pracy i Fundusz Solidarnościowy)
          url: https://www.zus.pl/-/wakacje-sk%C5%82adkowe-zwolnienie-z-op%C5%82acania-sk%C5%82adek-zus
          quote: >-
            Zgodnie z nowymi przepisami przedsiębiorcy mogą raz w roku za wybrany miesiąc nie płacić za siebie składek
            na ubezpieczenia społeczne. Z ulgi można będzie skorzystać niezależnie od formy rozliczania podatku
            dochodowego (PIT, ryczałt, karta podatkowa). Gdy przedsiębiorca złoży wniosek, może uzyskać zwolnienie
            z opłacenia składek na: własne obowiązkowe ubezpieczenia społeczne: emerytalne, rentowe i wypadkowe; własne
            dobrowolne ubezpieczenie chorobowe; Fundusz Pracy i Fundusz Solidarnościowy.
          as_of: 2026-11-27
          confirms: [step_6, step_9]
      verification: {checked_at: 2026-11-27, agent_check: 2026-11-27}

- id: zasada.liniowy_zdrowotna
  name: Składka zdrowotna przy podatku liniowym
  kind: rule
  applies_to: {tax_form: [liniowy]}
  versions:
    - valid_from: 2025-02-01
      valid_to: 2026-01-31
      value:
        steps:
          - text: Składka jest miesięczna i niepodzielna, z zastrzeżeniem art. 79a oraz rocznej podstawy i rocznego rozliczenia opisanych w dalszych krokach (art. 81 ust. 2). Jeżeli prowadzisz więcej niż jedną pozarolniczą działalność, składkę opłacasz od sumy dochodów z nich, a tak ustalona podstawa nie może być niższa niż minimalna roczna podstawa z kroku o niej.
            uses: []
            basis: art. 79 ust. 2 i art. 82 ust. 2a ustawy o świadczeniach opieki zdrowotnej
          - text: Miesięczną podstawą jest dochód z działalności z miesiąca poprzedzającego miesiąc, za który płacisz składkę. Za pierwszy miesiąc podlegania ubezpieczeniu w roku składkowym to przychody pomniejszone o koszty ich uzyskania w rozumieniu ustawy o PIT. Za kolejne miesiące to przychody pomniejszone o koszty od początku roku, pomniejszone o sumę dochodów ustalonych za miesiące poprzedzające.
            uses: []
            basis: art. 81 ust. 2c pkt 1, 3 i 4 ustawy o świadczeniach opieki zdrowotnej
          - text: Dochód za pierwszy miesiąc pomniejsz o składki emerytalną, rentową, chorobową i wypadkową opłacone w tym miesiącu, a dochód za kolejne miesiące o różnicę między tymi składkami zapłaconymi od początku roku a składkami odliczonymi w poprzednich miesiącach. Nie odejmuj składek zaliczonych do kosztów uzyskania przychodów ani składek opłaconych w miesiącu, w którym przysługiwało zwolnienie ze składki (art. 82 ust. 8–9a).
            uses: []
            basis: art. 81 ust. 2c pkt 2 i 4 oraz ust. 2zf ustawy o świadczeniach opieki zdrowotnej
          - text: Przy ustalaniu dochodu stosuj art. 24 ust. 1 i ust. 2 zdanie pierwsze oraz uwzględnij art. 14c i art. 22 ust. 4a i 4b ustawy o PIT; przy podatkowej księdze przychodów i rozchodów ustal dochód z uwzględnieniem art. 44 ust. 2 zdanie drugie tej ustawy.
            uses: []
            basis: art. 81 ust. 2c pkt 5 ustawy o świadczeniach opieki zdrowotnej
          - text: Do przychodów i kosztów nie wliczaj tych, które wyłącza art. 81 ust. 2zd, czyli przychodów i kosztów z okresu zawieszenia działalności (z wyjątkami wskazanymi w tym przepisie), przychodów niepodlegających opodatkowaniu (poza art. 21 ust. 1 pkt 63a, 63b i 152–154 ustawy o PIT), przychodów, o których mowa w art. 14 ust. 2 pkt 1 i 19 ustawy o PIT, i kosztów, o których mowa w art. 23 ust. 1 pkt 1 tej ustawy, oraz przychodów i kosztów z miesiąca, w którym przysługiwało zwolnienie ze składki (art. 82 ust. 8–9a). Wyjątek dla rocznej podstawy opisuje krok o rocznej podstawie.
            uses: []
            basis: art. 81 ust. 2zd ustawy o świadczeniach opieki zdrowotnej
          - text: Jeżeli tak ustalona miesięczna podstawa jest niższa od 75% minimalnego wynagrodzenia obowiązującego w pierwszym dniu roku składkowego, podstawą za ten miesiąc jest ta kwota.
            uses: []
            basis: art. 81 ust. 2d ustawy o świadczeniach opieki zdrowotnej w zw. z art. 4 pkt 2 lit. a ustawy z 6 grudnia 2024 r. (Dz.U. 2024 poz. 1915)
          - text: Składka za miesiąc to podstawa pomnożona przez stopę składki przy podatku liniowym, nie mniej jednak niż minimalna składka zdrowotna.
            uses: [zdrowotna.liniowy.stawka, zdrowotna.minimum]
            basis: art. 79a ust. 1 pkt 1 ustawy o świadczeniach opieki zdrowotnej w zw. z art. 4 pkt 1 lit. a ustawy z 6 grudnia 2024 r. (Dz.U. 2024 poz. 1915)
          - text: Za miesiąc, w którym spełniasz warunki zwolnienia z art. 82 ust. 8–9a, składki nie opłacasz.
            uses: []
            basis: art. 82 ust. 8–9a ustawy o świadczeniach opieki zdrowotnej
          - text: Po końcu roku ustal roczną podstawę. Jest nią dochód z działalności za rok kalendarzowy, czyli przychody pomniejszone o koszty ich uzyskania w rozumieniu ustawy o PIT (z uwzględnieniem art. 14c, art. 22 ust. 4a i 4b oraz art. 24 ust. 1 i ust. 2 zdanie pierwsze tej ustawy i z wyłączeniami z art. 81 ust. 2zd), pomniejszony o składki emerytalną, rentową, chorobową i wypadkową opłacone w tym roku, jeżeli nie zostały zaliczone do kosztów; składek opłaconych w miesiącu zwolnienia ze składki nie odejmuj. Przychody z art. 14 ust. 2 pkt 1 i 19 ustawy o PIT i koszty z art. 23 ust. 1 pkt 1 tej ustawy możesz w rocznej podstawie uwzględnić; wtedy wykazujesz je w dokumencie rozliczeniowym z rozliczeniem rocznym razem z oświadczeniem. Roczna podstawa dotyczy roku składkowego, który zaczyna się 1 lutego roku, za który ustalasz dochód, i kończy 31 stycznia roku następnego.
            uses: []
            basis: art. 81 ust. 2, 2zd, 2ze i 2zf ustawy o świadczeniach opieki zdrowotnej
          - text: Jeżeli roczna podstawa jest niższa od iloczynu liczby miesięcy podlegania ubezpieczeniu zdrowotnemu w roku, za który ustalono dochód (bez miesięcy, w których przysługiwało zwolnienie ze składki), i 75% minimalnego wynagrodzenia obowiązującego w pierwszym dniu roku składkowego, podstawą jest ten iloczyn.
            uses: []
            basis: art. 81 ust. 2b i 2ba ustawy o świadczeniach opieki zdrowotnej w zw. z art. 4 pkt 1 lit. c ustawy z 6 grudnia 2024 r. (Dz.U. 2024 poz. 1915)
          - text: Roczna składka to roczna podstawa pomnożona przez stopę składki przy podatku liniowym, nie mniej jednak niż 9% iloczynu liczby miesięcy w roku składkowym i 75% minimalnego wynagrodzenia obowiązującego w pierwszym dniu roku składkowego. Którą liczbę miesięcy przyjąć, jest niewyjaśnione (otwarte pytanie do eksperta).
            uses: [zdrowotna.liniowy.stawka]
            basis: art. 79a ust. 1 pkt 2 ustawy o świadczeniach opieki zdrowotnej w zw. z art. 4 pkt 1 lit. b ustawy z 6 grudnia 2024 r. (Dz.U. 2024 poz. 1915)
          - text: Porównaj roczną składkę ze składkami za poszczególne miesiące roku składkowego. Nadpłatę ustalasz względem sumy składek wpłaconych (art. 81 ust. 2i), a niedopłatę względem sumy składek wynikającej ze złożonych dokumentów (art. 81 ust. 2j). Niedopłatę wykaż w dokumencie rozliczeniowym za miesiąc, w którym upływa termin złożenia zeznania rocznego, i dopłać w terminie płatności składek za ten miesiąc. Nadpłata jest zwracana na wniosek złożony w terminie miesiąca od upływu terminu złożenia zeznania; pozostałe warunki zwrotu określają art. 81 ust. 2m–2qa.
            uses: [termin.roczne_rozliczenie_zdrowotnej]
            basis: art. 81 ust. 2i–2qa ustawy o świadczeniach opieki zdrowotnej
      note: >-
        Rok składkowy od 1 lutego 2025 r. do 31 stycznia 2026 r. Art. 81 ust. 2 zdanie pierwsze, ust. 2c pkt 5 i ust. 2zd pkt 3 w brzmieniu
        z ustawy z 6 grudnia 2024 r. (Dz.U. 2024 poz. 1915) oraz ust. 2ze stosuje się do składek należnych od 1 lutego 2025 r. (art. 2
        tej ustawy); ust. 2zf obowiązuje od 1 stycznia 2025 r. W tym roku składkowym minimalne podstawy, także roczne, liczy się
        od 75% minimalnego wynagrodzenia (art. 4 tej ustawy). Okres wersji to rok składkowy, którego dotyczą składki i ich
        rozliczenie roczne, a nie dzień obliczenia: rozliczenie roczne tego roku składkowego, składane w 2026 r., liczy się
        według tej wersji.
        Wcześniejszych wersji nie wprowadzono.

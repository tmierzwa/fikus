      verification: {checked_at: 2026-11-26, agent_check: 2026-11-26, open_issue: "Ustawa Dz.U. 2026 poz. 1542 zmienia art. 81 ust. 2zd pkt 2 od 1 stycznia 2027 r. bez przepisu przejściowego. Od którego miesiąca składkowego albo dla przychodów i dochodów z jakiego okresu stosuje się nowe brzmienie? Pytanie do eksperta: docs/pytania-do-eksperta.md, P8."}
    - valid_from: 2027-02-01
      note: >-
        Zmiana względem poprzedniej wersji: od 1 stycznia 2027 r. art. 81 ust. 2zd pkt 2 nie wymienia już art. 21 ust. 1
        pkt 63a ustawy o PIT (Dz.U. 2026 poz. 1542, art. 12); ta sama ustawa uchyla ten punkt w ustawie o PIT (art. 4
        pkt 1). Pozostałe kroki się nie zmieniają. Wersja zaczyna się od roku składkowego 2027/2028 (od 1 lutego 2027 r.), bo okres
        wersji to rok składkowy. Składkę za styczeń 2027 r. i roczne rozliczenie roku składkowego 2026/2027
        opisuje wersja poprzednia; czy stosuje się do nich już nowe brzmienie, jest pytaniem P8. Nowego brzmienia nie ma jeszcze w tekście jednolitym, więc źródłem jest ustawa zmieniająca.
      value:
        steps:
          - text: Składka jest miesięczna i niepodzielna, z zastrzeżeniem rocznej podstawy i rocznego rozliczenia opisanych w dalszych krokach (art. 81 ust. 2). Jeżeli prowadzisz więcej niż jedną pozarolniczą działalność, składkę opłacasz od sumy dochodów z nich, a tak ustalona podstawa nie może być niższa niż minimalna roczna podstawa z kroku o niej.
            uses: []
            basis: art. 79 ust. 2 i art. 82 ust. 2a ustawy o świadczeniach opieki zdrowotnej
          - text: Miesięczną podstawą jest dochód z działalności z miesiąca poprzedzającego miesiąc, za który płacisz składkę. Za pierwszy miesiąc podlegania ubezpieczeniu w roku składkowym to przychody pomniejszone o koszty ich uzyskania w rozumieniu ustawy o PIT. Za kolejne miesiące to przychody pomniejszone o koszty od początku roku, pomniejszone o sumę dochodów ustalonych za miesiące poprzedzające.
            uses: []
            basis: art. 81 ust. 2c pkt 1, 3 i 4 ustawy o świadczeniach opieki zdrowotnej
          - text: Dochód za pierwszy miesiąc pomniejsz o składki emerytalną, rentową, chorobową i wypadkową opłacone w tym miesiącu, a dochód za kolejne miesiące o różnicę między tymi składkami zapłaconymi od początku roku a składkami odliczonymi w poprzednich miesiącach. Nie odejmuj składek zaliczonych do kosztów uzyskania przychodów ani składek opłaconych w miesiącu, w którym przysługiwało zwolnienie ze składki (art. 82 ust. 8–9a).
            uses: []
            basis: art. 81 ust. 2c pkt 2 i 4 oraz ust. 2zf ustawy o świadczeniach opieki zdrowotnej
          - text: Przy ustalaniu dochodu stosuj art. 24 ust. 1 i ust. 2 zdanie pierwsze oraz uwzględnij art. 14c i art. 22 ust. 4a i 4b ustawy o PIT; przy podatkowej księdze przychodów i rozchodów ustal dochód z uwzględnieniem art. 44 ust. 2 zdanie drugie tej ustawy.
            uses: []
            basis: art. 81 ust. 2c pkt 5 ustawy o świadczeniach opieki zdrowotnej
          - text: Do przychodów i kosztów nie wliczaj tych, które wyłącza art. 81 ust. 2zd, czyli przychodów i kosztów z okresu zawieszenia działalności (z wyjątkami wskazanymi w tym przepisie), przychodów niepodlegających opodatkowaniu (poza art. 21 ust. 1 pkt 63b i 152–154 ustawy o PIT), przychodów, o których mowa w art. 14 ust. 2 pkt 1 i 19 ustawy o PIT, i kosztów, o których mowa w art. 23 ust. 1 pkt 1 tej ustawy, oraz przychodów i kosztów z miesiąca, w którym przysługiwało zwolnienie ze składki (art. 82 ust. 8–9a). Wyjątek dla rocznej podstawy opisuje krok o rocznej podstawie.
            uses: []
            basis: art. 81 ust. 2zd ustawy o świadczeniach opieki zdrowotnej
          - text: Jeżeli tak ustalona miesięczna podstawa jest niższa od minimalnego wynagrodzenia obowiązującego w pierwszym dniu roku składkowego, podstawą za ten miesiąc jest ta kwota.
            uses: []
            basis: art. 81 ust. 2d ustawy o świadczeniach opieki zdrowotnej
          - text: Składka za miesiąc to podstawa pomnożona przez stopę składki zdrowotnej.
            uses: [zdrowotna.skala.stawka]
            basis: art. 79 ust. 1 ustawy o świadczeniach opieki zdrowotnej
          - text: Za miesiąc, w którym spełniasz warunki zwolnienia z art. 82 ust. 8–9a, składki nie opłacasz. Osoba zaliczona do umiarkowanego lub znacznego stopnia niepełnosprawności, objęta ubezpieczeniem zdrowotnym tylko z tytułu działalności i rozliczająca się według skali, opłaca miesięczną składkę nie wyższą niż zaliczka na podatek należna za ten miesiąc, a roczną nie wyższą niż podatek należny za rok, na warunkach z art. 82 ust. 10.
            uses: []
            basis: art. 82 ust. 8–10 ustawy o świadczeniach opieki zdrowotnej
          - text: Po końcu roku ustal roczną podstawę. Jest nią dochód z działalności za rok kalendarzowy, czyli przychody pomniejszone o koszty ich uzyskania w rozumieniu ustawy o PIT (z uwzględnieniem art. 14c, art. 22 ust. 4a i 4b oraz art. 24 ust. 1 i ust. 2 zdanie pierwsze tej ustawy i z wyłączeniami z art. 81 ust. 2zd), pomniejszony o składki emerytalną, rentową, chorobową i wypadkową opłacone w tym roku, jeżeli nie zostały zaliczone do kosztów; składek opłaconych w miesiącu zwolnienia ze składki nie odejmuj. Przychody z art. 14 ust. 2 pkt 1 i 19 ustawy o PIT i koszty z art. 23 ust. 1 pkt 1 tej ustawy możesz w rocznej podstawie uwzględnić; wtedy wykazujesz je w dokumencie rozliczeniowym z rozliczeniem rocznym razem z oświadczeniem. Roczna podstawa dotyczy roku składkowego, który zaczyna się 1 lutego roku, za który ustalasz dochód, i kończy 31 stycznia roku następnego.
            uses: []
            basis: art. 81 ust. 2, 2zd, 2ze i 2zf ustawy o świadczeniach opieki zdrowotnej
          - text: Jeżeli roczna podstawa jest niższa od iloczynu liczby miesięcy podlegania ubezpieczeniu zdrowotnemu w roku, za który ustalono dochód (bez miesięcy, w których przysługiwało zwolnienie ze składki), i minimalnego wynagrodzenia obowiązującego w pierwszym dniu roku składkowego, podstawą jest ten iloczyn.
            uses: []
            basis: art. 81 ust. 2b i 2ba ustawy o świadczeniach opieki zdrowotnej
          - text: Roczna składka to roczna podstawa pomnożona przez stopę składki zdrowotnej.
            uses: [zdrowotna.skala.stawka]
            basis: art. 79 ust. 1 i art. 81 ust. 2 ustawy o świadczeniach opieki zdrowotnej
          - text: Porównaj roczną składkę ze składkami za poszczególne miesiące roku składkowego. Nadpłatę ustalasz względem sumy składek wpłaconych (art. 81 ust. 2i), a niedopłatę względem sumy składek wynikającej ze złożonych dokumentów (art. 81 ust. 2j). Niedopłatę wykaż w dokumencie rozliczeniowym za miesiąc, w którym upływa termin złożenia zeznania rocznego, i dopłać w terminie płatności składek za ten miesiąc. Nadpłata jest zwracana na wniosek złożony w terminie miesiąca od upływu terminu złożenia zeznania; pozostałe warunki zwrotu określają art. 81 ust. 2m–2qa.
            uses: [termin.roczne_rozliczenie_zdrowotnej]
            basis: art. 81 ust. 2i–2qa ustawy o świadczeniach opieki zdrowotnej

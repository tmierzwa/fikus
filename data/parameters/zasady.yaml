- id: zasada.liniowy_zdrowotna
  name: Składka zdrowotna przy podatku liniowym
  kind: rule
  applies_to: {tax_form: [liniowy]}
  versions:
    - valid_from: 2025-02-01
      valid_to: 2026-01-31
      value:
        steps:
          - text: Składka jest miesięczna i niepodzielna, z zastrzeżeniem art. 79a oraz rocznej podstawy i rocznego rozliczenia opisanych w dalszych krokach (art. 81 ust. 2). Jeżeli prowadzisz więcej niż jedną pozarolniczą działalność, składkę opłacasz od sumy dochodów z nich, a tak ustalona podstawa nie może być niższa niż minimalna roczna podstawa z kroku o niej.
            uses: []
            basis: art. 79 ust. 2 i art. 82 ust. 2a ustawy o świadczeniach opieki zdrowotnej
          - text: Miesięczną podstawą jest dochód z działalności z miesiąca poprzedzającego miesiąc, za który płacisz składkę. Za pierwszy miesiąc podlegania ubezpieczeniu w roku składkowym to przychody pomniejszone o koszty ich uzyskania w rozumieniu ustawy o PIT. Za kolejne miesiące to przychody pomniejszone o koszty od początku roku, pomniejszone o sumę dochodów ustalonych za miesiące poprzedzające.
            uses: []
            basis: art. 81 ust. 2c pkt 1, 3 i 4 ustawy o świadczeniach opieki zdrowotnej
          - text: Dochód za pierwszy miesiąc pomniejsz o składki emerytalną, rentową, chorobową i wypadkową opłacone w tym miesiącu, a dochód za kolejne miesiące o różnicę między tymi składkami zapłaconymi od początku roku a składkami odliczonymi w poprzednich miesiącach. Nie odejmuj składek zaliczonych do kosztów uzyskania przychodów ani składek opłaconych w miesiącu, w którym przysługiwało zwolnienie ze składki (art. 82 ust. 8–9a).
            uses: []
            basis: art. 81 ust. 2c pkt 2 i 4 oraz ust. 2zf ustawy o świadczeniach opieki zdrowotnej
          - text: Przy ustalaniu dochodu stosuj art. 24 ust. 1 i ust. 2 zdanie pierwsze oraz uwzględnij art. 14c i art. 22 ust. 4a i 4b ustawy o PIT; przy podatkowej księdze przychodów i rozchodów ustal dochód z uwzględnieniem art. 44 ust. 2 zdanie drugie tej ustawy.
            uses: []
            basis: art. 81 ust. 2c pkt 5 ustawy o świadczeniach opieki zdrowotnej
          - text: Do przychodów i kosztów nie wliczaj tych, które wyłącza art. 81 ust. 2zd, czyli przychodów i kosztów z okresu zawieszenia działalności (z wyjątkami wskazanymi w tym przepisie), przychodów niepodlegających opodatkowaniu (poza art. 21 ust. 1 pkt 63a, 63b i 152–154 ustawy o PIT), przychodów, o których mowa w art. 14 ust. 2 pkt 1 i 19 ustawy o PIT, i kosztów, o których mowa w art. 23 ust. 1 pkt 1 tej ustawy, oraz przychodów i kosztów z miesiąca, w którym przysługiwało zwolnienie ze składki (art. 82 ust. 8–9a). Wyjątek dla rocznej podstawy opisuje krok o rocznej podstawie.
            uses: []
            basis: art. 81 ust. 2zd ustawy o świadczeniach opieki zdrowotnej
          - text: Jeżeli tak ustalona miesięczna podstawa jest niższa od 75% minimalnego wynagrodzenia obowiązującego w pierwszym dniu roku składkowego, podstawą za ten miesiąc jest ta kwota.
            uses: []
            basis: art. 81 ust. 2d ustawy o świadczeniach opieki zdrowotnej w zw. z art. 4 pkt 2 lit. a ustawy z 6 grudnia 2024 r. (Dz.U. 2024 poz. 1915)
          - text: Składka za miesiąc to podstawa pomnożona przez stopę składki przy podatku liniowym, nie mniej jednak niż minimalna składka zdrowotna.
            uses: [zdrowotna.liniowy.stawka, zdrowotna.minimum]
            basis: art. 79a ust. 1 pkt 1 ustawy o świadczeniach opieki zdrowotnej w zw. z art. 4 pkt 1 lit. a ustawy z 6 grudnia 2024 r. (Dz.U. 2024 poz. 1915)
          - text: Za miesiąc, w którym spełniasz warunki zwolnienia z art. 82 ust. 8–9a, składki nie opłacasz.
            uses: []
            basis: art. 82 ust. 8–9a ustawy o świadczeniach opieki zdrowotnej
          - text: Po końcu roku ustal roczną podstawę. Jest nią dochód z działalności za rok kalendarzowy, czyli przychody pomniejszone o koszty ich uzyskania w rozumieniu ustawy o PIT (z uwzględnieniem art. 14c, art. 22 ust. 4a i 4b oraz art. 24 ust. 1 i ust. 2 zdanie pierwsze tej ustawy i z wyłączeniami z art. 81 ust. 2zd), pomniejszony o składki emerytalną, rentową, chorobową i wypadkową opłacone w tym roku, jeżeli nie zostały zaliczone do kosztów; składek opłaconych w miesiącu zwolnienia ze składki nie odejmuj. Przychody z art. 14 ust. 2 pkt 1 i 19 ustawy o PIT i koszty z art. 23 ust. 1 pkt 1 tej ustawy możesz w rocznej podstawie uwzględnić; wtedy wykazujesz je w dokumencie rozliczeniowym z rozliczeniem rocznym razem z oświadczeniem. Roczna podstawa dotyczy roku składkowego, który zaczyna się 1 lutego roku, za który ustalasz dochód, i kończy 31 stycznia roku następnego.
            uses: []
            basis: art. 81 ust. 2, 2zd, 2ze i 2zf ustawy o świadczeniach opieki zdrowotnej
          - text: Jeżeli roczna podstawa jest niższa od iloczynu liczby miesięcy podlegania ubezpieczeniu zdrowotnemu w roku, za który ustalono dochód (bez miesięcy, w których przysługiwało zwolnienie ze składki), i 75% minimalnego wynagrodzenia obowiązującego w pierwszym dniu roku składkowego, podstawą jest ten iloczyn.
            uses: []
            basis: art. 81 ust. 2b i 2ba ustawy o świadczeniach opieki zdrowotnej w zw. z art. 4 pkt 1 lit. c ustawy z 6 grudnia 2024 r. (Dz.U. 2024 poz. 1915)
          - text: Roczna składka to roczna podstawa pomnożona przez stopę składki przy podatku liniowym, nie mniej jednak niż 9% iloczynu liczby miesięcy w roku składkowym i 75% minimalnego wynagrodzenia obowiązującego w pierwszym dniu roku składkowego. Którą liczbę miesięcy przyjąć, jest niewyjaśnione (otwarte pytanie do eksperta).
            uses: [zdrowotna.liniowy.stawka]
            basis: art. 79a ust. 1 pkt 2 ustawy o świadczeniach opieki zdrowotnej w zw. z art. 4 pkt 1 lit. b ustawy z 6 grudnia 2024 r. (Dz.U. 2024 poz. 1915)
          - text: Porównaj roczną składkę ze składkami za poszczególne miesiące roku składkowego. Nadpłatę ustalasz względem sumy składek wpłaconych (art. 81 ust. 2i), a niedopłatę względem sumy składek wynikającej ze złożonych dokumentów (art. 81 ust. 2j). Niedopłatę wykaż w dokumencie rozliczeniowym za miesiąc, w którym upływa termin złożenia zeznania rocznego, i dopłać w terminie płatności składek za ten miesiąc. Nadpłata jest zwracana na wniosek złożony w terminie miesiąca od upływu terminu złożenia zeznania; pozostałe warunki zwrotu określają art. 81 ust. 2m–2qa.
            uses: [termin.roczne_rozliczenie_zdrowotnej]
            basis: art. 81 ust. 2i–2qa ustawy o świadczeniach opieki zdrowotnej
      note: >-
        Rok składkowy od 1 lutego 2025 r. do 31 stycznia 2026 r. Art. 81 ust. 2 zdanie pierwsze, ust. 2c pkt 5 i ust. 2zd pkt 3 w brzmieniu
        z ustawy z 6 grudnia 2024 r. (Dz.U. 2024 poz. 1915) oraz ust. 2ze stosuje się do składek należnych od 1 lutego 2025 r. (art. 2
        tej ustawy); ust. 2zf obowiązuje od 1 stycznia 2025 r. W tym roku składkowym minimalne podstawy, także roczne, liczy się
        od 75% minimalnego wynagrodzenia (art. 4 tej ustawy). Okres wersji to rok składkowy, którego dotyczą składki i ich
        rozliczenie roczne, a nie dzień obliczenia: rozliczenie roczne tego roku składkowego, składane w 2026 r., liczy się
        według tej wersji.
        Wcześniejszych wersji nie wprowadzono.
      sources:
        - title: Dz.U. 2025 poz. 1461, tekst jednolity ustawy o świadczeniach opieki zdrowotnej (art. 2 ustawy Dz.U. 2024 poz. 1915, stosowanie od lutego 2025 r.)

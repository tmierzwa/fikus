          url: https://crd.gov.pl/wzor/2026/10/13/14405/wyroznik.xml
          confirms: [form, variant, period]
          quote: "PIT-36(32) ZEZNANIE O WYSOKOŚCI OSIĄGNIĘTEGO DOCHODU (PONIESIONEJ STRATY) ZA ROK PODATKOWY - wzór stosuje się do uzyskanych dochodów lub poniesionych strat od dnia 1 stycznia 2026 r."
          article: art. 45b ust. 1 pkt 5 ustawy o PIT
          as_of: 2026-11-26
        - title: CRWDE (ePUAP), wyróżnik wzoru 2026/10/13/14405 (adres schematu)

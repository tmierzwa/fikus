- id: schemat.pit_28
  name: Schemat e-Deklaracji PIT-28 (zeznanie roczne na ryczałcie)
  kind: value
  applies_to: {tax_form: [ryczalt]}
  versions:
    - valid_from: 2025-01-01
      valid_to: 2025-12-31
      value:
        form: PIT-28
        variant: 27
        system_code: PIT-28 (27)
        schema_version: 1-1E
        xsd_url: http://crd.gov.pl/wzor/2025/10/10/13916/schemat.xsd
      note: >-
        Okres obowiązywania to rok podatkowy 2025. Wyróżnik wzoru PIT-28 nie mówi, za który rok stosuje się wzór;
        rok podają strona MF z formularzami i archiwum formularzy na podatki.gov.pl, a schemat XSD przyjmuje rok od
        2025 (atrybut, więc nie da się go zacytować). Za ten sam rok i w tym samym wariancie MF opublikowało wcześniej
        wzór 2025/09/11/13849 z wersją schematu 1-0E (http://crd.gov.pl/wzor/2025/09/11/13849/schemat.xsd); wzór 13916
        ma wersję 1-1E. Pliki XSD obu wzorów różnią się (porównanie plików poleceniem diff) tylko przestrzenią nazw wzoru
        (adres wzoru), wersją schematu, usunięciem dwóch warunków
        „większe od zera” i najwcześniejszym dopuszczalnym rokiem w jednym polu (2020 zamiast 2018). Który z nich
        system e-Deklaracji przyjmuje teraz, żadne źródło nie podaje (otwarte pytanie). Źródła podają rok dla wariantu,
        nie dla wersji schematu, więc okresu tej wersji nie potwierdza żaden dokument. Kod systemowy i wersja schematu są stałymi wartościami
        atrybutów w pliku XSD, więc skrypt cytatów ich nie sprawdzi; nie podaje ich też żaden inny dokument. Adres
        schematu pochodzi z wyróżnika wzoru (z http).

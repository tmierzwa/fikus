# Zeznania roczne PIT: schematy e-Deklaracji i podpis danymi autoryzującymi.
# Wersja schematu zeznania obowiązuje za rok podatkowy, za który składa się zeznanie (od 1 stycznia tego roku),
# a nie według daty wysłania. Narzędzie get_schema szuka parametru schemat.<symbol małymi literami, łącznik jako _>.
# Wzory elektroniczne publikuje Ministerstwo Finansów w Centralnym Repozytorium Wzorów Dokumentów Elektronicznych
# (CRWDE, ePUAP). Dla tego samego wariantu i roku MF publikuje czasem kilka wzorów z kolejnymi wersjami schematu;
# wersja podaje wzór opublikowany najpóźniej, a wcześniejsze wymienia w notatce (otwarte pytanie P41).

- id: schemat.pit_36
  name: Schemat e-Deklaracji PIT-36 (zeznanie roczne na skali podatkowej)
  kind: value
  applies_to: {tax_form: [skala]}
  versions:
    - valid_from: 2025-01-01
      valid_to: 2025-12-31
      value:
        form: PIT-36
        variant: 32
        system_code: PIT-36 (32)
        schema_version: 2-0E
        xsd_url: http://crd.gov.pl/wzor/2026/09/11/14368/schemat.xsd
      note: >-
        Okres obowiązywania to rok podatkowy 2025 (zeznanie składane od 15 lutego 2026 r.). Wyróżnik wzoru
        2026/09/11/14368 podaje, że wzór stosuje się do dochodów i strat od 1 stycznia 2025 r. Za ten sam rok
        i w tym samym wariancie MF opublikowało wcześniej wzór 2025/09/24/13871 z wersją schematu 1-0E
        (http://crd.gov.pl/wzor/2025/09/24/13871/schemat.xsd). Według wyróżników wzór 13871 podpisano 24 września
        2025 r., a wzór 14368 (wersja 2-0E) 11 września 2026 r.; oba mają ważność od 24 lipca 2025 r. Pliki XSD obu
        wzorów różnią się (porównanie plików poleceniem diff) tylko przestrzenią nazw wzoru (adres wzoru), wersją
        schematu i opisem jednego pola (numery pozycji w opisie obliczonego podatku: 293 i 294 zamiast 283 i 284). Który z nich system e-Deklaracji przyjmuje teraz (na przykład przy korekcie), żadne
        źródło nie podaje (otwarte pytanie). Wyróżnik podaje tylko początek okresu, a strony MF wariant, nie wersję
        schematu, więc okresu tej wersji nie potwierdza żaden dokument.
        Kod systemowy i wersja schematu są stałymi wartościami atrybutów kodSystemowy i wersjaSchemy w pliku XSD,
        więc skrypt cytatów ich nie sprawdzi; nie podaje ich też żaden inny dokument. Adres schematu pochodzi
        z wyróżnika wzoru (tak jak w rejestrze, z http). Strona MF z formularzami podaje wariant 32 dla zeznań za 2025
        i 2026 r.
      sources:
        - title: CRWDE (ePUAP), wyróżnik wzoru 2026/09/11/14368, twórca wzoru Ministerstwo Finansów
          url: https://crd.gov.pl/wzor/2026/09/11/14368/wyroznik.xml
          confirms: [form, variant]
          quote: "PIT-36(32) ZEZNANIE O WYSOKOŚCI OSIĄGNIĘTEGO DOCHODU (PONIESIONEJ STRATY) ZA ROK PODATKOWY - wzór stosuje się do uzyskanych dochodów lub poniesionych strat od dnia 1 stycznia 2025 r."
          article: art. 45b ust. 1 pkt 5 ustawy o PIT
          as_of: 2026-11-26
        - title: CRWDE (ePUAP), wyróżnik wzoru 2026/09/11/14368 (adres schematu)
          url: https://crd.gov.pl/wzor/2026/09/11/14368/wyroznik.xml
          confirms: [xsd_url]
          quote: "http://crd.gov.pl/wzor/2026/09/11/14368/schemat.xsd"
          as_of: 2026-11-26
        - title: gov.pl (MF), Formularze podatkowe, PIT-36 (wariant dla lat podatkowych)
          url: https://www.gov.pl/web/finanse/pit-36
          confirms: [form, variant]
          quote: "PIT-36 (32) za 2025 r. i za 2026 r."
          article: art. 45b ust. 1 pkt 5 ustawy o PIT
          as_of: 2026-11-26
        - title: podatki.gov.pl (MF), Formularze PIT (aktualny formularz)
          url: https://podatki.gov.pl/podatki-firmowe/pit/formularze-pit
          confirms: [form, variant]
          quote: "Aktualny formularz PIT-36 (32)"
          as_of: 2026-11-26
        - title: CRWDE (ePUAP), plik XSD wzoru 2026/09/11/14368 (kod systemowy „PIT-36 (32)” i wersja schematu „2-0E” są w atrybutach, więc nie da się ich zacytować)
          url: https://crd.gov.pl/wzor/2026/09/11/14368/schemat.xsd
          as_of: 2026-11-26
        - title: CRWDE (ePUAP), wyróżnik wcześniejszego wzoru 2025/09/24/13871 za ten sam rok (wersja schematu 1-0E)
          url: https://crd.gov.pl/wzor/2025/09/24/13871/wyroznik.xml
          quote: "PIT-36(32) ZEZNANIE O WYSOKOŚCI OSIĄGNIĘTEGO DOCHODU (PONIESIONEJ STRATY) ZA ROK PODATKOWY - wzór stosuje się do uzyskanych dochodów lub poniesionych strat od dnia 1 stycznia 2025 r. - Wzór dokumentu elektronicznego może być stosowany po upływie dwóch tygodni od daty opublikowania."
          as_of: 2026-11-26
      verification:
        checked_at: 2026-11-26
        agent_check: 2026-11-26
        open_issue: >-
          P41: za 2025 r. MF opublikowało w CRWDE dwa wzory PIT-36(32) (wersje schematu 1-0E i 2-0E); źródła nie podają,
          który z nich stosuje się teraz. Zob. docs/pytania-do-eksperta.md.
    - valid_from: 2026-01-01
      value:
        form: PIT-36
        variant: 32
        system_code: PIT-36 (32)
        schema_version: 3-1E
        xsd_url: http://crd.gov.pl/wzor/2026/10/13/14405/schemat.xsd
      note: >-
        Okres obowiązywania zaczyna się od roku podatkowego 2026 (zeznanie składane od 15 lutego 2027 r.). Wyróżnik
        wzoru 2026/10/13/14405 podaje, że wzór stosuje się do dochodów i strat od 1 stycznia 2026 r. Za ten sam rok
        MF opublikowało wcześniej wzór 2026/09/16/14376 z wersją schematu 3-0E
        (http://crd.gov.pl/wzor/2026/09/16/14376/schemat.xsd); wzór 14405 ma wersję 3-1E. Pliki XSD obu wzorów różnią
        się (porównanie plików poleceniem diff) tylko przestrzenią nazw wzoru (adres wzoru), wersją schematu i jednym
        warunkiem unikalności identyfikatora. Który z nich system
        e-Deklaracji przyjmuje, żadne źródło nie podaje (otwarte pytanie). Kod systemowy i wersja schematu są stałymi
        wartościami atrybutów w pliku XSD, więc skrypt cytatów ich nie sprawdzi; nie podaje ich też żaden inny dokument.
        Adres schematu pochodzi z wyróżnika wzoru (z http).
      sources:

- id: zasada.dane_autoryzujace
  name: Podpis danymi autoryzującymi (zeznania PIT, JPK_V7M, JPK_EWP i JPK_PKPIR)
  kind: rule
  versions:
    - valid_from: 2026-04-01
      valid_to: 2026-06-15
      value:
        steps:
          - text: >-
              Dane autoryzujące to podpis elektroniczny zapewniający autentyczność dokumentu, inny niż kwalifikowany.
              Tworzą go dane podatnika, który przesyła dokument: identyfikator podatkowy NIP albo numer PESEL, imię
              (pierwsze), nazwisko, data urodzenia i wysokość przychodu wykazanego w zeznaniu PIT-28, PIT-36, PIT-36L,
              PIT-37, PIT-38 albo PIT-39 lub w rocznym obliczeniu podatku przez organ rentowy (PIT-40A). Ten sam zestaw
              danych podają przepisy o deklaracjach i przepisy o przesyłaniu ksiąg podatkowych.
            uses: []
            basis: § 4 pkt 5 i § 12 ust. 2 rozporządzenia w sprawie sposobu przesyłania deklaracji i podań (Dz.U. 2025 poz. 327); § 2 ust. 2 pkt 3 i ust. 2a rozporządzenia w sprawie sposobu przesyłania ksiąg podatkowych (Dz.U. 2025 poz. 461)
          - text: >-
              Kwotę przychodu podajesz z takiego zeznania albo obliczenia za rok podatkowy o dwa lata wcześniejszy niż
              rok, w którym przesyłasz dokument. Podajesz tylko swoją kwotę przychodu, także gdy rozliczałeś się wspólnie
              z małżonkiem (MF). Rozporządzenia nie wskazują pozycji zeznania; nie mówią też, którą kwotę podać, gdy za
              tamten rok złożyłeś kilka z wymienionych zeznań, i to jest niewyjaśnione (otwarte pytanie do eksperta).
            uses: [schemat.pit_36, schemat.pit_36l, schemat.pit_28]
            basis: § 12 ust. 2 pkt 5 rozporządzenia Dz.U. 2025 poz. 327; § 2 ust. 2a pkt 5 rozporządzenia Dz.U. 2025 poz. 461; e-Deklaracje, pytania i odpowiedzi (MF)
          - text: >-
              Jeśli za ten rok podatkowy nie złożyłeś żadnego z wymienionych zeznań ani obliczeń, jako kwotę przychodu
              podajesz wartość „0” (zero). Jeśli za tamten rok nie składałeś zeznania na tym samym formularzu, który
              składasz teraz, ale złożyłeś jedno inne z wymienionych zeznań, podajesz kwotę z tamtego zeznania, a nie
              zero (MF). Gdy za tamten rok złożyłeś kilka z wymienionych zeznań, jest to niewyjaśnione (otwarte pytanie
              do eksperta).
            uses: []
            basis: § 12 ust. 2 pkt 5 rozporządzenia Dz.U. 2025 poz. 327; § 2 ust. 2a pkt 5 rozporządzenia Dz.U. 2025 poz. 461; e-Deklaracje, pytania i odpowiedzi (MF)
          - text: >-
              Danymi autoryzującymi możesz opatrzyć zeznania PIT-28, PIT-36 i PIT-36L oraz inne deklaracje i podania
              wymienione w § 11 rozporządzenia o deklaracjach, przesyłane przez oprogramowanie interfejsowe
              e-Deklaracji albo przez Platformę Usług Elektronicznych Skarbowo-Celnych. Tak samo możesz podpisać plik
              JPK_V7M (deklaracja z ewidencją VAT), ewidencję przychodów w strukturze JPK_EWP i podatkową księgę
              przychodów i rozchodów w strukturze JPK_PKPIR, bo przesyła się je na zasadach przesyłania ksiąg
              podatkowych; kwotę przychodu podajesz wtedy za rok podatkowy o dwa lata wcześniejszy niż rok przesłania
              pliku. Rozporządzenia o deklaracjach nie stosuje się do przesyłania przez e-Urząd Skarbowy.
            uses: [schemat.pit_36, schemat.pit_36l, schemat.pit_28, schemat.jpk_v7m, schemat.jpk_pkpir, schemat.jpk_ewp, zasada.jpk_pd_ryczalt, zasada.jpk_pd_pkpir]
            basis: § 1a, § 4 pkt 5 i § 11 pkt 16 i 18 rozporządzenia Dz.U. 2025 poz. 327 (§ 1a dodany przez Dz.U. 2026 poz. 442); § 2 ust. 1, ust. 2 pkt 3 i ust. 2a rozporządzenia Dz.U. 2025 poz. 461; art. 99 ust. 11c ustawy o VAT; art. 15 ust. 12 ustawy o zryczałtowanym podatku dochodowym; art. 24a ust. 1e ustawy o PIT
          - text: >-
              Danymi autoryzującymi nie podpiszesz deklaracji ani podania, których nie przesyła podatnik, płatnik
              albo podmiot będący osobą fizyczną, ani księgi (także JPK_V7M, JPK_EWP i JPK_PKPIR), której nie przesyła
              podatnik będący osobą fizyczną. MF podaje, że w niektórych formularzach online, gdy podatnikiem jest osoba
              fizyczna, a formularz składa osoba niefizyczna albo pełnomocnik osoby fizycznej, nie można użyć danych
              autoryzujących, a wyłącznie podpisu kwalifikowanego. Deklaracji i podań spoza
              wykazu w § 11 nie podpiszesz danymi autoryzującymi; kwalifikowanym podpisem elektronicznym możesz opatrzyć
              wszystkie rodzaje deklaracji i podań.
            uses: [schemat.jpk_v7m, schemat.jpk_pkpir, schemat.jpk_ewp]
            basis: § 4 pkt 1 i 5, § 5 ust. 1 i § 11 rozporządzenia Dz.U. 2025 poz. 327; § 2 ust. 2 rozporządzenia Dz.U. 2025 poz. 461; e-Deklaracje, pytania i odpowiedzi (MF); specyfikacja interfejsów usług JPK 5.6.0 (MF)
      note: >-
        Data początku obowiązywania to wejście w życie § 1a (wyłączenie e-Urzędu Skarbowego) i § 2 ust. 5 rozporządzenia
        o deklaracjach, dodanych rozporządzeniem Dz.U. 2026 poz. 442 (§ 2: wejście w życie 1 kwietnia 2026 r.). Okresu
        wcześniejszego ta wersja nie opisuje. Po tekście jednolitym Dz.U. 2025 poz. 327 rozporządzenie o deklaracjach
        zmieniły rozporządzenia Dz.U. 2025 poz. 842 (tylko deklaracje akcyzowe AKC-ZC w § 8, 10, 11 i 12 ust. 2),
        Dz.U. 2026 poz. 442 (§ 1a, § 2 ust. 5, § 4 pkt 2a, § 9a dla GIR-1, § 11 pkt 23); późniejsze zmiany opisuje
        następna wersja. Podpis zaufany z § 4
        pkt 2a dotyczy tylko GIR-1 (§ 9a). Art. 24a ust. 1e ustawy o PIT w brzmieniu sprzed 1 lipca 2026 r. (tekst
        jednolity Dz.U. 2026 poz. 592) odsyła do zasad przesyłania ksiąg podatkowych. Art. 24a ust. 1g ustawy o PIT i art. 15 ust. 13a
        ustawy o ryczałcie (pełnomocnictwo) weszły w życie 16 czerwca 2026 r. (ustawa ogłoszona 15 czerwca 2026 r.,
        art. 5), więc opisuje je dopiero następna wersja. Rozporządzenie
        o księgach (tekst jednolity Dz.U. 2025 poz. 461) nie ma zmian po tym tekście (ELI, akty zmieniające).
        Pozycje zeznań, z których bierze się kwotę przychodu, MF podaje dla kolejnych wzorów w odpowiedziach na pytania
        o e-Deklaracje. Specyfikacja interfejsów usług JPK 5.6.0 podaje dane autoryzujące jako metodę uwierzytelnienia dla
        JPK_V7M, JPK_EWP(4) i JPK_PKPIR(3). Żaden dokument nie podaje sam całej zasady (odpowiedzi MF nie mówią o plikach
        JPK, a specyfikacja JPK nie podaje zestawu danych), więc wersja nie ma drugiego niezależnego dowodu.
      sources:
        - title: Dz.U. 2025 poz. 327, tekst jednolity rozporządzenia w sprawie sposobu przesyłania deklaracji i podań oraz rodzajów podpisu elektronicznego (zestaw danych)
          url: https://api.sejm.gov.pl/eli/acts/DU/2025/327/text.pdf
          quote: "jest oparty na zestawie unikalnych danych w postaci elektronicznej dotyczących podatnika, płatnika lub podmiotu przesyłającego deklarację lub podanie"
          article: § 12 ust. 2
        - title: Dz.U. 2025 poz. 327, tekst jednolity rozporządzenia w sprawie sposobu przesyłania deklaracji i podań (rok kwoty przychodu i zero)
          url: https://api.sejm.gov.pl/eli/acts/DU/2025/327/text.pdf
          quote: "za rok podatkowy o dwa lata wcześniejszy niż rok przesyłania deklaracji lub podań albo wartość „0” (zero), gdy za ten rok podatkowy nie złożono żadnego z wymienionych zeznań lub obliczeń"
          article: § 12 ust. 2 pkt 5
        - title: Dz.U. 2025 poz. 327, tekst jednolity rozporządzenia w sprawie sposobu przesyłania deklaracji i podań (kto może podpisać)
          url: https://api.sejm.gov.pl/eli/acts/DU/2025/327/text.pdf
          quote: "mogą być opatrywane, odpowiednio, przez podatnika będącego osobą fizyczną, płatnika będącego osobą fizyczną lub podmiot będący osobą fizyczną"
          article: § 11
        - title: Dz.U. 2025 poz. 327, tekst jednolity rozporządzenia w sprawie sposobu przesyłania deklaracji i podań (sposób przesyłania)
          url: https://api.sejm.gov.pl/eli/acts/DU/2025/327/text.pdf
          quote: "innym podpisem elektronicznym zapewniającym autentyczność deklaracji i podań, jeżeli są przesyłane w sposób, o którym mowa w § 2 ust. 1 pkt 1 i 3"
          article: § 4 pkt 5
        - title: Dz.U. 2025 poz. 327, tekst jednolity rozporządzenia w sprawie sposobu przesyłania deklaracji i podań (podpis kwalifikowany)
          url: https://api.sejm.gov.pl/eli/acts/DU/2025/327/text.pdf
          quote: "Podpisem elektronicznym, o którym mowa w § 4 pkt 1, mogą być opatrywane wszystkie rodzaje deklaracji i podań."
          article: § 5 ust. 1
        - title: Dz.U. 2026 poz. 442, rozporządzenie MFiG zmieniające rozporządzenie w sprawie sposobu przesyłania deklaracji i podań (e-Urząd Skarbowy)
          url: https://api.sejm.gov.pl/eli/acts/DU/2026/442/text.pdf
          quote: "Rozporządzenia nie stosuje się do przesyłania deklaracji i podań za pośrednictwem e-Urzędu Skarbowego."
          article: § 1 pkt 1 (§ 1a), § 2
        - title: Dz.U. 2025 poz. 461, tekst jednolity rozporządzenia w sprawie sposobu przesyłania za pomocą środków komunikacji elektronicznej ksiąg podatkowych
          url: https://api.sejm.gov.pl/eli/acts/DU/2025/461/text.pdf
          quote: "innym podpisem elektronicznym zapewniającym autentyczność ksiąg, jeżeli są przesyłane przez podatnika będącego osobą fizyczną"
          article: § 2 ust. 2 pkt 3
        - title: Dz.U. 2025 poz. 461, tekst jednolity rozporządzenia w sprawie sposobu przesyłania ksiąg podatkowych (rok kwoty przychodu)
          url: https://api.sejm.gov.pl/eli/acts/DU/2025/461/text.pdf
          quote: "za rok podatkowy o dwa lata wcześniejszy niż rok przesyłania księgi albo wartość „0” (zero), gdy za ten rok podatkowy nie złożono żadnego z wymienionych zeznań lub obliczeń"
          article: § 2 ust. 2a pkt 5
        - title: Dz.U. 2026 poz. 1263, tekst jednolity ustawy o podatku od towarów i usług (sposób przesyłania JPK_V7M)
          url: https://api.sejm.gov.pl/eli/acts/DU/2026/1263/text.pdf
          quote: "Dokument elektroniczny, o którym mowa w zdaniu pierwszym, jest przesyłany w sposób określony w przepisach wydanych na podstawie art. 193a § 3 Ordynacji podatkowej i zgodnie z wymaganiami określonymi w tych przepisach."
          article: art. 99 ust. 11c
        - title: Dz.U. 2025 poz. 843, tekst jednolity ustawy o zryczałtowanym podatku dochodowym (sposób przesyłania ewidencji przychodów)
          url: https://api.sejm.gov.pl/eli/acts/DU/2025/843/text.pdf
          quote: "na zasadach dotyczących przesyłania ksiąg podatkowych lub ich części określonych w przepisach wydanych na podstawie art. 193a § 3 ustawy – Ordynacja podatkowa"
          article: art. 15 ust. 12
        - title: Dz.U. 2026 poz. 592, tekst jednolity ustawy o podatku dochodowym od osób fizycznych (brzmienie art. 24a ust. 1e przed 1 lipca 2026 r.)
          url: https://api.sejm.gov.pl/eli/acts/DU/2026/592/text.pdf
          quote: "na zasadach dotyczących przesyłania ksiąg podatkowych lub ich części określonych w przepisach wydanych na podstawie art. 193a § 3 Ordynacji podatkowej"
          article: art. 24a ust. 1e
        - title: Dz.U. 2026 poz. 779, wejście w życie
          url: https://api.sejm.gov.pl/eli/acts/DU/2026/779/text.pdf
          quote: "Ustawa wchodzi w życie z dniem 1 lipca 2026 r., z wyjątkiem art. 1 pkt 7, art. 2 pkt 1 lit. c i art. 3, które wchodzą w życie z dniem następującym po dniu ogłoszenia."
          article: art. 5
        - title: podatki.gov.pl (MF), e-Deklaracje, pytania i odpowiedzi (zestaw danych i rok kwoty przychodu)
          url: https://podatki.gov.pl/e-deklaracje/pytania-i-odpowiedzi
          quote: "imię (pierwsze), nazwisko, data urodzenia, kwota przychodu, wskazana w zeznaniu lub rocznym obliczeniu podatku za rok podatkowy o dwa lata wcześniejszy niż rok, w którym jest składany dokument elektroniczny"
          as_of: 2026-11-26
        - title: podatki.gov.pl (MF), e-Deklaracje, pytania i odpowiedzi (zero i inne zeznanie za tamten rok)
          url: https://podatki.gov.pl/e-deklaracje/pytania-i-odpowiedzi
          quote: "wpisywanie kwoty 0 (zero), gdy za 2024 r. podatnik nie składał zeznania na analogicznym formularzu, ale rozliczał się na innym formularzu"
          as_of: 2026-11-26
        - title: podatki.gov.pl (MF), e-Deklaracje, pytania i odpowiedzi (kwota przychodu samego podatnika)
          url: https://podatki.gov.pl/e-deklaracje/pytania-i-odpowiedzi
          quote: "w celach autoryzacyjnych powinna być wskazywana tylko i wyłącznie kwota przychodu podatnika"
          as_of: 2026-11-26
        - title: podatki.gov.pl (MF), e-Deklaracje, pytania i odpowiedzi (pełnomocnik, status 422)
          url: https://podatki.gov.pl/e-deklaracje/pytania-i-odpowiedzi
          quote: "Występuje w niektórych formularzach online, kiedy podatnikiem jest osoba fizyczna, a składającym formularz do urzędu skarbowego jest osoba niefizyczna lub pełnomocnik osoby fizycznej. W tym przypadku nie można użyć danych autoryzujących a WYŁĄCZNIE podpisu kwalifikowanego."
          as_of: 2026-11-26
        - title: podatki.gov.pl (MF), Specyfikacja interfejsów usług JPK wersja 5.6.0 (metody uwierzytelnienia; nie podaje zestawu danych)
          url: https://podatki.gov.pl/media/bngboylg/specyfikacja-interfejs%C3%B3w-us%C5%82ug-jpk-wersja-560.pdf
          quote: "dokument złożony z użyciem danych autoryzujących może złożyć wyłącznie podatnik, będący osobą fizyczną"
          as_of: 2026-11-26

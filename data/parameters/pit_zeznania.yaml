        Okres obowiązywania zaczyna się od roku podatkowego 2026. Wyróżnik wzoru PIT-28 nie mówi, za który rok
        stosuje się wzór; rok podaje strona MF z formularzami, a schemat XSD przyjmuje rok od 2026 (atrybut, więc nie da
        się go zacytować). Za ten sam rok MF opublikowało wcześniej wzór 2026/09/10/14364 z wersją schematu 1-0E
        (http://crd.gov.pl/wzor/2026/09/10/14364/schemat.xsd); wzór 14369 ma wersję 1-1E. Pliki XSD obu wzorów różnią
        się (porównanie plików poleceniem diff) tylko przestrzenią nazw wzoru (adres wzoru) i wersją schematu. Który z nich system e-Deklaracji przyjmuje, żadne źródło nie
        podaje (otwarte pytanie). Kod systemowy i wersja schematu są stałymi
        wartościami atrybutów w pliku XSD, więc skrypt cytatów ich nie sprawdzi; nie podaje ich też żaden inny dokument.
        Strona MF podaje wariant „za 2026 r.”, co nie obejmuje wersji bez daty końca, więc okresu nie potwierdza
        żaden dokument. Adres schematu pochodzi z wyróżnika wzoru (z http).
      sources:

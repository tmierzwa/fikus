- id: zus.kod.tytul_ubezpieczenia
  name: Kod tytułu ubezpieczenia osoby prowadzącej działalność (ZUS DRA, blok X, pole 01)
  kind: value
  versions:
    - valid_from: 2026-04-30
      value:
        podmiot:
          "0510": osoba prowadząca pozarolniczą działalność gospodarczą niemająca ustalonego prawa do renty z tytułu niezdolności do pracy, z podstawą wymiaru składek społecznych nie niższą niż 60% przeciętnego miesięcznego wynagrodzenia
          "0512": osoba prowadząca pozarolniczą działalność gospodarczą mająca ustalone prawo do renty z tytułu niezdolności do pracy, z podstawą wymiaru składek społecznych nie niższą niż 60% przeciętnego miesięcznego wynagrodzenia
          "0514": osoba prowadząca pozarolniczą działalność gospodarczą zwolniona z opłacania składek, z podstawą wymiaru składek społecznych równą 60% prognozowanego przeciętnego wynagrodzenia
          "0540": osoba niepodlegająca ubezpieczeniom społecznym i podlegająca ubezpieczeniu zdrowotnemu, zgodnie z art. 18 ust. 1 Prawa przedsiębiorców
          "0570": osoba prowadząca pozarolniczą działalność gospodarczą niemająca ustalonego prawa do renty z tytułu niezdolności do pracy, z podstawą wymiaru składek społecznych nie niższą niż 30% minimalnego wynagrodzenia
          "0572": osoba prowadząca pozarolniczą działalność gospodarczą mająca ustalone prawo do renty z tytułu niezdolności do pracy, z podstawą wymiaru składek społecznych nie niższą niż 30% minimalnego wynagrodzenia
          "0574": osoba prowadząca pozarolniczą działalność gospodarczą zwolniona z opłacania składek, z podstawą wymiaru składek społecznych równą 30% minimalnego wynagrodzenia
          "0580": osoba prowadząca pozarolniczą działalność, której zasiłek macierzyński nie przekracza kwoty świadczenia rodzicielskiego
          "0590": osoba prowadząca pozarolniczą działalność gospodarczą niemająca ustalonego prawa do renty z tytułu niezdolności do pracy, z podstawą wymiaru składek społecznych uzależnioną od dochodu
          "0592": osoba prowadząca pozarolniczą działalność gospodarczą mająca ustalone prawo do renty z tytułu niezdolności do pracy, z podstawą wymiaru składek społecznych uzależnioną od dochodu
          "0594": osoba prowadząca pozarolniczą działalność gospodarczą zwolniona z opłacania składek, z podstawą wymiaru składek społecznych uzależnioną od dochodu
        prawo_do_emerytury_lub_renty:
          "0": osoba, która nie ma ustalonego prawa do emerytury lub renty
          "1": osoba, która ma ustalone prawo do emerytury
          "2": osoba, która ma ustalone prawo do renty
        stopien_niepelnosprawnosci:
          "0": osoba nieposiadająca orzeczenia o niepełnosprawności lub osoba, która posiada orzeczenie i nie przedłożyła go płatnikowi składek
          "1": orzeczenie o lekkim stopniu niepełnosprawności przedłożone płatnikowi składek
          "2": orzeczenie o umiarkowanym stopniu niepełnosprawności przedłożone płatnikowi składek
          "3": orzeczenie o znacznym stopniu niepełnosprawności przedłożone płatnikowi składek
          "4": orzeczenie o niepełnosprawności wydawane osobom do 16. roku życia przedłożone płatnikowi
      note: >-
        Kod tytułu ubezpieczenia ma 6 znaków: 4 znaki podmiotu podstawowego z rozszerzeniem (klucze w części podmiot),
        1 znak prawa do emerytury lub renty i 1 znak stopnia niepełnosprawności. W bloku X deklaracji ZUS DRA wpisujesz
        kod, który podałeś w zgłoszeniu do ubezpieczeń. Część podmiot zawiera tylko kody grupy 05 dla osoby
        prowadzącej pozarolniczą działalność gospodarczą i osoby z art. 18 ust. 1 Prawa przedsiębiorców; opisy są
        skrócone, pełne brzmienie i pozostałe kody (w tym 05 11 i 05 81 dla osób współpracujących, 05 13 dla korekt za okresy
        do grudnia 2007 r., 05 20 twórca, 05 30 artysta, 05 43, 05 44) są w załączniku nr 24. Wybór kodu dla konkretnej osoby zależy od tytułu ubezpieczenia
        i podstawy wymiaru składek; ten wpis go nie opisuje. Data początku obowiązywania to dzień wejścia w życie
        rozporządzenia Dz.U. 2026 poz. 518; do dokumentów dotyczących okresu sprzed tego dnia stosuje się kody
        tytułu ubezpieczenia z rozporządzenia z 20 grudnia 2020 r. obowiązujące w tamtym okresie (§ 5). Wersji
        wcześniejszych nie wprowadzono.
      sources:
        - title: Dz.U. 2026 poz. 518, rozporządzenie MRPiPS z 9 kwietnia 2026 r. w sprawie wzorów dokumentów ubezpieczeniowych, załącznik nr 24 (budowa kodu)
          url: https://api.sejm.gov.pl/eli/acts/DU/2026/518/text.pdf
          article: § 2, załącznik nr 24 część I
          quote: "05 70 - osoba prowadząca pozarolniczą działalność gospodarczą niemająca ustalonego prawa do renty z tytułu niezdolności do pracy, dla której podstawę wymiaru składek na ubezpieczenia społeczne stanowi zadeklarowana kwota nieniższa niż 30 % kwoty minimalnego wynagrodzenia"
        - title: Dz.U. 2026 poz. 518, załącznik nr 24 część I pkt 2 (prawo do emerytury lub renty)
          url: https://api.sejm.gov.pl/eli/acts/DU/2026/518/text.pdf
          article: załącznik nr 24 część I pkt 2
          confirms: [prawo_do_emerytury_lub_renty]
          quote: "0 - osoba, która nie ma ustalonego prawa do emerytury lub renty 1 - osoba, która ma ustalone prawo do emerytury 2 - osoba, która ma ustalone prawo do renty"
        - title: Dz.U. 2026 poz. 518, załącznik nr 24 część I pkt 3 (stopień niepełnosprawności)
          url: https://api.sejm.gov.pl/eli/acts/DU/2026/518/text.pdf
          article: załącznik nr 24 część I pkt 3
          quote: "3 - osoba, która przedłożyła płatnikowi składek orzeczenie o znacznym stopniu niepełnosprawności 4 - osoba, która przedłożyła płatnikowi orzeczenie o niepełnosprawności wydawane osobom do 16. roku życia"
        - title: Dz.U. 2026 poz. 518 (wejście w życie)
          url: https://api.sejm.gov.pl/eli/acts/DU/2026/518/text.pdf
          article: § 8
          quote: "Rozporządzenie wchodzi w życie po upływie 14 dni od dnia ogłoszenia"
        - title: Dz.U. 2026 poz. 518 (kody za okresy sprzed wejścia w życie)
          url: https://api.sejm.gov.pl/eli/acts/DU/2026/518/text.pdf
          article: § 5
          quote: "W przypadku przekazywania dokumentu dotyczącego okresu przed dniem wejścia w życie niniejszego rozporządzenia stosuje się kody tytułu ubezpieczenia określone w rozporządzeniu, o którym mowa w § 7"
        - title: Dz.U. 2026 poz. 518, załącznik nr 24 część I pkt 1 (kody grupy 05, s. 49–51; cytat obejmuje nagłówki stron 50 i 51, które przerywają wykaz)
          url: https://api.sejm.gov.pl/eli/acts/DU/2026/518/text.pdf
          article: załącznik nr 24 część I pkt 1
          confirms: [podmiot]
          quote: "05 10 - osoba prowadząca pozarolniczą działalność gospodarczą na podstawie przepisów o działalności gospodarczej lub innych przepisów szczególnych niemająca ustalonego prawa do renty z tytułu niezdolności do pracy, dla której podstawę wymiaru składek na ubezpieczenia społeczne stanowi zadeklarowana kwota nieniższa niż 60 % kwoty przeciętnego miesięcznego wynagrodzenia, osoba prowadząca niepubliczną bądź publiczną szkołę, placówkę lub ich zespół, na podstawie przepisów o systemie oświaty oraz osoba prowadząca pozarolniczą działalność w zakresie wolnego zawodu 05 11 - osoba współpracująca z osobą prowadzącą pozarolniczą działalność oraz osobą fizyczną, o której mowa w art. 18 ust. 1 ustawy z dnia 6 marca 2018 r. - Prawo przedsiębiorców Dziennik Ustaw – 50 – Poz. 518 05 12 - osoba prowadząca pozarolniczą działalność gospodarczą na podstawie przepisów o działalności gospodarczej lub innych przepisów szczególnych mająca ustalone prawo do renty z tytułu niezdolności do pracy, dla której podstawę wymiaru składek na ubezpieczenia społeczne stanowi zadeklarowana kwota nieniższa niż 60 % kwoty przeciętnego miesięcznego wynagrodzenia 05 13 - osoba niepełnosprawna, która po raz pierwszy podjęła prowadzenie pozarolniczej działalności gospodarczej i skorzystała z dofinansowania składek na ubezpieczenia społeczne ze środków Państwowego Funduszu Rehabilitacji Osób Niepełnosprawnych na podstawie art. 25 ust. 3b ustawy z dnia 27 sierpnia 1997 r. o rehabilitacji zawodowej i społecznej oraz zatrudnianiu osób niepełnosprawnych, w brzmieniu obowiązującym do dnia 1 stycznia 2008 r., a obecnie ma obowiązek dopłaty składek i przekazuje po dniu 30 czerwca 2008 r. dokumenty rozliczeniowe korygujące za okres do grudnia 2007 r. 05 14 - osoba prowadząca pozarolniczą działalność gospodarczą zwolniona z opłacania składek, dla której podstawę wymiaru składek na ubezpieczenia społeczne stanowi 60 % kwoty prognozowanego przeciętnego wynagrodzenia miesięcznego 05 20 - twórca 05 30 - artysta 05 40 - osoba niepodlegająca ubezpieczeniom społecznym i podlegająca ubezpieczeniu zdrowotnemu, zgodnie z art. 18 ust. 1 ustawy z dnia 6 marca 2018 r. - Prawo przedsiębiorców 05 43 - wspólnik jednoosobowej spółki z ograniczoną odpowiedzialnością oraz wspólnicy spółki jawnej, komandytowej lub partnerskiej, komplementariusz w spółce komandytowo-akcyjnej oraz akcjonariusz prostej spółki akcyjnej wnoszący jako wkład świadczenie pracy lub usług 05 44 - osoba prowadząca pozarolniczą działalność, z mocy przepisów szczególnych niepodlegająca ubezpieczeniu zdrowotnemu 05 45 - osoba współpracująca z osobą prowadzącą pozarolniczą działalność, z mocy przepisów szczególnych niepodlegająca ubezpieczeniu zdrowotnemu 05 70 - osoba prowadząca pozarolniczą działalność gospodarczą niemająca ustalonego prawa do renty z tytułu niezdolności do pracy, dla której podstawę wymiaru składek na ubezpieczenia społeczne stanowi zadeklarowana kwota nieniższa niż 30 % kwoty minimalnego wynagrodzenia 05 72 - osoba prowadząca pozarolniczą działalność gospodarczą mająca ustalone prawo do renty z tytułu niezdolności do pracy, dla której podstawę wymiaru składek na ubezpieczenia społeczne stanowi zadeklarowana kwota nieniższa niż 30 % kwoty minimalnego wynagrodzenia 05 74 - osoba prowadząca pozarolniczą działalność gospodarczą zwolniona z opłacania składek, dla której podstawę wymiaru składek na ubezpieczenia społeczne stanowi 30 % kwoty minimalnego wynagrodzenia 05 80 - osoba prowadząca pozarolniczą działalność, której zasiłek macierzyński nie przekracza kwoty świadczenia rodzicielskiego 05 81 - osoba współpracująca z osobą prowadzącą pozarolniczą działalność, której zasiłek macierzyński nie przekracza kwoty świadczenia rodzicielskiego 05 90 - osoba prowadząca pozarolniczą działalność gospodarczą niemająca ustalonego prawa do renty z tytułu niezdolności do pracy, dla której podstawa wymiaru składek na ubezpieczenia społeczne uzależniona jest od dochodu Dziennik Ustaw – 51 – Poz. 518 05 92 - osoba prowadząca pozarolniczą działalność gospodarczą mająca ustalone prawo do renty z tytułu niezdolności do pracy, dla której podstawa wymiaru składek na ubezpieczenia społeczne uzależniona jest od dochodu 05 94 - osoba prowadząca pozarolniczą działalność gospodarczą zwolniona z opłacania składek, dla której podstawa wymiaru składek na ubezpieczenia społeczne uzależniona jest od dochodu"

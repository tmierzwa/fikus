          as_of: 2022-01-01
        - title: ZUS, poradnik „ZUS DRA. Deklaracja rozliczeniowa. Jak wypełnić i skorygować”, maj 2026 (blok X, pole 01)
          url: https://www.zus.pl/documents/10182/167567/poradnik+ZUS+DRA.pdf
          quote: "który podałeś w zgłoszeniu do ubezpieczeń. Obowiązujące kody tytułów ubezpieczeń znajdziesz w poradniku Ogólne zasady wypełniania i korygowania dokumentów ubezpieczeniowych"
          as_of: 2026-05-01
      verification:
        checked_at: 2026-11-27
        agent_check: 2026-11-27
        open_issue: >-
          Datę początku obowiązywania wykazu (30 kwietnia 2026 r.) podaje tylko rozporządzenie Dz.U. 2026 poz. 518.
          Wykaz kodów zgodny z tym rozporządzeniem podaje poza nim tylko portal pit.pl (źródło kontrolne) na stronie „Kody tytułów ubezpieczeń 2026”
          z datą artykułu 8 grudnia 2023 r., choć treść wykazu odpowiada rozporządzeniu z 2026 r.; jako podstawę strona
          podaje załącznik nr 24 rozporządzenia tylko z tytułu, bez daty i bez pozycji w Dz.U., i nie mówi, od kiedy
          wykaz obowiązuje.
          Poradnik ZUS „Ogólne zasady wypełniania i korygowania dokumentów ubezpieczeniowych” jest w wydaniu z sierpnia
          2023 r., a jego wykaz kodów (rozdział VII) ma stan na styczeń 2022 r.: nie ma kodów 05 14, 05 74 i 05 94, a przy 05 90 i 05 92 podaje podstawę „uzależnioną od przychodu”, a nie od dochodu. Specyfikacja ZUS
          dla oprogramowania interfejsowego (wersja 2.27, od 25 kwietnia 2026 r.) nie zawiera wykazu kodów. Potrzebny
          drugi dokument, który sam podaje, od kiedy obowiązuje wykaz; to nie jest pytanie o interpretację przepisów.

- id: zasada.dra_finansowanie_skladek
  name: Kolumny finansowania składek w deklaracji ZUS DRA za siebie (bloki IV i VI)
  kind: rule
  versions:
    - valid_from: 2026-05-01
      value:
        steps:
          - text: Składki na własne ubezpieczenia emerytalne, rentowe, chorobowe i wypadkowe z tytułu prowadzenia działalności finansujesz w całości z własnych środków jako ubezpieczony.
            uses: []
            basis: art. 16 ust. 4 pkt 1 ustawy o systemie ubezpieczeń społecznych
          - text: Jeżeli opłacasz składki wyłącznie za siebie, w bloku IV wykazujesz je w polach składek finansowanych przez ubezpieczonego (pola 04–06 dla ubezpieczeń emerytalnego i rentowych, pola 22–24 dla ubezpieczeń chorobowego i wypadkowego). Pól składek finansowanych przez płatnika (07–09 i 25–27), przez budżet państwa i przez Fundusz Kościelny nie wypełniasz.
            uses: [schemat.zus_dra]
            basis: poradnik ZUS „ZUS DRA. Deklaracja rozliczeniowa. Jak wypełnić i skorygować” (maj 2026), przykład 1, blok IV
          - text: Składkę zdrowotną za siebie wykazujesz w bloku VI w polu 02 (składka finansowana przez ubezpieczonego), jako sumę składek ustalonych dla form opodatkowania wykazanych w bloku XI. Pola 01 (składka finansowana przez płatnika) nie wypełniasz.
            uses: [zasada.dra_bloki_zdrowotne]
            basis: poradnik ZUS „ZUS DRA. Deklaracja rozliczeniowa. Jak wypełnić i skorygować” (maj 2026), przykład 1, blok VI
          - text: Ta zasada nie opisuje składek osób współpracujących, które finansujesz jako płatnik, ani miesięcy objętych zwolnieniem z opłacenia składek z art. 17a (wakacje składkowe), za które składki finansuje budżet państwa.
            uses: []
            basis: art. 16 ust. 4a i 5a ustawy o systemie ubezpieczeń społecznych
      note: >-
        Numery pól odpowiadają wzorowi ZUS DRA z załącznika nr 16 do rozporządzenia Dz.U. 2026 poz. 518 (od 1 maja
        2026 r., schemat.zus_dra), stąd data początku obowiązywania; art. 16 ust. 4 obowiązywał już wcześniej.
        Kroki o polach opisują przykład 1 z poradnika ZUS: deklarację osoby, która opłaca składki tylko za siebie.
        Żadne źródło poza materiałami ZUS nie opisuje tych pól, więc wersja nie ma drugiego niezależnego dowodu.
      sources:
        - title: Dz.U. 2026 poz. 1474, tekst jednolity ustawy o systemie ubezpieczeń społecznych (finansowanie składek osób prowadzących działalność)
          url: https://api.sejm.gov.pl/eli/acts/DU/2026/1474/text.pdf
          article: art. 16 ust. 4
          quote: "osób prowadzących pozarolniczą działalność, 2) osób, o których mowa w art. 7, 3) marynarzy – finansują w całości, z własnych środków, sami ubezpieczeni"
        - title: ZUS, poradnik „ZUS DRA. Deklaracja rozliczeniowa. Jak wypełnić i skorygować”, maj 2026 (przykład 1, osoba opłacająca składki tylko za siebie)
          url: https://www.zus.pl/documents/10182/167567/poradnik+ZUS+DRA.pdf
          quote: "Na stronach 4–7 przedstawiliśmy wzór wypełnionej deklaracji rozliczeniowej za maj 2026 r. osoby, która opłaca składki tylko za siebie."
          as_of: 2026-05-01
        - title: ZUS, poradnik „ZUS DRA…”, maj 2026 (blok IV, pole 07)
          url: https://www.zus.pl/documents/10182/167567/poradnik+ZUS+DRA.pdf
          quote: "W polu 07 – wpisz kwotę składki na ubezpieczenie emerytalne finansowanej przez Ciebie. W naszym przykładzie nie wypełniasz tego pola, bo składka finansowana jest tylko przez ubezpieczonego."
          as_of: 2026-05-01
        - title: ZUS, poradnik „ZUS DRA…”, maj 2026 (blok IV, pole 23)
          url: https://www.zus.pl/documents/10182/167567/poradnik+ZUS+DRA.pdf
          quote: "kwotę składek na ubezpieczenie wypadkowe finansowanych przez ubezpieczonego"
          as_of: 2026-05-01
        - title: ZUS, poradnik „ZUS DRA…”, maj 2026 (blok VI, pole 02)
          url: https://www.zus.pl/documents/10182/167567/poradnik+ZUS+DRA.pdf
          quote: "wysokość składki na ubezpieczenie zdrowotne, które finansuje ubezpieczony. W tym polu wpisujesz sumę składek ustalonych dla form opodatkowania wykazanych w bloku XI."
          as_of: 2026-05-01
      verification: {checked_at: 2026-11-27, agent_check: 2026-11-27}

- id: zasada.dra_bloki_zdrowotne
  name: Składka zdrowotna w deklaracji ZUS DRA za siebie (bloki XI i XII)
  kind: rule
  versions:
    - valid_from: 2026-05-01
      value:
        steps:
          - text: W bloku XI zaznaczasz formę opodatkowania, którą stosowałeś w rozliczanym miesiącu, i wypełniasz pola tej formy.
            uses: [schemat.zus_dra]
            basis: poradnik ZUS „ZUS DRA. Deklaracja rozliczeniowa. Jak wypełnić i skorygować” (maj 2026), blok XI
          - text: Na skali podatkowej w polu 02 wpisujesz dochód uzyskany w miesiącu bezpośrednio poprzedzającym rozliczany miesiąc, w polu 03 podstawę wymiaru, a w polu 04 składkę. Na podatku liniowym w polach 06–08 wpisujesz te same dane, a dochód ustalasz tak samo jak na skali. Jak ustalić dochód i podstawę, opisują zasady składki zdrowotnej dla tych form.
            uses: [zasada.skala_zdrowotna, zasada.liniowy_zdrowotna]
            basis: art. 81 ust. 2c ustawy o świadczeniach opieki zdrowotnej; poradnik ZUS (maj 2026), blok XI, pola 02–08
          - text: Na ryczałcie w polu 13 wpisujesz sumę przychodów od początku roku kalendarzowego do końca rozliczanego miesiąca, jeżeli ustalasz składkę według przychodów bieżącego roku, a w polu 16 podstawę wymiaru i w polu 17 składkę dla progu przychodu. Czy w tym polu wpisujesz przychód pomniejszony o opłacone składki emerytalną, rentową, chorobową i wypadkową (art. 81 ust. 2g), czy przychód bez pomniejszenia, i czy chodzi o składki zapłacone w tym okresie, czy należne za jego miesiące, jest niewyjaśnione (otwarte pytanie do eksperta).
            uses: [zasada.ryczalt_zdrowotna_prog, zdrowotna.ryczalt.podstawa, zdrowotna.ryczalt.skladka]
            basis: art. 81 ust. 2f i 2g ustawy o świadczeniach opieki zdrowotnej; poradnik ZUS (maj 2026), blok XI, pola 13, 16 i 17 i przypis 9 wzoru
          - text: Jeżeli ustalasz składkę według przychodu z poprzedniego roku, zaznaczasz pole 14, a w polu 15 wpisujesz kwotę rocznych przychodów w rozumieniu art. 81 ust. 2h, czyli przychód z poprzedniego roku pomniejszony o składki emerytalną, rentową, chorobową i wypadkową opłacone w poprzednim roku, jeżeli nie zostały zaliczone do kosztów ani odliczone od dochodu. Podstawę i składkę wpisujesz tak jak przy przychodach bieżącego roku, w polach 16 i 17.
            uses: [zasada.ryczalt_zdrowotna_prog_poprzedni_rok, zdrowotna.ryczalt.podstawa, zdrowotna.ryczalt.skladka]
            basis: art. 81 ust. 2f i 2h ustawy o świadczeniach opieki zdrowotnej; poradnik ZUS (maj 2026), blok XI, pola 14–17 i przypis 10 wzoru
          - text: Blok XII wypełniasz w deklaracji, w której wykazujesz roczne rozliczenie składki zdrowotnej, czyli za kwiecień następnego roku. W polu 01 wpisujesz rok, którego dotyczy rozliczenie. Dla skali podatkowej służą pola 04–12, dla podatku liniowego pola 13–20, a dla ryczałtu pola 21–27.
            uses: [zasada.roczne_rozliczenie_zdrowotnej, termin.roczne_rozliczenie_zdrowotnej]
            basis: art. 81 ust. 2k i 2ka ustawy o świadczeniach opieki zdrowotnej; poradnik ZUS (maj 2026), blok XII
          - text: Na ryczałcie w polu 22 wpisujesz kwotę przychodów z działalności w roku, którego dotyczy rozliczenie, w polu 23 roczną podstawę wymiaru, a w polu 24 roczną składkę. Czy w polu 22 wpisujesz przychód pomniejszony o opłacone składki, czy bez pomniejszenia, i czy chodzi o składki zapłacone w roku, czy należne za jego miesiące, jest niewyjaśnione (otwarte pytanie do eksperta).
            uses: [zasada.ryczalt_zdrowotna_prog]
            basis: art. 81 ust. 2e i 2g ustawy o świadczeniach opieki zdrowotnej; poradnik ZUS (maj 2026), blok XII, pola 21–24
          - text: Pole 25 (pola 10 i 18 dla skali i podatku liniowego) wzór opisuje jako sumę miesięcznych należnych składek wynikającą ze złożonych dokumentów za rok, którego dotyczy rozliczenie. Pole 26 to według wzoru kwota do dopłaty (pole 24 minus pole 25), a pole 27 kwota do zwrotu (pole 25 minus pole 24). W polach 28 i 29 wpisujesz łączną kwotę do dopłaty albo do zwrotu dla wszystkich form opodatkowania. Ustawa liczy niedopłatę od sumy składek wynikającej ze złożonych dokumentów, a zwrot od sumy składek wpłaconych za poszczególne miesiące. Co wpisujesz w polu 25 i od której kwoty ustalasz zwrot, gdy składki należne i wpłacone się różnią, jest niewyjaśnione (otwarte pytanie do eksperta).
            uses: [zasada.roczne_rozliczenie_zdrowotnej]
            basis: art. 81 ust. 2i i 2j ustawy o świadczeniach opieki zdrowotnej; poradnik ZUS (maj 2026), blok XII, pola 10 i 25–29
          - text: Ta zasada nie opisuje pól dla karty podatkowej i osób bez formy opodatkowania, pól XII 02–03, 06–07 i 15 (zmiana formy opodatkowania w 2022 r., zbycie składników majątku, obniżenie składki do wysokości zaliczki), korekty rozliczenia rocznego ani tego, czy w polu 25 uwzględnia się deklaracje korygujące za miesiące roku rozliczenia.
            uses: []
            basis: poradnik ZUS (maj 2026), bloki XI i XII
      note: >-
        Numery pól odpowiadają wzorowi ZUS DRA z załącznika nr 16 do rozporządzenia Dz.U. 2026 poz. 518 (od 1 maja
        2026 r., schemat.zus_dra), stąd data początku obowiązywania. Opisy pól pochodzą z poradnika ZUS z maja 2026 r.
        i z przypisów wzoru, które poradnik przytacza. W przykładach z poradnika na ryczałcie pole XI 13 (pan Czesław) i pole
        XII 22 (pan Jan) zawierają sumę przychodów podaną w opisie przykładu, bez wzmianki o składkach, a ten sam
        poradnik w opisie rocznej podstawy na ryczałcie każe odjąć od przychodów opłacone składki. Żadne źródło poza
        materiałami ZUS nie opisuje tych pól, więc wersja nie ma drugiego niezależnego dowodu.
      sources:
        - title: ZUS, poradnik „ZUS DRA. Deklaracja rozliczeniowa. Jak wypełnić i skorygować”, maj 2026 (blok XI, pole 02)
          url: https://www.zus.pl/documents/10182/167567/poradnik+ZUS+DRA.pdf
          quote: "W polu 02 – wpisz wysokość dochodu, który uzyskałeś w miesiącu bezpośrednio poprzedzającym"
          as_of: 2026-05-01
        - title: ZUS, poradnik „ZUS DRA…”, maj 2026 (blok XI, pole 06)
          url: https://www.zus.pl/documents/10182/167567/poradnik+ZUS+DRA.pdf
          quote: "W polu 06 – wpisz dochód uzyskany w miesiącu, który bezpośrednio poprzedza rozliczany miesiąc. Dochód ustalasz tak, jak w polu 02."
          as_of: 2026-05-01
        - title: ZUS, poradnik „ZUS DRA…”, maj 2026 (blok XI, pole 13)
          url: https://www.zus.pl/documents/10182/167567/poradnik+ZUS+DRA.pdf
          quote: "W polu 13 – wpisz sumę przychodów z bieżącego roku kalendarzowego, jeśli chcesz ustalać składkę na podstawie bieżących przychodów. Jest to wysokość przychodów osiągniętych od początku roku kalendarzowego do końca miesiąca, który rozliczasz."
          as_of: 2026-05-01
        - title: ZUS, poradnik „ZUS DRA…”, maj 2026 (blok XI, pole 15)
          url: https://www.zus.pl/documents/10182/167567/poradnik+ZUS+DRA.pdf
          quote: "W polu 15 – wpisz sumę przychodów w poprzednim roku kalendarzowym. Jest to kwota rocznych przychodów w rozumieniu art. 81 ust. 2h"
          as_of: 2026-05-01
        - title: ZUS, poradnik „ZUS DRA…”, maj 2026 (wzór, blok XII, pole 25)
          url: https://www.zus.pl/documents/10182/167567/poradnik+ZUS+DRA.pdf
          quote: "25. Suma miesięcznych należnych składek wynikająca ze złożonych dokumentów za rok, którego dotyczy roczne rozliczenie"
          as_of: 2026-05-01
        - title: ZUS, poradnik „ZUS DRA…”, maj 2026 (blok XII, pole 10)
          url: https://www.zus.pl/documents/10182/167567/poradnik+ZUS+DRA.pdf
          quote: "W polu 10 – wpisz sumę miesięcznych składek, która wynika z dokumentów rozliczeniowych za poszczególne miesiące w roku, za który dokonujesz rozliczenia."
          as_of: 2026-05-01
        - title: ZUS, poradnik „ZUS DRA…”, maj 2026 (wzór, blok XII, pole 22)
          url: https://www.zus.pl/documents/10182/167567/poradnik+ZUS+DRA.pdf
          quote: "22. Kwota przychodów osiągniętych z działalności gospodarczej w roku, którego dotyczy roczne rozliczenie"
          as_of: 2026-05-01
        - title: Dz.U. 2025 poz. 1461, tekst jednolity ustawy o świadczeniach opieki zdrowotnej (pomniejszenie przychodów o składki)
          url: https://api.sejm.gov.pl/eli/acts/DU/2025/1461/text.pdf
          article: art. 81 ust. 2g
          quote: "Przychody, o których mowa w ust. 2e i 2f, są pomniejszane o kwoty opłaconych składek na ubezpieczenia emerytalne, rentowe, chorobowe i wypadkowe"
        - title: Dz.U. 2025 poz. 1461, tekst jednolity ustawy o świadczeniach opieki zdrowotnej (przychód z poprzedniego roku)
          url: https://api.sejm.gov.pl/eli/acts/DU/2025/1461/text.pdf
          article: art. 81 ust. 2h
          quote: "kwotę przychodów uzyskanych w poprzednim roku kalendarzowym pomniejszoną o kwotę opłaconych w poprzednim roku kalendarzowym składek na ubezpieczenia emerytalne, rentowe, chorobowe i wypadkowe"
        - title: Dz.U. 2025 poz. 1461, tekst jednolity ustawy o świadczeniach opieki zdrowotnej (niedopłata)
          url: https://api.sejm.gov.pl/eli/acts/DU/2025/1461/text.pdf
          article: art. 81 ust. 2j
          quote: "a sumą składek na ubezpieczenie zdrowotne wynikającą ze złożonych dokumentów za poszczególne miesiące roku składkowego albo roku kalendarzowego"
        - title: Dz.U. 2025 poz. 1461, tekst jednolity ustawy o świadczeniach opieki zdrowotnej (nadpłata)
          url: https://api.sejm.gov.pl/eli/acts/DU/2025/1461/text.pdf
          article: art. 81 ust. 2i
          quote: "suma wpłaconych za poszczególne miesiące roku składkowego albo roku kalendarzowego"
        - title: Dz.U. 2025 poz. 1461, tekst jednolity ustawy o świadczeniach opieki zdrowotnej (miesięczna podstawa na skali)
          url: https://api.sejm.gov.pl/eli/acts/DU/2025/1461/text.pdf
          article: art. 81 ust. 2c
          quote: "dochód z działalności gospodarczej uzyskany w miesiącu poprzedzającym miesiąc, za który opłacana jest składka"
      verification:
        checked_at: 2026-11-27
        agent_check: 2026-11-27
        open_issue: >-
          Art. 81 ust. 2g ustawy o świadczeniach opieki zdrowotnej pomniejsza przychody z ust. 2e i 2f o „kwoty opłaconych
          składek” bez wskazania okresu, a ust. 2h przy przychodzie z poprzedniego roku mówi o składkach „opłaconych
          w poprzednim roku kalendarzowym”. Wzór ZUS DRA w polach XI 13 i XII 22 mówi o „przychodach”; poradnik ZUS przy
          tych polach nie wspomina o pomniejszeniu, a w przykładach wpisuje w nie sumę przychodów, choć w opisie rocznej
          podstawy na ryczałcie każe odjąć opłacone składki. Pytania do eksperta:
          docs/pytania-do-eksperta.md, P43 (przychód w polach XI 13 i XII 22), P44 (składki zapłacone w okresie czy
          należne za jego miesiące) i P45 (kwota do zwrotu w polu XII 27: składki należne czy wpłacone; art. 81 ust. 2i
          mówi o „sumie wpłaconych” składek, a pole 25 o składkach należnych).

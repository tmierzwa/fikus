          quote: "05 10 – osoba prowadząca pozarolniczą działalność gospodarczą na podstawie przepisów o działalności gospodarczej lub innych przepisów szczególnych niemająca ustalonego prawa do renty z tytułu niezdolności do pracy, dla której podstawę wymiaru składek na ubezpieczenia społeczne stanowi zadeklarowana kwota nie niższa niż 60% kwoty przeciętnego miesięcznego wynagrodzenia, osoba prowadząca niepubliczną bądź publiczną szkołę, placówkę lub ich zespół, na podstawie przepisów o systemie oświaty oraz osoba prowadząca pozarolniczą działalność w zakresie wolnego zawodu 05 11 – osoba współpracująca z osobą prowadzącą pozarolniczą działalność oraz osobą fizyczną, o której mowa w art. 18 ust. 1 ustawy z dnia 6 marca 2018 r. – Prawo przedsiębiorców 05 12 – osoba prowadząca pozarolniczą działalność gospodarczą na podstawie przepisów o działalności gospodarczej lub innych przepisów szczególnych mająca ustalone prawo do renty z tytułu niezdolności do pracy, dla której podstawę wymiaru składek na ubezpieczenia społeczne stanowi zadeklarowana kwota nie niższa niż 60% kwoty przeciętnego miesięcznego wynagrodzenia 05 13 – osoba niepełnosprawna, która po raz pierwszy podjęła prowadzenie pozarolniczej działalności gospodarczej i skorzystała z dofinansowania składek na ubezpieczenia społeczne ze środków Państwowego Funduszu Rehabilitacji Osób Niepełnosprawnych na podstawie art. 25 ust. 3b ustawy z dnia 27 sierpnia 1997 r. o rehabilitacji zawodowej i społecznej oraz zatrudnianiu osób niepełnosprawnych, w brzmieniu obowiązującym do dnia 1 stycznia 2008 r., a obecnie ma obowiązek dopłaty składek i przekazuje po dniu 30 czerwca 2008 r. dokumenty rozliczeniowe korygujące za okres do grudnia 2007 r. 05 14 – osoba prowadząca pozarolniczą działalność gospodarczą zwolniona z opłacania składek, dla której podstawę wymiaru składek na ubezpieczenia społeczne stanowi 60 % kwoty prognozowanego przeciętnego wynagrodzenia miesięcznego 05 20 – twórca 05 30 – artysta 05 40 – osoba niepodlegająca ubezpieczeniom społecznym i podlegająca ubezpieczeniu zdrowotnemu, zgodnie z art. 18 ust. 1 ustawy z dnia 6 marca 2018 r. – Prawo przedsiębiorców 05 43 – wspólnik jednoosobowej spółki z ograniczoną odpowiedzialnością oraz wspólnicy spółki jawnej, komandytowej lub partnerskiej, komplementariusz w spółce komandytowo-akcyjnej oraz akcjonariusz prostej spółki akcyjnej wnoszący jako wkład świadczenie pracy lub usług 05 44 – osoba prowadząca pozarolniczą działalność, z mocy przepisów szczególnych niepodlegająca ubezpieczeniu zdrowotnemu 05 45 – osoba współpracująca z osobą prowadzącą pozarolniczą działalność, z mocy przepisów szczególnych niepodlegająca ubezpieczeniu zdrowotnemu 05 70 – osoba prowadząca pozarolniczą działalność gospodarczą niemająca ustalonego prawa do renty z tytułu niezdolności do pracy, dla której podstawę wymiaru składek na ubezpieczenia społeczne stanowi zadeklarowana kwota nie niższa niż 30% kwoty minimalnego wynagrodzenia 05 72 – osoba prowadząca pozarolniczą działalność gospodarczą mająca ustalone prawo do renty z tytułu niezdolności do pracy, dla której podstawę wymiaru składek na ubezpieczenia społeczne stanowi zadeklarowana kwota nie niższa niż 30% kwoty minimalnego wynagrodzenia 05 74 – osoba prowadząca pozarolniczą działalność gospodarczą zwolniona z opłacania składek, dla której podstawę wymiaru składek na ubezpieczenia społeczne stanowi 30 % kwoty minimalnego wynagrodzenia 05 80 – osoba prowadząca pozarolniczą działalność, której zasiłek macierzyński nie przekracza kwoty świadczenia rodzicielskiego 05 81 – osoba współpracująca z osobą prowadzącą pozarolniczą działalność, której zasiłek macierzyński nie przekracza kwoty świadczenia rodzicielskiego 05 90 – osoba prowadząca pozarolniczą działalność gospodarczą niemająca ustalonego prawa do renty z tytułu niezdolności do pracy, dla której podstawa wymiaru składek na ubezpieczenia społeczne uzależniona jest od dochodu 05 92 – osoba prowadząca pozarolniczą działalność gospodarczą mająca ust
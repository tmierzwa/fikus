        - title: Dz.U. 2026 poz. 592, tekst jednolity ustawy o podatku dochodowym od osób fizycznych (odliczenie kosztów kwalifikowanych)
          url: https://api.sejm.gov.pl/eli/acts/DU/2026/592/text.pdf

        open_issue: >-
          Krok o podstawie odliczenia: art. 26e ust. 1 mówi o podstawie ustalonej zgodnie z art. 26 ust. 1 lub art. 30c
          ust. 2, a art. 26i ust. 1 o podstawie ustalonej zgodnie z art. 26 ust. 1, art. 30c ust. 2 lub art. 30ca ust. 3
          po uprzednim odliczeniu kwot z art. 26e. Nie wiadomo, czy kwoty z art. 26e odlicza się także od podstawy
          opodatkowanej stawką IP Box. Pytanie do eksperta: docs/pytania-do-eksperta.md, P64.

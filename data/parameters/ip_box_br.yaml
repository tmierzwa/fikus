          url: https://api.sejm.gov.pl/eli/acts/DU/2026/592/text.pdf
          article: art. 30ca ust. 6
          quote: "jest większa od 1, przyjmuje się, że wartość ta wynosi 1"
        - title: Dz.U. 2026 poz. 592, tekst jednolity ustawy o podatku dochodowym od osób fizycznych (dochód z kwalifikowanego prawa)
          url: https://api.sejm.gov.pl/eli/acts/DU/2026/592/text.pdf

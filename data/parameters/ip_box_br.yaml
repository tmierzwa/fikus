# IP Box (art. 30ca i 30cb ustawy o PIT) i ulga badawczo-rozwojowa (art. 26e). Obie dotyczą dochodów
# z działalności opodatkowanych według skali albo podatkiem liniowym; na ryczałcie nie przysługują.
# Serwer podaje stawkę i procenty odliczenia oraz opisuje zasady krokami z podstawą prawną. Czy prawo
# jest kwalifikowane, czy działalność jest badawczo-rozwojowa i ile wynosi odliczenie, ustala podatnik
# albo klient.

- id: ip_box.stawka
  name: Stawka podatku od kwalifikowanego dochodu z kwalifikowanych praw własności intelektualnej (IP Box)
  unit: "% podstawy"
  applies_to: {tax_form: [skala, liniowy]}
  versions:
    - valid_from: 2026-01-01
      value: 5
      note: >-
        Stawka dotyczy podstawy opodatkowania, a nie całego dochodu z działalności. Czym jest ta podstawa, kto może
        skorzystać ze stawki i dlaczego nie dotyczy ona ryczałtu, opisuje zasada opodatkowania IP Box.
        Tekst jednolity Dz.U. 2026 poz. 592 uwzględnia stan prawny na 1 kwietnia 2026 r.; zmiany ustawy o PIT, które weszły w życie po 1 stycznia 2026 r., a przed 1 kwietnia 2026 r. (Dz.U. 2025 poz. 1795, Dz.U. 2026 poz. 203 i 424), zmieniają
        tylko art. 21 i 52zr, więc stawka obowiązywała od 1 stycznia 2026 r. Późniejsze nowelizacje (Dz.U. 2026 poz. 779,
        846, 1079, 1098, 1123, 1287, 1347, 1354, 1371, 1541, 1542 i 1556) art. 30ca nie zmieniają. Wcześniejszych wersji
        nie wprowadzono.
      sources:
        - title: Dz.U. 2026 poz. 592, tekst jednolity ustawy o podatku dochodowym od osób fizycznych
          url: https://api.sejm.gov.pl/eli/acts/DU/2026/592/text.pdf
          article: art. 30ca ust. 1
          quote: "kwalifikowanego dochodu z kwalifikowanych praw własności intelektualnej wynosi 5 % podstawy opodatkowania"
        - title: Objaśnienia podatkowe Ministra Finansów z 15 lipca 2019 r. dotyczące preferencyjnego opodatkowania dochodów wytwarzanych przez prawa własności intelektualnej – IP Box
          url: https://www.gov.pl/attachment/8b23d192-0777-4e1a-8fb3-355f797a1200
          article: akapit 1
          quote: "preferencyjne opodatkowanie 5% stawką podatkową dochodów uzyskiwanych przez podatnika z kwalifikowanych praw własności intelektualnej"
          independent: true
          as_of: 2019-07-15
        - title: podatki.gov.pl (MF), IP BOX – Rozliczenie dochodów z kwalifikowanych praw własności intelektualnej PIT, aktualizacja 24.06.2026
          url: https://podatki.gov.pl/poradniki-i-informatory/ip-box-rozliczenie-dochodow-z-kwalifikowanych-praw-wlasnosci-intelektualnej-pit
          kind: control
          quote: "5% podatek oblicz od podstawy opodatkowania."
          as_of: 2026-11-26
      verification: {checked_at: 2026-11-26}

- id: zasada.ip_box
  name: Opodatkowanie kwalifikowanych dochodów z kwalifikowanych praw własności intelektualnej (IP Box)
  kind: rule
  applies_to: {tax_form: [skala, liniowy]}
  versions:
    - valid_from: 2026-01-01
      value:
        steps:
          - text: Z opodatkowania stawką IP Box możesz skorzystać, jeżeli osiągasz kwalifikowany dochód z kwalifikowanych praw własności intelektualnej w ramach pozarolniczej działalności gospodarczej. To prawo, a nie obowiązek. Na ryczałcie od przychodów ewidencjonowanych ta preferencja nie przysługuje, bo według objaśnień MF jest ona w ustawie o PIT, a nie ma jej w ustawie o ryczałcie; ustawa o ryczałcie nie odsyła też do art. 30ca.
            uses: [ip_box.stawka]
            basis: art. 30ca ust. 1 ustawy o podatku dochodowym od osób fizycznych; art. 6 ust. 1 ustawy o zryczałtowanym podatku dochodowym (tekst jednolity Dz.U. 2025 poz. 843; ustawa nie odsyła do art. 30ca); objaśnienia podatkowe MF z 15 lipca 2019 r. (IP Box), przypis 11 i akapit 154
          - text: Kwalifikowanym prawem własności intelektualnej jest patent, prawo ochronne na wzór użytkowy, prawo z rejestracji wzoru przemysłowego, prawo z rejestracji topografii układu scalonego, dodatkowe prawo ochronne dla patentu na produkt leczniczy lub produkt ochrony roślin, prawo z rejestracji produktu leczniczego i produktu leczniczego weterynaryjnego dopuszczonych do obrotu, wyłączne prawo z ustawy o ochronie prawnej odmian roślin oraz autorskie prawo do programu komputerowego. Prawo musi podlegać ochronie prawnej na podstawie przepisów odrębnych ustaw lub ratyfikowanych umów międzynarodowych, których stroną jest Rzeczpospolita Polska, oraz innych umów międzynarodowych, których stroną jest Unia Europejska, a jego przedmiot ochrony musisz wytworzyć, rozwinąć lub ulepszyć w ramach prowadzonej przez siebie działalności badawczo-rozwojowej. Działalność badawczo-rozwojowa to działalność twórcza obejmująca badania naukowe lub prace rozwojowe, podejmowana w sposób systematyczny w celu zwiększenia zasobów wiedzy oraz wykorzystania zasobów wiedzy do tworzenia nowych zastosowań.
            uses: []
            basis: art. 30ca ust. 2 i art. 5a pkt 38–40 ustawy o podatku dochodowym od osób fizycznych
          - text: Zasady stosujesz odpowiednio do ekspektatywy prawa, od dnia zgłoszenia lub złożenia wniosku o udzielenie prawa ochronnego. W przypadku wycofania zgłoszenia lub wniosku, odmowy udzielenia prawa ochronnego, odrzucenia zgłoszenia lub odrzucenia wniosku o rejestrację kwalifikowane dochody uzyskane w okresie od dnia zgłoszenia lub złożenia wniosku do dnia wycofania wniosku lub zgłoszenia, odmowy udzielenia prawa ochronnego, odrzucenia zgłoszenia lub odrzucenia wniosku o rejestrację opodatkowujesz według skali albo podatkiem liniowym, a od podatku obliczonego od łącznej sumy dochodów odliczasz podatek zapłacony według stawki IP Box. Zasady stosujesz też odpowiednio do dochodów z licencji wyłącznej na kwalifikowane prawo, jeżeli wcześniej prowadziłeś prace badawczo-rozwojowe, których efektem jest to prawo.
            uses: []
            basis: art. 30ca ust. 12–14 ustawy o podatku dochodowym od osób fizycznych
          - text: Dochodem z kwalifikowanego prawa jest dochód z pozarolniczej działalności gospodarczej obliczony według art. 9 ust. 2 w zakresie, w jakim osiągnąłeś go z opłat lub należności z umowy licencyjnej dotyczącej tego prawa, ze sprzedaży tego prawa, z tego prawa uwzględnionego w cenie sprzedaży produktu lub usługi albo z odszkodowania za naruszenie praw z niego, jeżeli zostało uzyskane w postępowaniu spornym, w tym w postępowaniu sądowym albo arbitrażu. Dochód z prawa uwzględnionego w cenie produktu lub usługi ustalasz, stosując odpowiednio art. 23o i 23p. Jeżeli nie da się ustalić dochodu przypadającego na poszczególne prawa, możesz obliczyć kwalifikowany dochód według zasad z art. 30ca ust. 4–6 dla tego samego rodzaju produktu lub usługi albo dla tej samej grupy produktów lub usług, w których wykorzystano kwalifikowane prawo.
            uses: []
            basis: art. 30ca ust. 7–9 ustawy o podatku dochodowym od osób fizycznych
          - text: Kwalifikowany dochód ustalasz, mnożąc dochód z kwalifikowanego prawa osiągnięty w roku podatkowym przez wskaźnik (nexus) obliczony według wzoru z art. 30ca ust. 4; Fikus wzoru nie podaje. Wskaźnik zależy od kosztów faktycznie poniesionych przez Ciebie na prowadzoną bezpośrednio działalność badawczo-rozwojową związaną z tym prawem, na nabycie wyników prac badawczo-rozwojowych związanych z tym prawem od podmiotu niepowiązanego i od podmiotu powiązanego oraz na nabycie samego kwalifikowanego prawa. Do tych kosztów nie zaliczasz kosztów, które nie są bezpośrednio związane z prawem, w szczególności odsetek, opłat finansowych i kosztów związanych z nieruchomościami. Wskaźnik większy od 1 przyjmujesz jako 1.
            uses: []
            basis: art. 30ca ust. 4–6 ustawy o podatku dochodowym od osób fizycznych
          - text: Podstawą opodatkowania jest suma kwalifikowanych dochodów ze wszystkich kwalifikowanych praw osiągniętych w roku podatkowym. Od tej podstawy obliczasz podatek według stawki IP Box.
            uses: [ip_box.stawka]
            basis: art. 30ca ust. 1 i 3 ustawy o podatku dochodowym od osób fizycznych
          - text: Od dochodu z kwalifikowanego prawa możesz odliczyć koszty kwalifikowane z art. 26e ust. 2–3b (ulga badawczo-rozwojowa), które doprowadziły do wytworzenia, rozwinięcia lub ulepszenia przez Ciebie tego prawa; przy czym odpowiednio stosujesz art. 26e ust. 1 zdanie drugie oraz art. 26e ust. 3c–10 (między innymi limit odliczenia do wysokości dochodu, warunki z ust. 4–6, górne granice z ust. 7 i odliczenie w zeznaniu z ust. 8). Na jakim etapie ustalania kwalifikowanego dochodu to odliczenie się stosuje (przed pomnożeniem przez wskaźnik czy po nim) jest niewyjaśnione. Niewyjaśnione jest też, czy aktualne jest stanowisko objaśnień MF z 2019 r. (akapit 151), że ulgi badawczo-rozwojowej nie uwzględnia się w podstawie opodatkowanej stawką IP Box, wobec tego, że art. 26i ust. 1 mówi o podstawie ustalonej zgodnie z art. 30ca ust. 3 po uprzednim odliczeniu kwot z art. 26e, art. 26e ust. 1 nadal odsyła tylko do podstawy ustalonej zgodnie z art. 26 ust. 1 lub art. 30c ust. 2, a art. 30ca ust. 9a przewiduje odliczenie od dochodu z kwalifikowanego prawa, a nie od podstawy (otwarte pytanie do eksperta).
            uses: [zasada.ulga_br, ulga.br.odliczenie]
            basis: art. 30ca ust. 9a, art. 26e ust. 1 i art. 26i ust. 1 ustawy o podatku dochodowym od osób fizycznych; objaśnienia podatkowe MF z 15 lipca 2019 r. (IP Box), akapit 151
          - text: Stratą z kwalifikowanego prawa poniesioną w roku podatkowym obniżasz dochód z tego samego prawa, tego samego rodzaju produktu lub usługi albo tej samej grupy produktów lub usług, w których je wykorzystano, osiągnięty w najbliższych kolejno następujących po sobie 5 latach podatkowych.
            uses: []
            basis: art. 30ca ust. 10 ustawy o podatku dochodowym od osób fizycznych
          - text: Jeżeli prowadzisz podatkową księgę przychodów i rozchodów, w odrębnej ewidencji wyodrębniasz każde kwalifikowane prawo, przychody, koszty i dochód (stratę) przypadające na każde prawo oraz koszty, od których zależy wskaźnik, przypadające na każde prawo. Jeżeli wykorzystujesz więcej niż jedno kwalifikowane prawo, a przypisanie przychodów, kosztów i dochodu oraz tych kosztów do każdego prawa nie jest możliwe, prowadzisz zapisy pozwalające ustalić łączny dochód z kwalifikowanych praw. Jeżeli wykorzystujesz jedno lub więcej kwalifikowanych praw w produkcie lub usłudze albo w produktach lub usługach, a nie jest możliwe ani jedno, ani drugie, prowadzisz zapisy pozwalające ustalić dochód z kwalifikowanych praw w odniesieniu do tego produktu lub usługi albo tych produktów lub usług. Przy księgach rachunkowych te same informacje wyodrębniasz w księgach. Jeżeli z ksiąg lub ewidencji nie da się ustalić dochodu (straty) z kwalifikowanych praw, płacisz podatek według skali albo podatkiem liniowym.
            uses: []
            basis: art. 30cb ust. 1–3 ustawy o podatku dochodowym od osób fizycznych
          - text: Dochód (stratę) z kwalifikowanego prawa wykazujesz w zeznaniu za rok podatkowy, w którym go osiągnąłeś (poniosłeś). Ze stawki IP Box korzystasz dopiero w zeznaniu; zaliczki w trakcie roku płacisz na zasadach ogólnych według swojej formy opodatkowania.
            uses: [zasada.skala_podatek, zasada.liniowy_podatek]
            basis: art. 30ca ust. 11 ustawy o podatku dochodowym od osób fizycznych; objaśnienia podatkowe MF z 15 lipca 2019 r. (IP Box), akapity 200 i 201
          - text: Ta zasada nie opisuje zmniejszenia podstawy ustalonej według art. 30ca ust. 3 o wartość nieuregulowanych wierzytelności ani jej zwiększenia o wartość nieuregulowanych zobowiązań na zasadach art. 26i ust. 1 pkt 1 i 2 (ulga na złe długi), przepisu przejściowego z art. 52u, opodatkowania w spółkach niebędących osobami prawnymi ani składki zdrowotnej od dochodów opodatkowanych stawką IP Box.
            uses: []
            basis: art. 26i ust. 1 pkt 1 i 2 oraz art. 52u ustawy o podatku dochodowym od osób fizycznych
      note: >-
        Tekst jednolity Dz.U. 2026 poz. 592 uwzględnia stan prawny na 1 kwietnia 2026 r.; zmiany ustawy o PIT, które weszły w życie po 1 stycznia 2026 r., a przed 1 kwietnia 2026 r. (Dz.U. 2025 poz. 1795, Dz.U. 2026 poz. 203 i 424), zmieniają
        tylko art. 21 i 52zr. Późniejsze nowelizacje (Dz.U. 2026 poz. 779, 846, 1079, 1098, 1123, 1287, 1347, 1354, 1371,
        1541, 1542 i 1556) nie zmieniają art. 5a pkt 38–40, art. 30ca ani art. 30cb; ustawa poz. 1541 od 1 stycznia 2027 r.
        skreśla w art. 26i ust. 1 odesłanie do art. 26gb, co nie zmienia żadnego kroku. Ustawa poz. 1542 (art. 4 pkt 4) od 1 stycznia 2027 r. zmienia art. 26e ust. 6
        (skreśla odesłanie do art. 21 ust. 1 pkt 63a), do którego odsyła art. 30ca ust. 9a; krok 7 wymienia ust. 6 wśród przepisów stosowanych odpowiednio, ale nie opisuje jego treści.
        Ustęp 9a dodała ustawa
        Dz.U. 2021 poz. 2105 (art. 1 pkt 55 lit. b), czyli po wydaniu objaśnień MF z 15 lipca 2019 r. Wcześniejszych wersji
        nie wprowadzono.
      sources:
        - title: Dz.U. 2026 poz. 592, tekst jednolity ustawy o podatku dochodowym od osób fizycznych (stawka)
          url: https://api.sejm.gov.pl/eli/acts/DU/2026/592/text.pdf
          article: art. 30ca ust. 1
          quote: "Podatek od osiągniętego przez podatnika w ramach pozarolniczej działalności gospodarczej kwalifikowanego dochodu z kwalifikowanych praw własności intelektualnej wynosi 5 % podstawy opodatkowania."
        - title: Dz.U. 2026 poz. 592, tekst jednolity ustawy o podatku dochodowym od osób fizycznych (kwalifikowane prawa)
          url: https://api.sejm.gov.pl/eli/acts/DU/2026/592/text.pdf
          article: art. 30ca ust. 2
          quote: "których przedmiot ochrony został wytworzony, rozwinięty lub ulepszony przez podatnika w ramach prowadzonej przez niego działalności badawczo-rozwojowej"
        - title: Dz.U. 2026 poz. 592, tekst jednolity ustawy o podatku dochodowym od osób fizycznych (program komputerowy)
          url: https://api.sejm.gov.pl/eli/acts/DU/2026/592/text.pdf
          article: art. 30ca ust. 2 pkt 8
          quote: "autorskie prawo do programu komputerowego"
        - title: Dz.U. 2026 poz. 592, tekst jednolity ustawy o podatku dochodowym od osób fizycznych (działalność badawczo-rozwojowa)
          url: https://api.sejm.gov.pl/eli/acts/DU/2026/592/text.pdf
          article: art. 5a pkt 38
          quote: "działalności badawczo-rozwojowej – oznacza to działalność twórczą obejmującą badania naukowe lub prace rozwojowe, podejmowaną w sposób systematyczny w celu zwiększenia zasobów wiedzy oraz wykorzystania zasobów wiedzy do tworzenia nowych zastosowań"
        - title: Dz.U. 2026 poz. 592, tekst jednolity ustawy o podatku dochodowym od osób fizycznych (badania naukowe)
          url: https://api.sejm.gov.pl/eli/acts/DU/2026/592/text.pdf
          article: art. 5a pkt 39
          quote: "badania aplikacyjne w rozumieniu art. 4 ust. 2 pkt 2 ustawy z dnia 20 lipca 2018 r. – Prawo o szkolnictwie wyższym i nauce"
        - title: Dz.U. 2026 poz. 592, tekst jednolity ustawy o podatku dochodowym od osób fizycznych (prace rozwojowe)
          url: https://api.sejm.gov.pl/eli/acts/DU/2026/592/text.pdf
          article: art. 5a pkt 40
          quote: "pracach rozwojowych – oznacza to prace rozwojowe w rozumieniu art. 4 ust. 3 ustawy z dnia 20 lipca 2018 r. – Prawo o szkolnictwie wyższym i nauce"
        - title: Dz.U. 2026 poz. 592, tekst jednolity ustawy o podatku dochodowym od osób fizycznych (podstawa opodatkowania)
          url: https://api.sejm.gov.pl/eli/acts/DU/2026/592/text.pdf
          article: art. 30ca ust. 3
          quote: "Podstawę opodatkowania stanowi suma kwalifikowanych dochodów z kwalifikowanych praw własności intelektualnej osiągniętych w roku podatkowym."
        - title: Dz.U. 2026 poz. 592, tekst jednolity ustawy o podatku dochodowym od osób fizycznych (wskaźnik)
          url: https://api.sejm.gov.pl/eli/acts/DU/2026/592/text.pdf
          article: art. 30ca ust. 4
          quote: "ustala się jako iloczyn dochodu z kwalifikowanego prawa własności intelektualnej osiągniętego w roku podatkowym i wskaźnika obliczonego według wzoru"
        - title: Dz.U. 2026 poz. 592, tekst jednolity ustawy o podatku dochodowym od osób fizycznych (koszty wyłączone ze wskaźnika)

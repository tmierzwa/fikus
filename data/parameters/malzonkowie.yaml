          as_of: 2026-11-26
        - title: podatki.gov.pl (MF), Wspólne rozliczenie małżonków, aktualizacja 24.06.2026 (wyłączenia)
          url: https://podatki.gov.pl/poradniki-i-informatory/wspolne-rozliczenie-malzonkow
          kind: control
          quote: "nie stosowało przepisów dotyczących 19% podatku liniowego lub ustawy o zryczałtowanym podatku dochodowym (z wyjątkiem przepisów dotyczących przychodów z najmu lub dzierżawy prowadzonych poza działalnością gospodarczą)"
          as_of: 2026-11-26
        - title: podatki.gov.pl (MF), Osoba samotnie wychowująca dziecko, aktualizacja 24.06.2026 (wyłączenia)
          url: https://podatki.gov.pl/poradniki-i-informatory/osoba-samotnie-wychowujaca-dziecko
          kind: control
          quote: "19% podatku liniowego lub przepisy ustawy o zryczałtowanym podatku dochodowym (z wyłączeniem przychodów z najmu lub dzierżawy prowadzonych poza działalnością gospodarczą)"
          as_of: 2026-11-26
      verification:
        checked_at: 2026-11-26
        agent_check: 2026-11-26
        open_issue: >-
          Przepis wyłącza łączne opodatkowanie przy stosowaniu podatku liniowego albo ryczałtu „w zakresie” przychodów,
          kosztów i odliczeń z roku podatkowego. Strona MF podaje, że nie wyklucza go rok bez przychodów, kosztów
          i odliczeń przy działalności na podatku liniowym („zerowy” PIT-36L); biznes.gov.pl pisze ogólnie, że wspólnego
          rozliczenia nie wyłącza złożenie „PIT zero”, i podaje, że wyklucza je zmiana w trakcie roku z podatku liniowego
          albo ryczałtu od przychodów ewidencjonowanych na skalę. Żadne źródło nie mówi, czy zmiana karty podatkowej na skalę
          w trakcie roku wyklucza łączne opodatkowanie. Rok bez przychodów, kosztów i odliczeń na ryczałcie od przychodów
          ewidencjonowanych albo karcie podatkowej obejmują tylko zdania ogólne: warunki na stronach MF, które powtarzają
          brzmienie przepisu, oraz zdania biznes.gov.pl o wyłączeniu, gdy przy liniowym, ryczałcie lub karcie podatkowej
          osiąga się jakiekolwiek przychody, ponosi koszty albo korzysta z odliczeń, i o „PIT zero”. Żadne z nich tego
          nie rozstrzyga. Pytanie P15 w docs/pytania-do-eksperta.md.

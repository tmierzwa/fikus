          url: https://api.sejm.gov.pl/eli/acts/DU/2026/592/text.pdf
          article: art. 6 ust. 8
          quote: "Sposób opodatkowania, o którym mowa w ust. 2 i 4d, nie ma zastosowania, w przypadku gdy chociażby jeden z małżonków, osoba samotnie wychowująca dziecko lub jej dziecko"
        - title: Dz.U. 2026 poz. 592, tekst jednolity ustawy o podatku dochodowym od osób fizycznych (ryczałt i wyjątek)
          url: https://api.sejm.gov.pl/eli/acts/DU/2026/592/text.pdf
          article: art. 6 ust. 8 pkt 1 lit. b
          quote: "ustawy o zryczałtowanym podatku dochodowym, z wyjątkiem art. 6 ust. 1a tej ustawy"
        - title: Dz.U. 2026 poz. 592, tekst jednolity ustawy o podatku dochodowym od osób fizycznych (zakres wyłączenia)
          url: https://api.sejm.gov.pl/eli/acts/DU/2026/592/text.pdf
          article: art. 6 ust. 8 pkt 1
          quote: "w zakresie osiągniętych w roku podatkowym przychodów, poniesionych kosztów uzyskania przychodów, zobowiązania lub uprawnienia do zwiększania lub pomniejszenia podstawy opodatkowania"
        - title: Dz.U. 2026 poz. 592, tekst jednolity ustawy o podatku dochodowym od osób fizycznych (podatek tonażowy)
          url: https://api.sejm.gov.pl/eli/acts/DU/2026/592/text.pdf
          article: art. 6 ust. 8 pkt 2
          quote: "podlega opodatkowaniu na zasadach wynikających z ustawy z dnia 24 sierpnia 2006 r. o podatku tonażowym"
        - title: Dz.U. 2026 poz. 592, tekst jednolity ustawy o podatku dochodowym od osób fizycznych (najem jako źródło przychodów)
          url: https://api.sejm.gov.pl/eli/acts/DU/2026/592/text.pdf
          article: art. 10 ust. 1 pkt 6
          quote: "najem, podnajem, dzierżawa, poddzierżawa oraz inne umowy o podobnym charakterze"
        - title: Dz.U. 2025 poz. 843, tekst jednolity ustawy o zryczałtowanym podatku dochodowym (ryczałt od najmu)
          url: https://api.sejm.gov.pl/eli/acts/DU/2025/843/text.pdf
          article: art. 6 ust. 1a
          quote: "z tytułów, o których mowa w art. 10 ust. 1 pkt 6 ustawy o podatku dochodowym"
        - title: Dz.U. 2026 poz. 592, tekst jednolity ustawy o podatku dochodowym od osób fizycznych (definicja ustawy o zryczałtowanym podatku dochodowym)
          url: https://api.sejm.gov.pl/eli/acts/DU/2026/592/text.pdf
          article: art. 5a pkt 15
          quote: "ustawie o zryczałtowanym podatku dochodowym – oznacza to ustawę z dnia 20 listopada 1998 r. o zryczałtowanym"
        - title: Dz.U. 2025 poz. 843, tekst jednolity ustawy o zryczałtowanym podatku dochodowym (karta podatkowa)
          url: https://api.sejm.gov.pl/eli/acts/DU/2025/843/text.pdf

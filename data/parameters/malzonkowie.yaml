          quote: "mogą opłacać zryczałtowany podatek dochodowy w formie: 1) ryczałtu od przychodów ewidencjonowanych; 2) karty podatkowej."
        - title: Dz.U. 2025 poz. 163, tekst jednolity ustawy o podatku dochodowym od osób fizycznych (to samo brzmienie, dla daty początku obowiązywania)
          url: https://api.sejm.gov.pl/eli/acts/DU/2025/163/text.pdf

          quote: "Sposób opodatkowania, o którym mowa w ust. 2 i 4d, nie ma zastosowania, w przypadku gdy chociażby jeden z małżonków, osoba samotnie wychowująca dziecko lub jej dziecko"
          as_of: 2025-01-08
        - title: biznes.gov.pl, Najważniejsze zasady opodatkowania według skali podatkowej, aktualizacja 07.01.2026 (rozliczanie z małżonkiem; tylko małżonkowie, podatek liniowy i ryczałt)
          url: https://www.biznes.gov.pl/pl/portal/00264

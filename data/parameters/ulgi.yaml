          as_of: 2026-11-26
        - title: podatki.gov.pl (MF), Ulga rehabilitacyjna PIT, aktualizacja 26.10.2026 (krok 4)
          url: https://podatki.gov.pl/ulgi-i-odliczenia/ulga-rehabilitacyjna-pit
          quote: "Ulgę odliczasz od: dochodu opodatkowanego według skali podatkowej lub przychodu opodatkowanego ryczałtem od przychodów ewidencjonowanych"
          as_of: 2026-11-26
        - title: podatki.gov.pl (MF), Ulga termomodernizacyjna PIT, aktualizacja 12.10.2026 (krok 6)
          url: https://podatki.gov.pl/ulgi-i-odliczenia/ulga-termomodernizacyjna-pit
          quote: "od przychodu podlegającego opodatkowaniu ryczałtem od przychodów ewidencjonowanych"
          as_of: 2026-11-26
        - title: podatki.gov.pl (MF), Ulga na dziecko PIT, aktualizacja 13.10.2026 (krok 8)
          url: https://podatki.gov.pl/ulgi-i-odliczenia/ulga-na-dziecko-pit
          quote: "Nie możesz skorzystać z ulgi, jeżeli uzyskujesz wyłącznie dochody (przychody) opodatkowane: podatkiem liniowym z tytułu prowadzonej działalności gospodarczej lub działów specjalnych produkcji rolnej, ryczałtem ewidencjonowanym"
          as_of: 2026-11-26
        - title: podatki.gov.pl (MF), Ulga na IKZE PIT, aktualizacja 23.10.2026 (krok 2)

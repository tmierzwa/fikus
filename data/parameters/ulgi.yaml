          quote: "Od podatku dochodowego obliczonego zgodnie z art. 27 podatnik ma prawo odliczyć kwotę obliczoną zgodnie z ust. 2"
        - title: podatki.gov.pl (MF), Ulga na Internet PIT, aktualizacja 9.10.2026 (krok 3)
          url: https://podatki.gov.pl/ulgi-i-odliczenia/ulga-na-internet-pit

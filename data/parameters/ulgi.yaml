        open_issue: >-
          Krok o darowiznach: art. 26 ust. 5 ustawy o PIT, stosowany na ryczałcie odpowiednio (art. 11 ust. 2 ustawy
          o ryczałcie), określa limit jako 6% dochodu. Nie wiadomo, czy na ryczałcie liczy się go od przychodu przed
          odliczeniami z art. 11 ust. 1 i 1a, czy po nich, ani czy przy przychodach opodatkowanych różnymi stawkami liczy
          się go od łącznego przychodu. Pytanie do eksperta: docs/pytania-do-eksperta.md, P13.
    - valid_from: 2027-01-01
      value:
        steps:
          - text: Od przychodów opodatkowanych ryczałtem możesz odliczyć stratę z art. 9 ust. 3–3b ustawy o podatku dochodowym od osób fizycznych oraz wydatki z art. 26 ust. 1 pkt 2, 2a, 2b, 2c, 5, 6 i 9, art. 26h ust. 1 i art. 26hb ust. 1 tej ustawy, jeżeli nie zostały odliczone od dochodu ani zaliczone do kosztów uzyskania przychodów. Odliczenie składek społecznych (pkt 2 i 2a) i połowy składki zdrowotnej opisuje zasada podstawy opodatkowania ryczałtem.
            uses: [zasada.ryczalt_podstawa]
            basis: art. 11 ust. 1 i 1a ustawy o zryczałtowanym podatku dochodowym w brzmieniu od 1 stycznia 2027 r.
          - text: Wpłaty na indywidualne konto zabezpieczenia emerytalnego dokonane w roku podatkowym odliczasz do wysokości rocznego limitu wpłat z ustawy o tych kontach, w zeznaniu.
            uses: [ikze.limit_wplat]
            basis: art. 11 ust. 1 i 2 ustawy o zryczałtowanym podatku dochodowym w brzmieniu od 1 stycznia 2027 r.; art. 26 ust. 1 pkt 2b i ust. 6g ustawy o podatku dochodowym od osób fizycznych; art. 13a ustawy o indywidualnych kontach emerytalnych oraz indywidualnych kontach zabezpieczenia emerytalnego
          - text: Odliczenie wydatków na Internet nie przysługuje od przychodów uzyskanych od 1 stycznia 2027 r. Przepis przejściowy (art. 5 ust. 1) zachowuje to odliczenie w zeznaniu za 2027 r. na dotychczasowych zasadach podatnikowi, który po raz pierwszy skorzystał z niego w zeznaniu za 2026 r. Do podatników, którzy odliczali je na ryczałcie, stosuje się go odpowiednio (art. 5 ust. 2). Jak dokładnie działa przy odliczeniu od przychodu, czy w zeznaniu za 2027 r. obowiązuje dotychczasowy roczny limit i czy prawo zachowuje podatnik, który zmienił formę opodatkowania między 2026 a 2027 r., jest niewyjaśnione (otwarte pytanie do eksperta, P14).
            uses: [ulga.internet.limit]
            basis: art. 3 pkt 1, art. 4 ust. 1 i art. 5 ust. 1 i 2 ustawy z 22 października 2026 r. (Dz.U. 2026 poz. 1541)
          - text: Wydatki na cele rehabilitacyjne i na ułatwienie wykonywania czynności życiowych odliczasz według katalogu z art. 26 ust. 7a ustawy o PIT; część pozycji ma roczny limit, a wydatki na leki odliczasz w części przekraczającej kwotę miesięczną. Warunki (orzeczenie, brak finansowania z funduszy, osoby na utrzymaniu) są w art. 26 ust. 7b–7g.
            uses: [ulga.rehabilitacyjna.limity]
            basis: art. 11 ust. 1 i 2 ustawy o zryczałtowanym podatku dochodowym w brzmieniu od 1 stycznia 2027 r.; art. 26 ust. 1 pkt 6 i ust. 7a–7g ustawy o podatku dochodowym od osób fizycznych
          - text: Darowizny na cele z art. 26 ust. 1 pkt 9 ustawy o PIT odliczasz łącznie do limitu procentowego. Nie odliczysz darowizn na rzecz osób fizycznych ani podmiotów wymienionych w art. 26 ust. 5 pkt 2, ani darowizn zaliczonych do kosztów. Wysokość darowizny ustalasz na podstawie dokumentów z art. 26 ust. 7. Od 1 stycznia 2027 r. darowiznę na krwiodawstwo liczy się według podwojonej kwoty rekompensaty (art. 26 ust. 1 pkt 9 lit. c w nowym brzmieniu). Od jakiej kwoty przychodu liczy się limit (przed odliczeniami z art. 11 ust. 1 i 1a ustawy o ryczałcie czy po nich, a przy przychodach opodatkowanych różnymi stawkami łącznie czy osobno), jest niewyjaśnione (otwarte pytanie do eksperta, P13).
            uses: [ulga.darowizny.limit_ryczalt]
            basis: art. 11 ust. 1 i 2 ustawy o zryczałtowanym podatku dochodowym w brzmieniu od 1 stycznia 2027 r.; art. 26 ust. 1 pkt 9, ust. 5, 6, 6f i 7 ustawy o podatku dochodowym od osób fizycznych
          - text: Wydatki na przedsięwzięcie termomodernizacyjne w budynku mieszkalnym jednorodzinnym, którego jesteś właścicielem lub współwłaścicielem, odliczasz do limitu na wszystkie przedsięwzięcia, na warunkach art. 26h ust. 2–9 ustawy o PIT. Ta zasada nie opisuje odliczenia wydatków na zabytki (art. 26hb ust. 1) ani wydatków na terminal płatniczy (art. 11 ust. 3a ustawy o ryczałcie w zw. z art. 26hd ustawy o PIT).
            uses: [ulga.termomodernizacja.limit]
            basis: art. 11 ust. 1, 2 i 3a ustawy o zryczałtowanym podatku dochodowym; art. 26h ust. 1 i 2 ustawy o podatku dochodowym od osób fizycznych
          - text: Przy przychodach opodatkowanych różnymi stawkami odliczenia dzielisz w takim stosunku, w jakim pozostają poszczególne przychody w ogólnej kwocie przychodów.
            uses: [zasada.ryczalt_podstawa]
            basis: art. 11 ust. 3 ustawy o zryczałtowanym podatku dochodowym
          - text: Ulgi na dzieci nie odliczasz od ryczałtu. Art. 27f ustawy o PIT pozwala odliczyć ją od podatku obliczonego według skali podatkowej (art. 27), a art. 11 ustawy o ryczałcie jej nie wymienia. Jeżeli oprócz przychodów z ryczałtu masz dochody opodatkowane według skali, ulgę wykazujesz w zeznaniu, w którym rozliczasz te dochody.
            uses: [ulga.dzieci.kwoty]
            basis: art. 27f ust. 1 ustawy o podatku dochodowym od osób fizycznych; art. 11 ustawy o zryczałtowanym podatku dochodowym
      note: >-
        Od 1 stycznia 2027 r. art. 11 ust. 1 i 2 ustawy o ryczałcie mają brzmienie nadane art. 3 ustawy Dz.U. 2026
        poz. 1541 (wejście w życie według art. 8, stosowanie do przychodów od 1 stycznia 2027 r. według art. 4 ust. 1),
        a w ustawie o PIT uchylono art. 26 ust. 1 pkt 6a i ust. 6h. Tekstu jednolitego z tą zmianą jeszcze nie ma:
        brzmienie wynika z tekstu jednolitego Dz.U. 2025 poz. 843 i ustawy zmieniającej. Nowe brzmienie art. 11 ust. 2 nie
        obejmuje art. 26 ust. 6a (uchylonego już wcześniej) i ust. 6h; art. 26 ust. 5 nadal stosuje się odpowiednio.
        Korekty z 26 i 27 listopada 2026 r.: zmienione kroki o Internecie (P14) i o darowiznach (P13).

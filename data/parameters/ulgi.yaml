          ten można pomniejszyć o pozycje z pkt 1–4, wśród których tych darowizn nie ma, a art. 30c ust. 3a stosuje odpowiednio art. 26 ust. 6b). Pytanie do eksperta:
          docs/pytania-do-eksperta.md, P67.
    - valid_from: 2027-01-01
      value:
        steps:
          - text: Dochód z działalności opodatkowanej podatkiem liniowym możesz pomniejszyć tylko o pozycje wymienione w art. 30c ust. 2 ustawy o PIT.
            uses: [zasada.liniowy_podatek]
            basis: art. 30c ust. 2 ustawy o podatku dochodowym od osób fizycznych
          - text: Wpłaty na indywidualne konto zabezpieczenia emerytalnego odliczasz do wysokości rocznego limitu wpłat z ustawy o tych kontach, wyłącznie w zeznaniu, jeżeli nie zostały zaliczone do kosztów, odliczone od dochodów opodatkowanych według skali ani od przychodów na ryczałcie i nie zostały zwrócone.
            uses: [ikze.limit_wplat]
            basis: art. 30c ust. 2 pkt 3, ust. 3 i 3b ustawy o podatku dochodowym od osób fizycznych; art. 13a ustawy o indywidualnych kontach emerytalnych oraz indywidualnych kontach zabezpieczenia emerytalnego
          - text: Spośród darowizn z art. 26 ust. 1 pkt 9 odliczasz tylko darowiznę na cele kształcenia zawodowego z art. 26 ust. 1 pkt 9 lit. d (materiały dydaktyczne lub środki trwałe dla publicznych szkół, placówek i centrów kształcenia zawodowego, na warunkach art. 26 ust. 6ea i 6eb), w wysokości darowizny, nie więcej niż limit procentowy dochodu. Pozostałych odliczeń z art. 26 ust. 1, na przykład wydatków na cele rehabilitacyjne, art. 30c ust. 2 nie wymienia. Czy przy podatku liniowym przysługuje wyłączenie z podstawy opodatkowania darowizn na kościelną działalność charytatywno-opiekuńczą z ustaw o stosunku Państwa do kościołów, jest niewyjaśnione (otwarte pytanie do eksperta, P67); art. 30c ust. 2 stanowi, że dochód ten podatnicy mogą pomniejszyć o pozycje z pkt 1–4, wśród których tych darowizn nie ma, a art. 30c ust. 3a stosuje odpowiednio art. 26 ust. 6b, który wspomina odliczenie darowizn wynikające z odrębnych ustaw.
            uses: [ulga.darowizny.limit]
            basis: art. 30c ust. 2 pkt 4, ust. 3 i 3a ustawy o podatku dochodowym od osób fizycznych; art. 26 ust. 1 pkt 9 lit. d, ust. 6b, 6ea i 6eb tej ustawy; art. 55 ust. 7 ustawy o stosunku Państwa do Kościoła Katolickiego i odpowiednie przepisy innych ustaw o stosunku Państwa do kościołów
          - text: Od podstawy obliczenia podatku ustalonej według art. 30c ust. 2 możesz odliczyć wydatki na przedsięwzięcie termomodernizacyjne w budynku mieszkalnym jednorodzinnym, którego jesteś właścicielem lub współwłaścicielem, do limitu na wszystkie przedsięwzięcia. Do tej podstawy odnoszą się też odliczenia z art. 26e, 26ga, 26ha, 26hb, 26hc, 26hd i 26he ustawy o PIT, art. 52jb (ulga na robotyzację, 50% kosztów poniesionych na robotyzację, nie więcej niż dochód z działalności, dla kosztów poniesionych w latach 2022–2036; od 1 stycznia 2027 r. przy środkach trwałych i wartościach niematerialnych i prawnych podlegających amortyzacji za koszty poniesione na robotyzację uznaje się dokonywane w danym roku podatkowym i zaliczane do kosztów odpisy amortyzacyjne od nich (ust. 2a), a wyłączenie z ust. 5a uchylono, z tym że do kosztów poniesionych przed tym dniem nadal się je stosuje; jak ust. 2a stosuje się do odpisów od aktywów nabytych przed 2027 r., jest niewyjaśnione (otwarte pytanie do eksperta)) oraz art. 52n (darowizny na przeciwdziałanie COVID-19) i art. 52x (darowizny rzeczowe laptopów i tabletów dla organów prowadzących placówki oświatowe albo dla organizacji, o których mowa w art. 3 ust. 2 i 3 ustawy o działalności pożytku publicznego, prowadzących działalność pożytku publicznego w sferze zadań publicznych, lub operatora OSE, z przeznaczeniem na dalsze nieodpłatne przekazanie), w obu przypadkach przekazane od 1 stycznia 2020 r. do końca miesiąca odwołania stanu epidemii. Podstawę po odliczeniach z art. 26e, 26ga, 26h–26he i 52jb można zmniejszyć o wartość nieuregulowanych wierzytelności, a trzeba zwiększyć o wartość nieuregulowanych zobowiązań, na zasadach art. 26i (ulga na złe długi; od 1 stycznia 2027 r. bez odesłania do uchylonego art. 26gb). Art. 26gb (ulga na ekspansję) uchylono od 1 stycznia 2027 r.; według art. 6 ust. 1 ustawy Dz.U. 2026 poz. 1541 do kosztów poniesionych przed tym dniem stosuje się przepisy dotychczasowe, więc odliczenia z art. 26gb za takie koszty mogą trwać po 2026 r. (w tym odliczenie nieodliczonej części w zeznaniach za kolejne sześć lat z art. 26gb ust. 9 i doliczenie z ust. 6). W jakiej kolejności stosuje się je wobec art. 26i, który od 1 stycznia 2027 r. nie odsyła do art. 26gb, jest niewyjaśnione (otwarte pytanie do eksperta).
            uses: [ulga.termomodernizacja.limit]
            basis: art. 26h ust. 1 i 2, art. 26i ust. 1, art. 52jb, art. 52n ust. 1 i art. 52x ust. 1 ustawy o podatku dochodowym od osób fizycznych; art. 1 pkt 2, 3 i 4, art. 4 ust. 1, art. 6 ust. 1, art. 7 ust. 1 i art. 8 ustawy z 22 października 2026 r. (Dz.U. 2026 poz. 1541)
          - text: Ulgi na dzieci nie odliczasz od podatku liniowego, bo art. 27f ustawy o PIT dotyczy podatku obliczonego według skali (art. 27). Dochody opodatkowane podatkiem liniowym wlicza się jednak do dochodów, od których zależy prawo do ulgi na jedno dziecko. Jeżeli masz też dochody opodatkowane według skali, ulgę wykazujesz w zeznaniu, w którym rozliczasz te dochody.
            uses: [ulga.dzieci.kwoty, ulga.dzieci.limit_dochodow]
            basis: art. 27f ust. 1, 2 pkt 1 i ust. 2a ustawy o podatku dochodowym od osób fizycznych
      note: >-
        Od 1 stycznia 2027 r. ustawa Dz.U. 2026 poz. 1541 uchyla art. 26gb ustawy o PIT (wejście w życie według art. 8,
        stosowanie do dochodów od 1 stycznia 2027 r. według art. 4 ust. 1, przepis przejściowy w art. 6 ust. 1).
        Tekstu jednolitego z tą zmianą jeszcze nie ma: brzmienie wynika z tekstu jednolitego Dz.U. 2026 poz. 592
        i ustawy zmieniającej. Ustawa Dz.U. 2026 poz. 1542 od tego dnia zmienia art. 26e ust. 6 i art. 26ga ust. 10
        (warunki przy zwolnieniu z art. 21 ust. 1 pkt 63b); ta zasada tych odliczeń nie opisuje.
        W art. 52jb ta sama ustawa od 1 stycznia 2027 r. dodaje ust. 2a (odpisy amortyzacyjne jako koszty poniesione
        na robotyzację), uchyla ust. 5a (do kosztów poniesionych przed tym dniem stosuje się go nadal, art. 7 ust. 1)
        i przedłuża okres w ust. 5 do lat 2022–2036 (art. 1 pkt 4 lit. b wchodzi w życie 31 grudnia 2026 r., ale według
        art. 4 ust. 1 dotyczy dochodów od 1 stycznia 2027 r.), a w art. 26i ust. 1 skreśla odesłanie do art. 26gb.
        Korekta z 27 listopada 2026 r.: zmienione kroki 1, 3 i 4.
      not_covered: >-
        Odliczenia składek na ubezpieczenia społeczne i zdrowotne (opisuje je zasada podatku liniowego).
        Warunków i sposobu odliczeń od podstawy obliczenia podatku z art. 26e, 26ga, 26ha–26he, 52jb, 52n i 52x
        ustawy o podatku dochodowym od osób fizycznych oraz ulgi na złe długi (art. 26i) poza tym, co podaje krok
        o podstawie obliczenia podatku.
        Ulgi odsetkowej z art. 9 ustawy z 16 listopada 2006 r. o zmianie ustawy o podatku dochodowym od osób fizycznych
        oraz o zmianie niektórych innych ustaw (Dz.U. 2006 nr 217 poz. 1588) ani odliczeń z odrębnych ustaw innych niż ustawy o stosunku Państwa do
        kościołów, o które pyta krok o darowiznach.
      see_also: [zasada.liniowy_podatek]
      sources:

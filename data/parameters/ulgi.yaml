        Kwoty za każdy miesiąc z art. 27f ust. 2; przy jednym dziecku ulga zależy od limitu dochodów
        (ulga.dzieci.limit_dochodow). Ulgę odlicza się od podatku obliczonego według skali (art. 27), więc dotyczy

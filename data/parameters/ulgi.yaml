        open_issue: >-
          Krok o Internecie: art. 5 ust. 2 ustawy Dz.U. 2026 poz. 1541 stosuje przepis przejściowy do ryczałtu tylko
          odpowiednio; nie wiadomo, jak art. 5 ust. 1 stosuje się przy odliczeniu od przychodu na ryczałcie. Przepis nie
          rozstrzyga też, czy prawo do odliczenia w zeznaniu za 2027 r. zachowuje podatnik, który zmienił formę
          opodatkowania między 2026 a 2027 r. (z ryczałtu na skalę albo odwrotnie). Kwota limitu na 2027 r. wynika
          tylko z przepisu przejściowego. Pytanie do eksperta: docs/pytania-do-eksperta.md, P14.
          Krok o darowiznach: art. 26 ust. 5 ustawy o PIT, stosowany na ryczałcie odpowiednio (art. 11 ust. 2 ustawy
          o ryczałcie), określa limit jako 6% dochodu. Nie wiadomo, czy na ryczałcie liczy się go od przychodu przed
          odliczeniami z art. 11 ust. 1 i 1a, czy po nich, ani czy przy przychodach opodatkowanych różnymi stawkami liczy
          się go od łącznego przychodu. Pytanie do eksperta: docs/pytania-do-eksperta.md, P13.

- id: zasada.ulgi_liniowy
  name: Ulgi i odliczenia przy podatku liniowym
  kind: rule
  applies_to: {tax_form: [liniowy]}
  versions:
    - valid_from: 2026-01-01
      valid_to: 2026-12-31
      value:
        steps:
          - text: Dochód z działalności opodatkowanej podatkiem liniowym możesz pomniejszyć tylko o pozycje wymienione w art. 30c ust. 2 ustawy o PIT.
            uses: [zasada.liniowy_podatek]
            basis: art. 30c ust. 2 ustawy o podatku dochodowym od osób fizycznych
          - text: Wpłaty na indywidualne konto zabezpieczenia emerytalnego odliczasz do wysokości rocznego limitu wpłat z ustawy o tych kontach, wyłącznie w zeznaniu, jeżeli nie zostały zaliczone do kosztów, odliczone od dochodów opodatkowanych według skali ani od przychodów na ryczałcie i nie zostały zwrócone.
            uses: [ikze.limit_wplat]
            basis: art. 30c ust. 2 pkt 3, ust. 3 i 3b ustawy o podatku dochodowym od osób fizycznych; art. 13a ustawy o indywidualnych kontach emerytalnych oraz indywidualnych kontach zabezpieczenia emerytalnego
          - text: Spośród darowizn z art. 26 ust. 1 pkt 9 odliczasz tylko darowiznę na cele kształcenia zawodowego z art. 26 ust. 1 pkt 9 lit. d (materiały dydaktyczne lub środki trwałe dla publicznych szkół, placówek i centrów kształcenia zawodowego, na warunkach art. 26 ust. 6ea i 6eb), w wysokości darowizny, nie więcej niż limit procentowy dochodu. Pozostałych odliczeń z art. 26 ust. 1, na przykład wydatków na Internet i na cele rehabilitacyjne, art. 30c ust. 2 nie wymienia. Czy przy podatku liniowym przysługuje wyłączenie z podstawy opodatkowania darowizn na kościelną działalność charytatywno-opiekuńczą z ustaw o stosunku Państwa do kościołów, jest niewyjaśnione (otwarte pytanie do eksperta, P67); art. 30c ust. 2 stanowi, że dochód ten podatnicy mogą pomniejszyć o pozycje z pkt 1–4, wśród których tych darowizn nie ma, a art. 30c ust. 3a stosuje odpowiednio art. 26 ust. 6b, który wspomina odliczenie darowizn wynikające z odrębnych ustaw.
            uses: [ulga.darowizny.limit]
            basis: art. 30c ust. 2 pkt 4, ust. 3 i 3a ustawy o podatku dochodowym od osób fizycznych; art. 26 ust. 1 pkt 9 lit. d, ust. 6b, 6ea i 6eb tej ustawy; art. 55 ust. 7 ustawy o stosunku Państwa do Kościoła Katolickiego i odpowiednie przepisy innych ustaw o stosunku Państwa do kościołów
          - text: Od podstawy obliczenia podatku ustalonej według art. 30c ust. 2 możesz odliczyć wydatki na przedsięwzięcie termomodernizacyjne w budynku mieszkalnym jednorodzinnym, którego jesteś właścicielem lub współwłaścicielem, do limitu na wszystkie przedsięwzięcia. Do tej podstawy odnoszą się też odliczenia z art. 26e, 26ga, 26gb, 26ha, 26hb, 26hc, 26hd i 26he ustawy o PIT, art. 52jb (ulga na robotyzację, 50% kosztów poniesionych na robotyzację, nie więcej niż dochód z działalności, dla kosztów poniesionych w latach 2022–2026; przedłużenie do lat 2022–2036 z ustawy Dz.U. 2026 poz. 1541 stosuje się do dochodów uzyskanych od 1 stycznia 2027 r.) oraz art. 52n (darowizny na przeciwdziałanie COVID-19) i art. 52x (darowizny rzeczowe laptopów i tabletów dla organów prowadzących placówki oświatowe albo dla organizacji, o których mowa w art. 3 ust. 2 i 3 ustawy o działalności pożytku publicznego, prowadzących działalność pożytku publicznego w sferze zadań publicznych, lub operatora OSE, z przeznaczeniem na dalsze nieodpłatne przekazanie), w obu przypadkach przekazane od 1 stycznia 2020 r. do końca miesiąca odwołania stanu epidemii. Podstawę po odliczeniach z art. 26e, 26ga, 26gb, 26h–26he i 52jb można zmniejszyć o wartość nieuregulowanych wierzytelności, a trzeba zwiększyć o wartość nieuregulowanych zobowiązań, na zasadach art. 26i (ulga na złe długi).
            uses: [ulga.termomodernizacja.limit]
            basis: art. 26h ust. 1 i 2, art. 26i ust. 1, art. 52jb ust. 1 i 5, art. 52n ust. 1 i art. 52x ust. 1 ustawy o podatku dochodowym od osób fizycznych; art. 1 pkt 4 lit. b i art. 4 ust. 1 ustawy z 22 października 2026 r. (Dz.U. 2026 poz. 1541)
          - text: Ulgi na dzieci nie odliczasz od podatku liniowego, bo art. 27f ustawy o PIT dotyczy podatku obliczonego według skali (art. 27). Dochody opodatkowane podatkiem liniowym wlicza się jednak do dochodów, od których zależy prawo do ulgi na jedno dziecko. Jeżeli masz też dochody opodatkowane według skali, ulgę wykazujesz w zeznaniu, w którym rozliczasz te dochody.
            uses: [ulga.dzieci.kwoty, ulga.dzieci.limit_dochodow]
            basis: art. 27f ust. 1, 2 pkt 1 i ust. 2a ustawy o podatku dochodowym od osób fizycznych
      note: >-
        Tekst jednolity Dz.U. 2026 poz. 592 uwzględnia stan prawny na 1 kwietnia 2026 r.; zmiany ustawy o PIT, które
        weszły w życie między 1 stycznia a 1 kwietnia 2026 r. (Dz.U. 2025 poz. 1795, Dz.U. 2026 poz. 203 i 424), zmieniają
        tylko art. 21 i 52zr, a zmiana z Dz.U. 2025 poz. 1301 (tylko art. 52zo–52zr) weszła w życie w 2025 r., więc to brzmienie obowiązywało od 1 stycznia 2026 r. Późniejsze nowelizacje do
        31 grudnia 2026 r. (poz. 779, 846, 1079, 1098, 1123, 1287, 1347, 1354, 1371, 1556) art. 26, 26h, 27f i 30c nie zmieniają;
        ustawa Dz.U. 2026 poz. 1542 od 1 stycznia 2027 r. zmienia art. 21, 23b i 23z, a z przepisów o odliczeniach
        tylko warunki art. 26e ust. 6 i art. 26ga ust. 10 przy zwolnieniu z art. 21 ust. 1 pkt 63b. Wcześniejszych wersji nie wprowadzono.
        Korekta z 27 listopada 2026 r.: zmienione kroki 1, 3 i 4.
      not_covered: >-
        Odliczenia składek na ubezpieczenia społeczne i zdrowotne (opisuje je zasada podatku liniowego).
        Warunków i sposobu odliczeń od podstawy obliczenia podatku z art. 26e, 26ga, 26gb, 26ha–26he, 52jb, 52n i 52x
        ustawy o podatku dochodowym od osób fizycznych oraz ulgi na złe długi (art. 26i) poza tym, co podaje krok
        o podstawie obliczenia podatku.
        Ulgi odsetkowej z art. 9 ustawy z 16 listopada 2006 r. o zmianie ustawy o podatku dochodowym od osób fizycznych
        oraz o zmianie niektórych innych ustaw (Dz.U. 2006 nr 217 poz. 1588) ani odliczeń z odrębnych ustaw innych niż ustawy o stosunku Państwa do
        kościołów, o które pyta krok o darowiznach.
      see_also: [zasada.liniowy_podatek]
      sources:

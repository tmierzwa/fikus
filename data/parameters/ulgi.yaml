        open_issue: >-
          Krok o odliczeniach od podstawy: art. 52jb ust. 2a (od 1 stycznia 2027 r.) uznaje za koszty poniesione
          na robotyzację odpisy amortyzacyjne dokonywane w danym roku. Nie wiadomo, czy dotyczy to także odpisów od
          środków trwałych i wartości niematerialnych i prawnych nabytych przed 2027 r., i jak to się ma do art. 7 ust. 1
          ustawy Dz.U. 2026 poz. 1541. Nie wiadomo też, w jakiej kolejności po 2026 r. stosuje się odliczenia i doliczenia
          z art. 26gb (ust. 9 i 6) za koszty sprzed 2027 r. (art. 6 ust. 1 tej ustawy) wobec art. 26i, który od 1 stycznia 2027 r. nie odsyła do
          art. 26gb. Pytanie do eksperta: docs/pytania-do-eksperta.md, P20.
          Krok o darowiznach: czy przy podatku liniowym przysługuje wyłączenie z podstawy opodatkowania darowizn na kościelną
          działalność charytatywno-opiekuńczą z ustaw o stosunku Państwa do kościołów (art. 30c ust. 2 ustawy o PIT stanowi, że dochód
          ten można pomniejszyć o pozycje z pkt 1–4, wśród których tych darowizn nie ma, a art. 30c ust. 3a stosuje odpowiednio art. 26 ust. 6b). Pytanie do eksperta:
          docs/pytania-do-eksperta.md, P67.

- id: zasada.ulgi_skala
  name: Ulgi i odliczenia przy opodatkowaniu według skali podatkowej
  kind: rule
  applies_to: {tax_form: [skala]}
  versions:
    - valid_from: 2026-01-01
      valid_to: 2026-12-31
      value:
        steps:
          - text: Od dochodu (art. 26 ust. 1 ustawy o PIT) odliczasz wydatki na cele z art. 26 ust. 1, jeżeli nie zostały zaliczone do kosztów, odliczone od dochodów opodatkowanych podatkiem liniowym ani od przychodów na ryczałcie i nie zostały zwrócone.
            uses: []
            basis: art. 26 ust. 1 i 13a ustawy o podatku dochodowym od osób fizycznych
          - text: Wpłaty na indywidualne konto zabezpieczenia emerytalnego odliczasz do wysokości rocznego limitu wpłat z ustawy o tych kontach, a składki członkowskie na związki zawodowe do kwoty rocznej z art. 26 ust. 1 pkt 2c; oba odliczenia tylko w zeznaniu.
            uses: [ikze.limit_wplat]
            basis: art. 26 ust. 1 pkt 2b i 2c oraz ust. 6g ustawy o podatku dochodowym od osób fizycznych; art. 13a ustawy o indywidualnych kontach emerytalnych oraz indywidualnych kontach zabezpieczenia emerytalnego
          - text: Wydatki na użytkowanie sieci Internet odliczasz do rocznego limitu, wyłącznie w dwóch kolejnych latach podatkowych i tylko wtedy, gdy w okresie poprzedzającym te lata nie korzystałeś z tego odliczenia.
            uses: [ulga.internet.limit]
            basis: art. 26 ust. 1 pkt 6a i ust. 6h ustawy o podatku dochodowym od osób fizycznych
          - text: Wydatki na cele rehabilitacyjne i na ułatwienie wykonywania czynności życiowych odliczasz według katalogu z art. 26 ust. 7a; część pozycji ma roczny limit, a wydatki na leki odliczasz w części przekraczającej kwotę miesięczną. Warunki są w art. 26 ust. 7b–7g.
            uses: [ulga.rehabilitacyjna.limity]
            basis: art. 26 ust. 1 pkt 6 i ust. 7a–7g ustawy o podatku dochodowym od osób fizycznych
          - text: Darowizny na cele z art. 26 ust. 1 pkt 9 odliczasz łącznie do limitu procentowego dochodu. Nie odliczysz darowizn na rzecz osób fizycznych ani podmiotów wymienionych w art. 26 ust. 5 pkt 2, ani darowizn zaliczonych do kosztów. Darowiznę na kształcenie zawodowe (pkt 9 lit. d) odlicza tylko podatnik z przychodami z działalności gospodarczej. Darowizny na kościelną działalność charytatywno-opiekuńczą odrębne ustawy o stosunku Państwa do kościołów (wymienione w podstawie prawnej) wyłączają z podstawy opodatkowania podatkiem dochodowym, jeżeli kościelna osoba prawna przedstawi darczyńcy pokwitowanie odbioru oraz, w okresie dwóch lat od dnia przekazania darowizny, sprawozdanie o przeznaczeniu jej na tę działalność; w większości tych ustaw wyłączenie dotyczy darowizn pochodzących od osób fizycznych. Darowiznę, kwotę odliczenia i dane obdarowanego wykazujesz w zeznaniu (art. 26 ust. 6b). Darowiznę dokumentujesz tak, jak wymaga art. 26 ust. 7 (art. 26 ust. 6d).
            uses: [ulga.darowizny.limit]
            basis: art. 26 ust. 1 pkt 9, ust. 5, 6, 6b, 6d, 6eb, 6f i 7 ustawy o podatku dochodowym od osób fizycznych; art. 55 ust. 7 ustawy o stosunku Państwa do Kościoła Katolickiego, art. 40 ust. 7 ustawy o stosunku Państwa do Polskiego Autokefalicznego Kościoła Prawosławnego oraz przepisy o darowiznach na działalność charytatywno-opiekuńczą w ustawach o stosunku Państwa do Kościołów Ewangelicko-Augsburskiego (art. 34 ust. 2), Ewangelicko-Reformowanego (art. 19 ust. 2), Ewangelicko-Metodystycznego (art. 29 ust. 5), Chrześcijan Baptystów (art. 33 ust. 5), Adwentystów Dnia Siódmego (art. 28 ust. 5), Polskokatolickiego (art. 27 ust. 5), Katolickiego Mariawitów (art. 24 ust. 5), Starokatolickiego Mariawitów (art. 26 ust. 5) i Zielonoświątkowego (art. 29 ust. 5)
          - text: Od podstawy obliczenia podatku możesz odliczyć wydatki na przedsięwzięcie termomodernizacyjne w budynku mieszkalnym jednorodzinnym, którego jesteś właścicielem lub współwłaścicielem, do limitu na wszystkie przedsięwzięcia. Do tej podstawy odnoszą się też odliczenia z art. 26e, 26ga, 26gb, 26ha, 26hb, 26hc, 26hd i 26he, art. 52jb (ulga na robotyzację, 50% kosztów poniesionych na robotyzację, nie więcej niż dochód z działalności, dla kosztów poniesionych w latach 2022–2026; przedłużenie do lat 2022–2036 z ustawy Dz.U. 2026 poz. 1541 stosuje się do dochodów uzyskanych od 1 stycznia 2027 r.) oraz art. 52n (darowizny na przeciwdziałanie COVID-19) i art. 52x (darowizny rzeczowe laptopów i tabletów dla organów prowadzących placówki oświatowe albo dla organizacji, o których mowa w art. 3 ust. 2 i 3 ustawy o działalności pożytku publicznego, prowadzących działalność pożytku publicznego w sferze zadań publicznych, lub operatora OSE, z przeznaczeniem na dalsze nieodpłatne przekazanie), w obu przypadkach przekazane od 1 stycznia 2020 r. do końca miesiąca odwołania stanu epidemii. Podstawę po odliczeniach z art. 26e, 26ga, 26gb, 26h–26he i 52jb można zmniejszyć o wartość nieuregulowanych wierzytelności, a trzeba zwiększyć o wartość nieuregulowanych zobowiązań, na zasadach art. 26i (ulga na złe długi).
            uses: [ulga.termomodernizacja.limit]
            basis: art. 26h ust. 1 i 2, art. 26i ust. 1, art. 52jb ust. 1 i 5, art. 52n ust. 1 i art. 52x ust. 1 ustawy o podatku dochodowym od osób fizycznych; art. 1 pkt 4 lit. b i art. 4 ust. 1 ustawy z 22 października 2026 r. (Dz.U. 2026 poz. 1541)
          - text: Od podatku obliczonego według skali odliczasz ulgę na dzieci, za każdy miesiąc wykonywania władzy rodzicielskiej, pełnienia funkcji opiekuna prawnego albo rodziny zastępczej, w kwotach zależnych od liczby dzieci. Przy jednym dziecku ulga przysługuje tylko wtedy, gdy dochody nie przekroczyły limitu (z wyjątkiem dziecka z orzeczeniem albo decyzją z art. 26 ust. 7d); przy dwojgu i więcej dzieciach limitu dochodów nie ma. Na pełnoletnie dzieci ulga przysługuje na warunkach art. 27f ust. 6.
            uses: [ulga.dzieci.kwoty, ulga.dzieci.limit_dochodow]
            basis: art. 27f ust. 1, 2, 2a, 2b, 2e i 6 ustawy o podatku dochodowym od osób fizycznych
          - text: Jeżeli ulga na dzieci jest wyższa od kwoty odliczonej w zeznaniu, przysługuje różnica, nie wyższa niż suma składek wskazanych w art. 27f ust. 9; wykazujesz ją w zeznaniu.
            uses: [ulga.dzieci.kwoty]
            basis: art. 27f ust. 8, 9 i 12 ustawy o podatku dochodowym od osób fizycznych
      note: >-
        Tekst jednolity Dz.U. 2026 poz. 592 uwzględnia stan prawny na 1 kwietnia 2026 r.; zmiany ustawy o PIT, które
        weszły w życie między 1 stycznia a 1 kwietnia 2026 r. (Dz.U. 2025 poz. 1795, Dz.U. 2026 poz. 203 i 424), zmieniają
        tylko art. 21 i 52zr, a zmiana z Dz.U. 2025 poz. 1301 (tylko art. 52zo–52zr) weszła w życie w 2025 r., więc to brzmienie obowiązywało od 1 stycznia 2026 r. Późniejsze nowelizacje do
        31 grudnia 2026 r. (poz. 779, 846, 1079, 1098, 1123, 1287, 1347, 1354, 1371, 1556) art. 26, 26h i 27f nie zmieniają. Wcześniejszych
        wersji nie wprowadzono.
        Korekta z 27 listopada 2026 r.: zmienione kroki 1, 5 i 6.
      not_covered: >-
        Odliczenia składek na ubezpieczenia społeczne z art. 26 ust. 1 pkt 2 i 2a ustawy o podatku dochodowym od osób
        fizycznych (składki z pkt 2 lit. a i pkt 2a opisuje zasada podatku według skali) i zwrotu nienależnie pobranych świadczeń (art. 26 ust. 1
        pkt 5). Skali podatkowej (opisuje ją zasada podatku według skali) i odliczeń od podatku innych niż ulga na
        dzieci.
        Warunków i sposobu odliczeń od podstawy obliczenia podatku z art. 26e, 26ga, 26gb, 26ha–26he, 52jb, 52n i 52x
        ustawy o podatku dochodowym od osób fizycznych oraz ulgi na złe długi (art. 26i) poza tym, co podaje krok
        o podstawie obliczenia podatku.
        Ulgi odsetkowej z art. 9 ustawy z 16 listopada 2006 r. o zmianie ustawy o podatku dochodowym od osób fizycznych
        oraz o zmianie niektórych innych ustaw (Dz.U. 2006 nr 217 poz. 1588) ani odliczeń z odrębnych ustaw innych niż ustawy o stosunku Państwa do
        kościołów wymienione w kroku o darowiznach.
      see_also: [zasada.skala_podatek]

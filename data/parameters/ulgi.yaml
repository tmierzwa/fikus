        między 1 stycznia a 1 kwietnia 2026 r. art. 27f nie dotyczą, a późniejsze nowelizacje (w tym poz. 1123, która
        odsyła do art. 27f ust. 1 w art. 21 ust. 1 pkt 67b i art. 22 ust. 1p) go nie zmieniają. Wcześniejszych wersji nie wprowadzono.

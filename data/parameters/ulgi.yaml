        - title: Dz.U. 2026 poz. 592, tekst jednolity ustawy o podatku dochodowym od osób fizycznych (limit)
          url: https://api.sejm.gov.pl/eli/acts/DU/2026/592/text.pdf
          article: art. 26 ust. 5
          quote: "Łączna kwota odliczeń z tytułów określonych w ust. 1 pkt 9 nie może przekroczyć w roku podatkowym kwoty stanowiącej 6 % dochodu"
        - title: Dz.U. 2026 poz. 1541 (art. 11 ust. 2 od 2027 r. nadal obejmuje art. 26 ust. 5)
          url: https://api.sejm.gov.pl/eli/acts/DU/2026/1541/text.pdf

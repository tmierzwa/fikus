        Na ryczałcie darowizny z art. 26 ust. 1 pkt 9 ustawy o PIT odlicza się od przychodu (art. 11 ust. 1 ustawy
        o ryczałcie), a limit z art. 26 ust. 5 stosuje się odpowiednio (art. 11 ust. 2). Ustawa mówi o 6% dochodu;
        strony MF podają „6% Twojego dochodu (przychodu)”. Od jakiej kwoty przychodu liczy się limit, jest
        niewyjaśnione (otwarte pytanie do eksperta, P13); opisuje to zasada.ulgi_ryczalt. Od 1 stycznia 2027 r. art. 11 ust. 2 ma nowe brzmienie (Dz.U. 2026
        poz. 1541), ale nadal odsyła do art. 26 ust. 5. Wcześniejszych wersji nie wprowadzono.
      not_covered: >-

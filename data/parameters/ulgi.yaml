# Ulgi i odliczenia inne niż składki: które przysługują przy danej formie opodatkowania i jakie mają
# limity z ustaw. Serwer podaje limity i opisuje zasady krokami z podstawą prawną. Czy podatnik spełnia
# warunki ulgi i ile odlicza, ustala podatnik albo klient.

- id: zasada.ulgi_ryczalt
  name: Ulgi i odliczenia od przychodu na ryczałcie od przychodów ewidencjonowanych
  kind: rule
  applies_to: {tax_form: [ryczalt]}
  versions:
    - valid_from: 2026-01-01
      valid_to: 2026-12-31
      value:
        steps:
          - text: Od przychodów opodatkowanych ryczałtem możesz odliczyć stratę z art. 9 ust. 3–3b ustawy o podatku dochodowym od osób fizycznych oraz wydatki z art. 26 ust. 1 pkt 2, 2a, 2b, 2c, 5–6a i 9, art. 26h ust. 1 i art. 26hb ust. 1 tej ustawy, jeżeli nie zostały odliczone od dochodu ani zaliczone do kosztów uzyskania przychodów. Odliczenie składek społecznych (pkt 2 i 2a) i połowy składki zdrowotnej opisuje zasada podstawy opodatkowania ryczałtem.
            uses: [zasada.ryczalt_podstawa]
            basis: art. 11 ust. 1 i 1a ustawy o zryczałtowanym podatku dochodowym
          - text: Wpłaty na indywidualne konto zabezpieczenia emerytalnego dokonane w roku podatkowym odliczasz do wysokości rocznego limitu wpłat z ustawy o tych kontach, w zeznaniu.
            uses: [ikze.limit_wplat]
            basis: art. 11 ust. 1 i 2 ustawy o zryczałtowanym podatku dochodowym; art. 26 ust. 1 pkt 2b i ust. 6g ustawy o podatku dochodowym od osób fizycznych; art. 13a ustawy o indywidualnych kontach emerytalnych oraz indywidualnych kontach zabezpieczenia emerytalnego
          - text: Wydatki na użytkowanie sieci Internet odliczasz do rocznego limitu, wyłącznie w dwóch kolejnych latach podatkowych i tylko wtedy, gdy w okresie poprzedzającym te lata nie korzystałeś z tego odliczenia.
            uses: [ulga.internet.limit]
            basis: art. 11 ust. 1 i 2 ustawy o zryczałtowanym podatku dochodowym; art. 26 ust. 1 pkt 6a i ust. 6h ustawy o podatku dochodowym od osób fizycznych
          - text: Wydatki na cele rehabilitacyjne i na ułatwienie wykonywania czynności życiowych odliczasz według katalogu z art. 26 ust. 7a ustawy o PIT; część pozycji ma roczny limit, a wydatki na leki odliczasz w części przekraczającej kwotę miesięczną. Warunki (orzeczenie, brak finansowania z funduszy, osoby na utrzymaniu) są w art. 26 ust. 7b–7g.
            uses: [ulga.rehabilitacyjna.limity]
            basis: art. 11 ust. 1 i 2 ustawy o zryczałtowanym podatku dochodowym; art. 26 ust. 1 pkt 6 i ust. 7a–7g ustawy o podatku dochodowym od osób fizycznych
          - text: Darowizny na cele z art. 26 ust. 1 pkt 9 ustawy o PIT odliczasz łącznie do limitu procentowego. Nie odliczysz darowizn na rzecz osób fizycznych ani podmiotów wymienionych w art. 26 ust. 5 pkt 2, ani darowizn zaliczonych do kosztów. Wysokość darowizny ustalasz na podstawie dokumentów z art. 26 ust. 7. Od jakiej kwoty przychodu liczy się limit (przed odliczeniami z art. 11 ust. 1 i 1a ustawy o ryczałcie czy po nich, a przy przychodach opodatkowanych różnymi stawkami łącznie czy osobno), jest niewyjaśnione (otwarte pytanie do eksperta, P13).
            uses: [ulga.darowizny.limit_ryczalt]
            basis: art. 11 ust. 1 i 2 ustawy o zryczałtowanym podatku dochodowym; art. 26 ust. 1 pkt 9, ust. 5, 6, 6f i 7 ustawy o podatku dochodowym od osób fizycznych
          - text: Wydatki na przedsięwzięcie termomodernizacyjne w budynku mieszkalnym jednorodzinnym, którego jesteś właścicielem lub współwłaścicielem, odliczasz do limitu na wszystkie przedsięwzięcia, na warunkach art. 26h ust. 2–9 ustawy o PIT. Ta zasada nie opisuje odliczenia wydatków na zabytki (art. 26hb ust. 1) ani wydatków na terminal płatniczy (art. 11 ust. 3a ustawy o ryczałcie w zw. z art. 26hd ustawy o PIT).
            uses: [ulga.termomodernizacja.limit]
            basis: art. 11 ust. 1, 2 i 3a ustawy o zryczałtowanym podatku dochodowym; art. 26h ust. 1 i 2 ustawy o podatku dochodowym od osób fizycznych
          - text: Przy przychodach opodatkowanych różnymi stawkami odliczenia dzielisz w takim stosunku, w jakim pozostają poszczególne przychody w ogólnej kwocie przychodów.
            uses: [zasada.ryczalt_podstawa]
            basis: art. 11 ust. 3 ustawy o zryczałtowanym podatku dochodowym
          - text: Ulgi na dzieci nie odliczasz od ryczałtu. Art. 27f ustawy o PIT pozwala odliczyć ją od podatku obliczonego według skali podatkowej (art. 27), a art. 11 ustawy o ryczałcie jej nie wymienia. Jeżeli oprócz przychodów z ryczałtu masz dochody opodatkowane według skali, ulgę wykazujesz w zeznaniu, w którym rozliczasz te dochody.
            uses: [ulga.dzieci.kwoty]
            basis: art. 27f ust. 1 ustawy o podatku dochodowym od osób fizycznych; art. 11 ustawy o zryczałtowanym podatku dochodowym
      note: >-
        Art. 11 ustawy o ryczałcie ma to brzmienie w tekście jednolitym Dz.U. 2025 poz. 843 (przepisy ogłoszone
        przed 12 czerwca 2025 r.); późniejsze nowelizacje (Dz.U. 2026 poz. 779 i 1098) art. 11 nie zmieniają, a zmiana
        z Dz.U. 2026 poz. 1541 wchodzi w życie 1 stycznia 2027 r. (następna wersja). Przepisy ustawy o PIT, do których
        odsyła art. 11, mają brzmienie z tekstu jednolitego Dz.U. 2026 poz. 592 (stan prawny na 1 kwietnia 2026 r.);
        zmiany ustawy o PIT, które weszły w życie między 1 stycznia a 1 kwietnia 2026 r. (Dz.U. 2025 poz. 1795,
        Dz.U. 2026 poz. 203 i 424), zmieniają tylko art. 21 i 52zr, a zmiana z Dz.U. 2025 poz. 1301 (tylko art. 52zo–52zr)
        weszła w życie w 2025 r., więc to brzmienie obowiązywało od 1 stycznia
        2026 r. Wcześniejszych wersji nie wprowadzono.
        Korekta z 27 listopada 2026 r.: zmieniony krok o darowiznach (P13).
      sources:
        - title: Dz.U. 2025 poz. 843, tekst jednolity ustawy o zryczałtowanym podatku dochodowym (katalog odliczeń)
          url: https://api.sejm.gov.pl/eli/acts/DU/2025/843/text.pdf
          article: art. 11 ust. 1
          quote: "oraz wydatki określone w art. 26 ust. 1 pkt 2, 2a, 2b, 2c, 5–6a i 9, art. 26h ust. 1 oraz art. 26hb ust. 1 ustawy o podatku dochodowym"
        - title: Dz.U. 2025 poz. 843, tekst jednolity ustawy o zryczałtowanym podatku dochodowym (przepisy stosowane odpowiednio)
          url: https://api.sejm.gov.pl/eli/acts/DU/2025/843/text.pdf
          article: art. 11 ust. 2
          quote: "stosuje się odpowiednio przepisy art. 9 ust. 3–3b, art. 26 ust. 5–7h, 13b, 13c i 15, art. 26h ust. 2–9"
        - title: Dz.U. 2025 poz. 843, tekst jednolity ustawy o zryczałtowanym podatku dochodowym (terminal płatniczy)
          url: https://api.sejm.gov.pl/eli/acts/DU/2025/843/text.pdf
          article: art. 11 ust. 3a
          quote: "może odliczyć od tych przychodów wydatki określone w art. 26hd ust. 1 i 2 ustawy o podatku dochodowym"
        - title: Dz.U. 2025 poz. 843, tekst jednolity ustawy o zryczałtowanym podatku dochodowym (proporcja)
          url: https://api.sejm.gov.pl/eli/acts/DU/2025/843/text.pdf
          article: art. 11 ust. 3
          quote: "odliczeń tych dokonuje w takim stosunku, w jakim w roku podatkowym pozostają poszczególne przychody"
        - title: Dz.U. 2026 poz. 592, tekst jednolity ustawy o podatku dochodowym od osób fizycznych (Internet, dwa lata)
          url: https://api.sejm.gov.pl/eli/acts/DU/2026/592/text.pdf
          article: art. 26 ust. 6h
          quote: "przysługuje podatnikowi wyłącznie w kolejno po sobie następujących dwóch latach podatkowych, jeżeli w okresie poprzedzającym te lata nie korzystał z tego odliczenia"
        - title: Dz.U. 2026 poz. 592, tekst jednolity ustawy o podatku dochodowym od osób fizycznych (IKZE w zeznaniu)
          url: https://api.sejm.gov.pl/eli/acts/DU/2026/592/text.pdf

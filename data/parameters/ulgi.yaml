          odpowiednio i nie rozstrzyga, czy prawo do odliczenia w zeznaniu za 2027 r. zachowuje podatnik, który zmienił
          formę opodatkowania między 2026 a 2027 r. (z ryczałtu na skalę albo odwrotnie). Kwota limitu na 2027 r. wynika
          tylko z przepisu przejściowego. Pytanie do eksperta: docs/pytania-do-eksperta.md, P14.
          Krok o odliczeniach od podstawy: art. 52jb ust. 2a (od 1 stycznia 2027 r.) uznaje za koszty poniesione
          na robotyzację odpisy amortyzacyjne dokonywane w danym roku. Nie wiadomo, czy dotyczy to także odpisów od
          środków trwałych i wartości niematerialnych i prawnych nabytych przed 2027 r., i jak to się ma do art. 7 ust. 1
          ustawy Dz.U. 2026 poz. 1541. Nie wiadomo też, w jakiej kolejności po 2026 r. stosuje się odliczenia i doliczenia
          z art. 26gb (ust. 9 i 6) za koszty sprzed 2027 r. (art. 6 ust. 1 tej ustawy) wobec art. 26i, który od 1 stycznia 2027 r. nie odsyła do
          art. 26gb. Pytanie do eksperta: docs/pytania-do-eksperta.md, P20.

- id: ulga.internet.limit
  name: Roczny limit odliczenia wydatków na użytkowanie sieci Internet
  unit: PLN/rok
  applies_to: {tax_form: [ryczalt, skala]}
  versions:
    - valid_from: 2026-01-01
      valid_to: 2026-12-31
      value: 760
      note: >-
        Limit na podatnika w roku podatkowym; odliczenie przysługuje tylko w dwóch kolejnych latach podatkowych
        (art. 26 ust. 6h). Na ryczałcie od przychodu przez art. 11 ust. 1 ustawy o ryczałcie; przy podatku liniowym
        nie przysługuje (art. 30c ust. 2 go nie wymienia). Tekst jednolity Dz.U. 2026 poz. 592 uwzględnia stan prawny
        na 1 kwietnia 2026 r.; zmiany wchodzące w życie między 1 stycznia a 1 kwietnia 2026 r. art. 26 nie dotyczą, więc
        limit obowiązywał od 1 stycznia 2026 r. Zamknięta 2026-12-31: ustawa Dz.U. 2026 poz. 1541 uchyla to odliczenie
        dla dochodów (przychodów) od 1 stycznia 2027 r. (następna wersja). Wcześniejszych wersji nie wprowadzono.
      sources:
        - title: Dz.U. 2026 poz. 592, tekst jednolity ustawy o podatku dochodowym od osób fizycznych
          url: https://api.sejm.gov.pl/eli/acts/DU/2026/592/text.pdf
          article: art. 26 ust. 1 pkt 6a
          quote: "wydatków ponoszonych przez podatnika z tytułu użytkowania sieci Internet, w wysokości nieprzekraczającej w roku podatkowym kwoty 760 zł"
        - title: Dz.U. 2025 poz. 843, tekst jednolity ustawy o zryczałtowanym podatku dochodowym (odliczenie od przychodu)
          url: https://api.sejm.gov.pl/eli/acts/DU/2025/843/text.pdf
          article: art. 11 ust. 1
          quote: "oraz wydatki określone w art. 26 ust. 1 pkt 2, 2a, 2b, 2c, 5–6a i 9"
        - title: podatki.gov.pl (MF), Ulga na Internet PIT, aktualizacja 9.10.2026
          url: https://podatki.gov.pl/ulgi-i-odliczenia/ulga-na-internet-pit
          kind: control
          quote: "Możesz odliczyć wydatki poniesione na korzystanie z Internetu, ale nie więcej niż 760 zł w roku podatkowym."
          as_of: 2026-11-26
      verification: {checked_at: 2026-11-26, agent_check: 2026-11-26}
    - valid_from: 2027-01-01
      valid_to: 2027-12-31
      value: 760
      note: >-
        Podatnik, który po raz pierwszy skorzystał z odliczenia w zeznaniu za 2026 r., zachowuje je w zeznaniu za 2027 r.
        na zasadach z art. 26 ust. 1 pkt 6a i ust. 6h w brzmieniu dotychczasowym (art. 5 ust. 1 ustawy Dz.U. 2026
        poz. 1541); wartość to limit z dotychczasowego art. 26 ust. 1 pkt 6a, do którego ten przepis odsyła, ale czy obowiązuje
        w zeznaniu za 2027 r., jest niewyjaśnione (otwarte pytanie do eksperta, P14). Do podatników, którzy odliczali wydatki na ryczałcie, przepis stosuje się
        odpowiednio (art. 5 ust. 2); kogo dokładnie obejmuje na ryczałcie, jest otwartym pytaniem (P14). Poza przepisem
        przejściowym odliczenie od dochodów (przychodów) uzyskanych od 1 stycznia 2027 r. nie przysługuje. Po 2027 r. wersji nie ma.
        Przepis przejściowy opisuje też ifirma.pl
        (https://www.ifirma.pl/blog/zmiany-w-ulgach-podatkowych-od-2027-koniec-ulgi-na-internet-i-ekspansje-wyzsza-ulga-dla-krwiodawcow/),
        ale nie podaje kwoty limitu na 2027 r. Strona MF „Ulga na Internet PIT” (aktualizacja 9.10.2026) powstała
        przed ogłoszeniem ustawy i opisuje tylko regułę dwóch lat z art. 26 ust. 6h.
      sources:
        - title: Dz.U. 2026 poz. 1541, ustawa z 22 października 2026 r. o zmianie ustawy o PIT, ustawy o CIT oraz ustawy o ryczałcie (przepis przejściowy)
          url: https://api.sejm.gov.pl/eli/acts/DU/2026/1541/text.pdf
          article: art. 5 ust. 1
          quote: "zachowuje prawo do tego odliczenia w zeznaniu podatkowym składanym za 2027 r. na zasadach określonych w art. 26 ust. 1 pkt 6a i ust. 6h ustawy zmienianej w art. 1"
          as_of: 2026-11-23
        - title: Dz.U. 2026 poz. 1541 (ryczałt)
          url: https://api.sejm.gov.pl/eli/acts/DU/2026/1541/text.pdf
          article: art. 5 ust. 2
          quote: "na podstawie art. 11 ust. 1 ustawy zmienianej w art. 3, w brzmieniu dotychczasowym"
          as_of: 2026-11-23
        - title: Dz.U. 2026 poz. 592, tekst jednolity ustawy o podatku dochodowym od osób fizycznych (brzmienie dotychczasowe)
          url: https://api.sejm.gov.pl/eli/acts/DU/2026/592/text.pdf
          article: art. 26 ust. 1 pkt 6a
          quote: "wydatków ponoszonych przez podatnika z tytułu użytkowania sieci Internet, w wysokości nieprzekraczającej w roku podatkowym kwoty 760 zł"
      verification:
        checked_at: 2026-11-26
        agent_check: 2026-11-26
        open_issue: >-
          Limit na 2027 r. wynika z art. 5 ustawy Dz.U. 2026 poz. 1541 w zw. z dotychczasowym art. 26 ust. 1 pkt 6a.
          Żadne inne źródło nie podaje samo kwoty 760 zł dla zeznania za 2027 r. (strona MF sprzed ogłoszenia ustawy,
          ifirma.pl podaje przepis przejściowy bez kwoty). Nie wiadomo, jak art. 5 ust. 1 stosuje się odpowiednio na ryczałcie
          (art. 5 ust. 2). Nie wiadomo też, czy przepis przejściowy obejmuje podatnika,
          który zmienił formę opodatkowania między 2026 a 2027 r. Pytanie do eksperta: docs/pytania-do-eksperta.md, P14.


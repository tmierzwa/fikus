  kind: deadline
  applies_to: {tax_form: [skala, liniowy]}
  versions:
    - valid_from: 2026-01-01
      value: {day_of_month: 20, months: [1, 4, 7, 10]}
      note: >-
        Dotyczy tylko podatników, którzy wybrali zaliczki kwartalne (zasada.zaliczki_kwartalne_pit). Termin w miesiącu
        po kwartale; za ostatni kwartał roku do 20 stycznia następnego roku. Tekst jednolity uwzględnia stan prawny
        na 1 kwietnia 2026 r.; data początku obowiązywania (2026-01-01) nie jest potwierdzona źródłem.
      sources:

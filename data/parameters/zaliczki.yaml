        open_issue: >-
          Art. 44 ust. 10 ustawy o PIT i art. 21 ust. 1d ustawy o ryczałcie zwalniają z obowiązków „za okres objęty
          zawieszeniem”, a art. 24 ust. 7 Prawa przedsiębiorców liczy skutki zawieszenia od dnia jego rozpoczęcia do dnia
          poprzedzającego dzień wznowienia. Zaliczki i ryczałt liczy się za miesiące albo kwartały. Przepisy nie mówią, jak
          ustalić zaliczkę albo ryczałt za miesiąc lub kwartał, w którego trakcie zawieszenie się zaczęło albo skończyło.
          Art. 44 ust. 10 i 13 nie wymieniają ust. 3h (zaliczki kwartalne przy podatku liniowym); ust. 10 wymienia ust. 1 pkt 1.
          Pytanie do eksperta: docs/pytania-do-eksperta.md, P56.

# Zaliczki kwartalne i uproszczone na PIT oraz kwartalne wpłaty ryczałtu.
# Zaliczki miesięczne opisują zasada.liniowy_podatek, zasada.skala_podatek, termin.zaliczka_liniowy,
# termin.zaliczka_skala i termin.zaliczka_ryczalt.
# Limity są w euro; zasadę przeliczenia na złote opisują kroki zasad. Serwer niczego nie liczy, liczy klient.

- id: pit.maly_podatnik.limit_euro
  name: Limit przychodu ze sprzedaży małego podatnika PIT (w euro, za poprzedni rok podatkowy)
  unit: EUR/rok
  applies_to: {tax_form: [skala, liniowy]}
  versions:
    - valid_from: 2026-01-01
      value: 2000000
      note: >-
        Mały podatnik to podatnik, u którego przychód ze sprzedaży razem z należnym VAT nie przekroczył
        w poprzednim roku podatkowym równowartości tej kwoty; przy przedsiębiorstwie w spadku wlicza się też przychód
        ze sprzedaży u zmarłego przedsiębiorcy. Kwotę przelicza się na złote według średniego kursu euro NBP
        z pierwszego dnia roboczego października poprzedniego roku podatkowego, w zaokrągleniu do 1000 zł.
        Tekst jednolity uwzględnia stan prawny na 1 kwietnia 2026 r.;
        data początku obowiązywania (2026-01-01) nie jest potwierdzona źródłem. Nowelizacje ogłoszone później
        (Dz.U. 2026 poz. 779, 846, 1079, 1098, 1123, 1287, 1347, 1354, 1371, 1541, 1542 i 1556) nie zmieniają art. 5a pkt 20.
      sources:
        - title: Dz.U. 2026 poz. 592, tekst jednolity ustawy o podatku dochodowym od osób fizycznych
          url: https://api.sejm.gov.pl/eli/acts/DU/2026/592/text.pdf
          article: art. 5a pkt 20
          quote: "nie przekroczyła w poprzednim roku podatkowym wyrażonej w złotych kwoty odpowiadającej równowartości 2 000 000 euro"
        - title: podatki.gov.pl (MF), Opodatkowanie podatkiem liniowym, aktualizacja 24.06.2026
          url: https://podatki.gov.pl/podatki-firmowe/pit/informacje-podstawowe/co-jest-opodatkowane/opodatkowanie-podatkiem-liniowym
          kind: control
          quote: "nie przekroczyła w poprzednim roku podatkowym wyrażonej w złotych kwoty odpowiadającej równowartości 2 000 000 euro"
          as_of: 2026-11-26
        - title: biznes.gov.pl, Skala podatkowa, aktualizacja 07.01.2026
          url: https://www.biznes.gov.pl/pl/portal/00264
          kind: control
          quote: "Mały podatnik – podatnik, którego przychody ze sprzedaży wraz z podatkiem VAT nie przekroczyły w poprzednim roku podatkowym 2 mln euro"
          as_of: 2026-11-26
      verification: {checked_at: 2026-11-26, agent_check: 2026-11-26}

- id: ryczalt.kwartalnie.limit_euro
  name: Limit przychodu za poprzedni rok uprawniający do kwartalnego opłacania ryczałtu (w euro)
  unit: EUR/rok
  applies_to: {tax_form: [ryczalt]}
  versions:
    - valid_from: 2026-01-01
      value: 200000
      note: >-
        Przychody z działalności prowadzonej samodzielnie albo przychody spółki w roku poprzedzającym rok podatkowy.
        Do limitu nie wlicza się kwot, o które podatnik zmniejszył albo zwiększył przychody na podstawie art. 11 ust. 4,
        5, 8 i 9 albo podstawę obliczenia podatku na podstawie art. 26i ustawy o PIT. Kwotę przelicza się na złote
        według średniego kursu euro NBP z pierwszego dnia roboczego października roku poprzedzającego rok podatkowy
        (art. 4 ust. 2). Tekst jednolity uwzględnia zmiany ogłoszone
        przed 2025-06-12; data początku obowiązywania (2026-01-01) nie jest potwierdzona źródłem. Nowelizacje ogłoszone
        później (Dz.U. 2026 poz. 779, 1098 i 1541) nie zmieniają art. 4, 7 ani 21 ust. 1a–1c.
      sources:
        - title: Dz.U. 2025 poz. 843, tekst jednolity ustawy o zryczałtowanym podatku dochodowym
          url: https://api.sejm.gov.pl/eli/acts/DU/2025/843/text.pdf
          article: art. 21 ust. 1b
          quote: "w roku poprzedzającym rok podatkowy – nie przekroczyły kwoty stanowiącej równowartość 200 000 euro"
        - title: podatki.gov.pl (MF), Opodatkowanie ryczałtem od przychodów ewidencjonowanych, aktualizacja 16.02.2026
          url: https://podatki.gov.pl/podatki-firmowe/pit/informacje-podstawowe/co-jest-opodatkowane/opodatkowanie-ryczaltem-od-przychodow-ewidencjonowanych
          kind: control
          quote: "Twoje przychody z działalności prowadzonej samodzielnie albo przychody spółki - w roku poprzedzającym rok podatkowy - nie przekroczyły kwoty stanowiącej równowartość 200 000 euro"
          as_of: 2026-11-26
        - title: biznes.gov.pl, Ryczałt od przychodów ewidencjonowanych, aktualizacja 07.01.2026
          url: https://www.biznes.gov.pl/pl/portal/00263
          kind: control
          quote: "w poprzednim roku, w ramach działalności prowadzonej samodzielnie albo w formie spółki, osiągnąłeś przychody nieprzekraczające 200 tys. euro"
          as_of: 2026-11-26
      verification: {checked_at: 2026-11-26, agent_check: 2026-11-26}


        na 1 kwietnia 2026 r.; data początku obowiązywania (2026-01-01) nie jest potwierdzona źródłem.
      sources:
        - title: Dz.U. 2026 poz. 592, tekst jednolity ustawy o podatku dochodowym od osób fizycznych

- id: zasada.jpk_pd_pkpir
  name: Przesyłanie podatkowej księgi przychodów i rozchodów w formie JPK (JPK_PKPIR)
  kind: rule
  applies_to: {tax_form: [liniowy, skala]}
  versions:
    - valid_from: 2026-07-01
      value:
        steps:
          - text: Podatnik prowadzący podatkową księgę przychodów i rozchodów lub ewidencję środków trwałych oraz wartości niematerialnych i prawnych prowadzi je przy użyciu programów komputerowych i po zakończeniu roku podatkowego przesyła je naczelnikowi urzędu skarbowego w postaci elektronicznej odpowiadającej strukturze logicznej, do dnia upływu terminu złożenia zeznania, o którym mowa w art. 45 ust. 1 ustawy o PIT.
            uses: [schemat.jpk_pkpir, termin.zeznanie_skala, termin.zeznanie_liniowy]
            basis: art. 24a ust. 1e pkt 1 ustawy o PIT w brzmieniu od 1 lipca 2026 r.; art. 193a § 2 Ordynacji podatkowej
          - text: Po raz pierwszy księgę przesyła się za rok podatkowy rozpoczynający się po 31 grudnia 2025 r., jeżeli podatnik jest obowiązany przesyłać ewidencję VAT za każdy miesiąc łącznie z deklaracją (rozliczenie miesięczne VAT).
            uses: [schemat.jpk_v7m]
            basis: art. 66 ust. 1 pkt 1 ustawy z 29 października 2021 r. (Dz.U. 2021 poz. 2105) w brzmieniu nadanym ustawami Dz.U. 2022 poz. 1265 i Dz.U. 2023 poz. 1059; art. 109 ust. 3b ustawy o VAT
          - text: Pozostali podatnicy (w tym rozliczający VAT kwartalnie i niebędący czynnymi podatnikami VAT) przesyłają księgę po raz pierwszy za rok podatkowy rozpoczynający się po 31 grudnia 2026 r.
            uses: []
            basis: art. 66 ust. 1 pkt 2 ustawy z 29 października 2021 r. (Dz.U. 2021 poz. 2105) w brzmieniu nadanym ustawami Dz.U. 2022 poz. 1265 i Dz.U. 2023 poz. 1059
      note: >-
        Data początku obowiązywania to wejście w życie nowego brzmienia art. 24a ust. 1e (ustawa Dz.U. 2026 poz. 779,
        art. 5). Wcześniejsze brzmienie (tekst jednolity Dz.U. 2026 poz. 592) też wiązało termin przesłania księgi
        z terminem złożenia zeznania; okresu przed 1 lipca 2026 r. ta wersja nie opisuje. Art. 66 ust. 1 pkt 1
        wszedł w życie 1 stycznia 2026 r., a pkt 2 wchodzi 1 stycznia 2027 r. (art. 89 pkt 7 i 8 ustawy
        z 29 października 2021 r. w brzmieniu nadanym ustawą Dz.U. 2023 poz. 1059). Ustawa z 29 października 2021 r.
        nie ma tekstu jednolitego, więc brzmienie art. 66 wynika z ustaw zmieniających. Inne zmiany tej ustawy wymienione w obwieszczeniu (Dz.U. 2021 poz. 2349 i 2427, Dz.U. 2022 poz. 1301, 1719 i 2180, Dz.U. 2023 poz. 1414, Dz.U. 2024 poz. 1593 i 1685, Dz.U. 2025 poz. 222) ani ustawy Dz.U. 2021 poz. 2469 (zmienia tylko art. 15 pkt 8) i Dz.U. 2023 poz. 1598 (zmienia tylko art. 88 ust. 1) nie zmieniają art. 66 ust. 1 ani art. 89 pkt 7 i 8; brzmienie art. 89 pkt 7 i 8 podaje obwieszczenie do tekstu jednolitego Dz.U. 2025 poz. 843. Przepis nie mówi, na który
        dzień ocenia się sposób rozliczania VAT (otwarte pytanie). Termin zeznania z art. 45 ust. 1 opisują parametry
        termin.zeznanie_skala (art. 45 ust. 1) i termin.zeznanie_liniowy (art. 45 ust. 1 i 1a pkt 2).
      sources:
        - title: Dz.U. 2026 poz. 779, ustawa z 15 maja 2026 r. o zmianie ustawy o PIT, ustawy o CIT i ustawy o ryczałcie
          url: https://api.sejm.gov.pl/eli/acts/DU/2026/779/text.pdf
          quote: "do dnia upływu terminu złożenia zeznania, o którym mowa w art. 45 ust. 1 – w przypadku podatkowej księgi przychodów i rozchodów oraz ewidencji środków trwałych oraz wartości niematerialnych i prawnych"
          article: art. 1 pkt 5 (art. 24a ust. 1e), art. 5
        - title: Dz.U. 2026 poz. 592, tekst jednolity ustawy o podatku dochodowym od osób fizycznych (brzmienie przed 1 lipca 2026 r.)
          url: https://api.sejm.gov.pl/eli/acts/DU/2026/592/text.pdf
          quote: "są obowiązane prowadzić te księgi i ewidencję przy użyciu programów komputerowych oraz przesyłać właściwemu naczelnikowi urzędu skarbowego te księgi i ewidencję po zakończeniu roku podatkowego"
          article: art. 24a ust. 1e
        - title: Dz.U. 2022 poz. 1265, ustawa z 9 czerwca 2022 r. (nowe brzmienie art. 66 ustawy z 29 października 2021 r.)
          url: https://api.sejm.gov.pl/eli/acts/DU/2022/1265/text.pdf
          quote: "Księgi, ewidencje i wykazy, o których mowa w art. 24a ust. 1e ustawy zmienianej w art. 1 oraz w art. 15 ust. 12 ustawy zmienianej w art. 9, są prowadzone przy użyciu programów komputerowych i przesyłane po raz pierwszy"
          article: art. 13 pkt 2 (art. 66 ust. 1)
        - title: Dz.U. 2023 poz. 1059, ustawa z 26 maja 2023 r. (daty w art. 66 ust. 1 ustawy z 29 października 2021 r.)
          url: https://api.sejm.gov.pl/eli/acts/DU/2023/1059/text.pdf
          quote: "we wprowadzeniu do wyliczenia wyrazy „okresy rozliczeniowe rozpoczynające” zastępuje się wyrazami „rok podatkowy rozpoczynający”, – w pkt 1 wyrazy „31 grudnia 2024 r.” zastępuje się wyrazami „31 grudnia 2025 r.”, – w pkt 2 wyrazy „31 grudnia 2025 r.” zastępuje się wyrazami „31 grudnia 2026 r.”"
          article: art. 13 pkt 4 lit. a (art. 66 ust. 1), art. 13 pkt 5 (art. 89 pkt 7 i 8)
        - title: Dz.U. 2025 poz. 843, obwieszczenie o tekście jednolitym ustawy o ryczałcie (brzmienie art. 89 pkt 7 i 8 ustawy z 29 października 2021 r.)
          url: https://api.sejm.gov.pl/eli/acts/DU/2025/843/text.pdf
          quote: "art. 66 ust. 1 pkt 1 i ust. 2 pkt 2, które wchodzą w życie z dniem 1 stycznia 2026 r.; 8) art. 66 ust. 1 pkt 2 i ust. 2 pkt 3, które wchodzą w życie z dniem 1 stycznia 2027 r."
          article: pkt 2 ppkt 1 obwieszczenia (art. 89 pkt 7 i 8)
        - title: Dz.U. 2026 poz. 1263, tekst jednolity ustawy o podatku od towarów i usług (rozliczenie miesięczne)
          url: https://api.sejm.gov.pl/eli/acts/DU/2026/1263/text.pdf
          quote: "są obowiązani przesyłać, na zasadach określonych w art. 99 ust. 11c, za każdy miesiąc do urzędu skarbowego"
          article: art. 109 ust. 3b
        - title: podatki.gov.pl (MF), Broszura informacyjna dotycząca struktury JPK_PKPIR(3) (pierwszy rok i termin przesłania księgi; bez ewidencji środków trwałych)
          url: https://podatki.gov.pl/media/pbqdgqcp/broszura_informacyjna_dot_jpk_pkpir-3.pdf
          quote: "31 grudnia 2025 r. - w przypadku podmiotów, które są obowiązane przesyłać ewidencję, o której mowa w art. 109 ust. 3 ustawy VAT, zgodnie z art. 109 ust. 3b tej ustawy[5], tj. podmiotów zobowiązanych przesyłać miesięczne pliki JPK_V7M;"
          as_of: 2026-11-26
        - title: podatki.gov.pl (MF), JPK_PD (kto przekazuje)
          url: https://podatki.gov.pl/podatki-firmowe/jednolity-plik-kontrolny/jpk_pd/jpk_pd
          kind: control
          quote: "31 grudnia 2025 r. – pozostali podatnicy CIT i PIT zobowiązani do składania JPK_VAT za okresy miesięczne, 31 grudnia 2026 r. – pozostali podatnicy, w tym podatnicy zobowiązani do składania JPK_VAT za okresy kwartalne."
          as_of: 2026-11-26
      verification:
        checked_at: 2026-11-26
        agent_check: 2026-11-26
        open_issue: >-
          P19: przepis nie mówi, na który dzień ocenia się obowiązek przesyłania ewidencji VAT za każdy miesiąc
          (na przykład przy zmianie rozliczenia z kwartalnego na miesięczne w 2026 r. albo rejestracji jako
          czynny podatnik VAT w trakcie roku). Zob. docs/pytania-do-eksperta.md.

- id: zasada.jpk_pd_ryczalt
  name: Przesyłanie ewidencji na ryczałcie w formie JPK
  kind: rule
  applies_to: {tax_form: [ryczalt]}
  versions:
    - valid_from: 2026-01-01
      value:
        steps:
          - text: Podatnik na ryczałcie prowadzący ewidencję przychodów lub wykaz środków trwałych oraz wartości niematerialnych i prawnych prowadzi tę ewidencję i wykaz przy użyciu programów komputerowych i po zakończeniu roku podatkowego przesyła je naczelnikowi urzędu skarbowego w postaci elektronicznej odpowiadającej strukturze logicznej, do dnia upływu terminu złożenia zeznania rocznego. Ustawa nazywa ewidencję przychodów „ewidencją” (art. 15 ust. 1). Ewidencję przychodów przesyła się w strukturze JPK_EWP.
            uses: [termin.zeznanie_ryczalt]
            basis: art. 15 ust. 1 i 12 ustawy o zryczałtowanym podatku dochodowym; art. 193a § 2 Ordynacji podatkowej
          - text: Po raz pierwszy przesyła się je za rok podatkowy rozpoczynający się po 31 grudnia 2025 r., jeżeli podatnik jest obowiązany przesyłać ewidencję VAT za każdy miesiąc łącznie z deklaracją (rozliczenie miesięczne VAT).
            uses: [schemat.jpk_v7m]
            basis: art. 66 ust. 1 pkt 1 ustawy z 29 października 2021 r. (Dz.U. 2021 poz. 2105) w brzmieniu nadanym ustawami Dz.U. 2022 poz. 1265 i Dz.U. 2023 poz. 1059; art. 109 ust. 3b ustawy o VAT
          - text: Pozostali podatnicy (w tym rozliczający VAT kwartalnie i niebędący czynnymi podatnikami VAT) przesyłają je po raz pierwszy za rok podatkowy rozpoczynający się po 31 grudnia 2026 r.
            uses: []
            basis: art. 66 ust. 1 pkt 2 ustawy z 29 października 2021 r. (Dz.U. 2021 poz. 2105) w brzmieniu nadanym ustawami Dz.U. 2022 poz. 1265 i Dz.U. 2023 poz. 1059
      note: >-
        Art. 15 ust. 12 wszedł w życie 1 stycznia 2026 r. (przypis w tekście jednolitym Dz.U. 2025 poz. 843).
        Art. 66 ust. 1 pkt 1 wszedł w życie 1 stycznia 2026 r., a pkt 2 wchodzi 1 stycznia 2027 r. Ustawa
        z 29 października 2021 r. nie ma tekstu jednolitego, więc brzmienie art. 66 wynika z ustaw zmieniających.
        Inne zmiany tej ustawy wymienione w obwieszczeniu (Dz.U. 2021 poz. 2349 i 2427, Dz.U. 2022 poz. 1301, 1719 i 2180, Dz.U. 2023 poz. 1414, Dz.U. 2024 poz. 1593 i 1685, Dz.U. 2025 poz. 222) ani ustawy Dz.U. 2021 poz. 2469 (zmienia tylko art. 15 pkt 8) i Dz.U. 2023 poz. 1598 (zmienia tylko art. 88 ust. 1) nie zmieniają art. 66 ust. 1 ani art. 89 pkt 7 i 8; brzmienie art. 89 pkt 7 i 8 podaje obwieszczenie do tekstu jednolitego Dz.U. 2025 poz. 843.
        Poprawka: pierwszy krok obejmuje ewidencję przychodów (wcześniej zostawiał to jako otwarte pytanie).
        Art. 15 ust. 1 wprowadza dla ewidencji przychodów nazwę „ewidencja”, której używa ust. 12, a broszura MF
        o strukturze JPK_EWP(4) podaje wprost, że ryczałtowcy prowadzący ewidencję przychodów przesyłają plik
        JPK_EWP, i wskazuje art. 15 ust. 12 jako podstawę. Przepis nie mówi, na który dzień ocenia się sposób
        rozliczania VAT (otwarte pytanie).

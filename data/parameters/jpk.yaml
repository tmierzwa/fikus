          quote: "albo JPK_V7K (2) [dla podatników rozliczających się kwartalnie] - wersjaSchemy: 1-0E."
          as_of: 2026-11-26
      verification:
        checked_at: 2026-11-26
        agent_check: 2026-11-26
        open_issue: >-
          P17: jeśli plik JPK_V7K za marzec 2026 r. z deklaracją za I kwartał 2026 r. składa się w wariancie 2,
          data końca obowiązywania tej wersji (2026-01-31) jest za wczesna. Zob. docs/pytania-do-eksperta.md.
    - valid_from: 2026-02-01
      value:
        form: JPK_V7K
        variant: 3
        system_code: JPK_V7K (3)
        schema_version: 1-0E
        xsd_url: http://crd.gov.pl/wzor/2025/12/19/14089/schemat.xsd
      note: >-
        Okres obowiązywania dotyczy okresów rozliczeniowych od lutego 2026 r. Wzór opublikowano w Centralnym
        Repozytorium Wzorów Dokumentów Elektronicznych 19 grudnia 2025 r. pod numerem 2025/12/19/14089; adres schematu pochodzi z wyróżnika wzoru (tak jak w rejestrze, z http). Plik JPK_V7K składa się za miesiąc; plik za

        2021/12/27/11149; adres schematu pochodzi z wyróżnika wzoru (tak jak w rejestrze, z http). Żaden dokument
        nie podaje sam całej wartości: okres podają strona KAS i broszura MF z 2026 r., wariant i datę początku

        wariancie składa się deklarację za I kwartał 2026 r., który obejmuje styczeń (otwarte pytanie).
        Rozporządzenie bazowe (Dz.U. 2019 poz. 1988) nie ma tekstu jednolitego w ELI. Wariant, kod systemowy,
        wersję schematu 1-0E i okres podaje sama tylko broszura MF z 2026 r., a adres schematu tylko wyróżnik wzoru;
        wersji 1-0E nie potwierdza drugi dokument. Dlatego wersja nie ma drugiego niezależnego dowodu.
      sources:

# Schematy JPK i obowiązek przesyłania ksiąg w formie JPK.
# Wersja schematu JPK_V7M i JPK_V7K obowiązuje za okresy rozliczeniowe (miesiąc, za który składa się plik),
# a nie według daty wysłania pliku. Narzędzie get_schema szuka parametru schemat.<symbol małymi literami>.

- id: schemat.jpk_v7m
  name: Schemat JPK_V7M (deklaracja miesięczna i ewidencja VAT)
  kind: value
  applies_to: {vat: [czynny_miesiecznie]}
  versions:
    - valid_from: 2022-01-01
      valid_to: 2026-01-31
      value:
        form: JPK_V7M
        variant: 2
        system_code: JPK_V7M (2)
        schema_version: 1-0E
        xsd_url: http://crd.gov.pl/wzor/2021/12/27/11148/schemat.xsd
      note: >-
        Okres obowiązywania dotyczy okresów rozliczeniowych od stycznia 2022 r. do stycznia 2026 r.
        Wzór opublikowano w Centralnym Repozytorium Wzorów Dokumentów Elektronicznych 27 grudnia 2021 r. pod
        numerem 2021/12/27/11148; adres schematu pochodzi z wyróżnika wzoru (tak jak w rejestrze, z http). Żaden
        dokument nie podaje sam całej wartości: okres podają strona KAS i broszura MF z 2026 r., wariant i datę
        początku wyróżnik wzoru, kod systemowy broszura KAS z 2023 r., a wersję schematu 1-0E broszura KAS z 2023 r.
        i zestawienie zmian MF. Dlatego wersja nie ma drugiego niezależnego dowodu.
      sources:
        - title: gov.pl (KAS), Struktury JPK
          url: https://www.gov.pl/web/kas/struktury-jpk
          quote: "obowiązują za okresy do rozliczenia za styczeń 2026 roku"
          article: art. 99 ust. 11c i 13a ustawy o VAT
          as_of: 2026-11-26
        - title: CRWDE (ePUAP), wyróżnik wzoru 2021/12/27/11148, twórca wzoru Ministerstwo Finansów
          url: https://crd.gov.pl/wzor/2021/12/27/11148/wyroznik.xml
          quote: "2022-01-01 JPK_V7M(2) DEKLARACJA MIESIĘCZNA I EWIDENCJA DLA PODATKU OD TOWARÓW I USŁUG"
          article: art. 99 ust. 13a ustawy o VAT
          as_of: 2026-11-26
        - title: CRWDE (ePUAP), wyróżnik wzoru 2021/12/27/11148 (adres schematu)
          url: https://crd.gov.pl/wzor/2021/12/27/11148/wyroznik.xml
          quote: "http://crd.gov.pl/wzor/2021/12/27/11148/schemat.xsd"
          as_of: 2026-11-26
        - title: podatki.gov.pl (MF), Broszura – JPK_VAT z deklaracją od 1 lutego 2026 r. (okresy wersji 2)
          url: https://podatki.gov.pl/media/wgbkrejs/broszura-jpk_vat-z-deklaracj%C4%85-od-1-lutego-2026-r.pdf
          quote: "Wzór w wersji (2) należy stosować za okresy rozliczeniowe od stycznia 2022 roku do stycznia 2026 roku."
          as_of: 2026-11-26
        - title: gov.pl (KAS), Broszura – JPK_VAT z deklaracją od 1 kwietnia 2023 (kod systemowy i wersja schematu)
          url: https://www.gov.pl/attachment/d503c474-e8e5-4b95-ac7a-60db69fd6374
          quote: "kodSystemowy: JPK_V7M (2) [dla podatników rozliczających się miesięcznie]"
          as_of: 2026-11-26
        - title: podatki.gov.pl (MF), Zmiany w strukturze JPK_V7M(3) w porównaniu do JPK_V7M(2) (wersja schematu)
          url: https://podatki.gov.pl/media/hwsb3pqh/zmiany_w_schemie_jpk_v7m3-2.pdf
          quote: "Schema JPK_V7M (2) (1-0E)"
          as_of: 2026-11-26
      verification: {checked_at: 2026-11-26, agent_check: 2026-11-26}
    - valid_from: 2026-02-01
      value:
        form: JPK_V7M
        variant: 3
        system_code: JPK_V7M (3)
        schema_version: 1-0E
        xsd_url: http://crd.gov.pl/wzor/2025/12/19/14090/schemat.xsd
      note: >-
        Okres obowiązywania dotyczy okresów rozliczeniowych od lutego 2026 r. Wzór opublikowano w Centralnym
        Repozytorium Wzorów Dokumentów Elektronicznych 19 grudnia 2025 r. pod numerem 2025/12/19/14090; adres schematu pochodzi z wyróżnika wzoru (tak jak w rejestrze, z http). Nowy wariant wynika ze zmian rozporządzenia
        w sprawie szczegółowego zakresu danych w deklaracjach i ewidencji VAT (oznaczenia związane z Krajowym
        Systemem e-Faktur), które weszły w życie 1 lutego 2026 r.; do okresów wcześniejszych stosuje się przepisy
        dotychczasowe. Rozporządzenie bazowe (Dz.U. 2019 poz. 1988) nie ma tekstu jednolitego w ELI.
        Kod systemowy i wersję schematu 1-0E podaje broszura MF z 2026 r. i atrybuty pliku XSD spod adresu
        schematu (wersję 1-0E także zestawienie zmian MF), a adres schematu wyróżnik wzoru i sam plik. Okres
        rozliczeniowy od lutego 2026 r. podają broszura MF z 2026 r. i artykuł firmy doradztwa podatkowego MDDP
        z 31 marca 2026 r. (źródło kontrolne); strony MF i KAS piszą o strukturze „obowiązującej od 1 lutego
        2026 roku” i nie mówią, czy chodzi o okres rozliczeniowy.
      sources:
        - title: podatki.gov.pl (MF), JPK_VAT z deklaracją – pliki do pobrania
          url: https://podatki.gov.pl/podatki-firmowe/jednolity-plik-kontrolny/jpk_vat-z-deklaracja/pliki-do-pobrania
          confirms: [form, variant]
          quote: "Struktura JPK_VAT z deklaracją miesięczną (JPK_V7M(3) w formacie XSD) obowiązująca od 1 lutego 2026 roku"
          article: art. 99 ust. 11c i 13a ustawy o VAT
          as_of: 2026-11-26
        - title: podatki.gov.pl (MF), Nowe wzory struktur JPK_VAT dostępne na ePUAP, 19.12.2025 (numer wzoru)
          url: https://podatki.gov.pl/aktualnosci/nowe-wzory-struktur-jpk_vat-dostepne-na-epuap
          quote: "Wzory zostały udostępnione odpowiednio pod numerami 2025/12/19/14090 oraz 2025/12/19/14089 i będą stosowane do rozliczeń od 1 lutego 2026 r."
          as_of: 2026-11-26
        - title: CRWDE (ePUAP), wyróżnik wzoru 2025/12/19/14090, twórca wzoru Ministerstwo Finansów
          url: https://crd.gov.pl/wzor/2025/12/19/14090/wyroznik.xml
          confirms: [form, variant]
          quote: "2026-02-01 JPK_V7M(3) DEKLARACJA MIESIĘCZNA I EWIDENCJA O PODATKU OD TOWARÓW I USŁUG"
          article: art. 99 ust. 13a ustawy o VAT
          as_of: 2026-11-26
        - title: CRWDE (ePUAP), wyróżnik wzoru 2025/12/19/14090 (adres schematu)
          url: https://crd.gov.pl/wzor/2025/12/19/14090/wyroznik.xml
          confirms: [xsd_url]
          quote: "http://crd.gov.pl/wzor/2025/12/19/14090/schemat.xsd"
          as_of: 2026-11-26
        - title: podatki.gov.pl (MF), Broszura – JPK_VAT z deklaracją od 1 lutego 2026 r. (kod systemowy i wersja schematu)
          url: https://podatki.gov.pl/media/wgbkrejs/broszura-jpk_vat-z-deklaracj%C4%85-od-1-lutego-2026-r.pdf
          confirms: [form, variant, system_code, schema_version]
          quote: "kodSystemowy: JPK_V7M (3) [dla podatników rozliczających się miesięcznie] albo JPK_V7K (3) [dla podatników rozliczających się kwartalnie] - wersjaSchemy: 1-0E."
          as_of: 2026-11-26
        - title: podatki.gov.pl (MF), Zmiany w strukturze JPK_V7M(3) w porównaniu do JPK_V7M(2) (wersja schematu)
          url: https://podatki.gov.pl/media/hwsb3pqh/zmiany_w_schemie_jpk_v7m3-2.pdf
          confirms: [form, variant, schema_version]
          quote: "Schema JPK_V7M (3) (1-0E)"
          as_of: 2026-11-26
        - title: CRWDE (ePUAP), plik XSD wzoru 2025/12/19/14090 (kod systemowy, wersja schematu i wariant z atrybutów pliku)
          url: https://crd.gov.pl/wzor/2025/12/19/14090/schemat.xsd
          confirms: [form, variant, system_code, schema_version, xsd_url]
          quote: "kodSystemowy xsd:string required JPK_V7M (3) wersjaSchemy xsd:string required 1-0E WariantFormularza xsd:byte 3"
          as_of: 2026-11-27
        - title: podatki.gov.pl (MF), Broszura – JPK_VAT z deklaracją od 1 lutego 2026 r. (okresy wersji 3)
          url: https://podatki.gov.pl/media/wgbkrejs/broszura-jpk_vat-z-deklaracj%C4%85-od-1-lutego-2026-r.pdf
          confirms: [variant, period]
          quote: "Wzór w wersji (3) należy stosować za okresy rozliczeniowe od lutego 2026 roku."
          as_of: 2026-11-26
        - title: MDDP (firma doradztwa podatkowego), Nowe struktury JPK_V7(3) od rozliczenia za luty 2026 r., 31 marca 2026 r. (okres rozliczeniowy)
          url: https://www.mddp.pl/nowe-struktury-jpk_v73-od-rozliczenia-za-luty-2026-r/
          kind: control
          confirms: [form, variant, period]
          quote: "Od rozliczenia za luty 2026 r. obowiązuje schema JPK_V7M(3) dla deklaracji miesięcznych"
          as_of: 2026-11-27
        - title: Dz.U. 2026 poz. 1263, tekst jednolity ustawy o podatku od towarów i usług (wzór dokumentu elektronicznego)
          url: https://api.sejm.gov.pl/eli/acts/DU/2026/1263/text.pdf
          quote: "Minister właściwy do spraw finansów publicznych określi i udostępni na elektronicznej platformie usług administracji publicznej wzór dokumentu, o którym mowa w ust. 11c."
          article: art. 99 ust. 11c i 13a, art. 109 ust. 3b
        - title: Dz.U. 2024 poz. 947, rozporządzenie MF zmieniające rozporządzenie zmieniające (wejście w życie 1 lutego 2026 r.)
          url: https://api.sejm.gov.pl/eli/acts/DU/2024/947/text.pdf
          quote: "w § 6 wyrazy „z dniem 1 lipca 2024 r.” zastępuje się wyrazami „z dniem 1 lutego 2026 r.”"
          article: § 1 pkt 3
        - title: Dz.U. 2024 poz. 13, rozporządzenie MF zmieniające rozporządzenie w sprawie szczegółowego zakresu danych w deklaracjach i ewidencji VAT
          url: https://api.sejm.gov.pl/eli/acts/DU/2024/13/text.pdf
          quote: "Do rozliczeń za okresy rozliczeniowe przypadające przed dniem wejścia w życie niniejszego rozporządzenia stosuje się przepisy dotychczasowe."
          article: § 5 i § 6
        - title: Dz.U. 2025 poz. 1800, rozporządzenie MFiG zmieniające rozporządzenie zmieniające (oznaczenia KSeF w ewidencji)
          url: https://api.sejm.gov.pl/eli/acts/DU/2025/1800/text.pdf
          quote: "„OFF” – faktura, o której mowa w art. 106nf ust. 1 ustawy, która na dzień złożenia ewidencji nie posiada numeru identyfikującego tę fakturę w Krajowym Systemie e-Faktur"
          article: § 1 pkt 1 lit. d
      verification: {checked_at: 2026-11-27, agent_check: 2026-11-27}


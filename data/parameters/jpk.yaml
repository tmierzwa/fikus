- id: schemat.jpk_pkpir
  name: Schemat JPK_PKPIR (podatkowa księga przychodów i rozchodów)
  kind: value
  applies_to: {tax_form: [liniowy, skala]}
  versions:
    - valid_from: 2026-01-01
      value:
        form: JPK_PKPIR
        variant: 3
        system_code: JPK_PKPIR (3)
        schema_version: "1-0"
        xsd_url: https://www.gov.pl/attachment/70b78fa0-9183-400d-a967-eeacdcb87e57
      note: >-
        Broszura MF podaje, że struktura „będzie obowiązywać od 01.01.2026 r.”. Obowiązek przesłania księgi i pierwszy rok, za który się ją
        przesyła, opisuje zasada.jpk_pd_pkpir. Broszura podaje, że struktura logiczna jest dostępna
        w Biuletynie Informacji Publicznej na stronie podmiotowej urzędu obsługującego ministra właściwego do spraw
        finansów publicznych. Adres pliku XSD pochodzi ze strony KAS „Struktury JPK w podatkach dochodowych”
        w Biuletynie Informacji Publicznej serwisu Ministerstwa Finansów – Krajowej Administracji Skarbowej
        (gov.pl/web/kas), która udostępnia go jako „Schemat_JPK_PKPIR(3)_v1-0”, plik Struktura_Schemat_JPK_PKPIR(3)_v1-0.xsd.
        Plik spod tego adresu ma przestrzeń nazw http://jpk.mf.gov.pl/wzor/2024/10/30/10302/
        oraz stałe wartości kodu systemowego „JPK_PKPIR (3)” i wersji schematu „1-0”; te wartości są w atrybutach pliku,
        więc nie da się ich zacytować.
        Wariant, kod systemowy, wersję schematu 1-0 i datę podaje razem tylko broszura MF, a adres pliku XSD tylko strona KAS. Strona MF
        o JPK_PD podaje tylko wariant 3, a specyfikacja interfejsów usług JPK wariant i datę, bez wersji schematu,
        więc żadna z nich nie jest drugim niezależnym dowodem.
        Poprawka: dodany adres pliku XSD (wcześniej wartość go nie miała, bo nie ustalono go w urzędowym źródle).

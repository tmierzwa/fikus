- id: zus.stawka.wypadkowa_do_9
  name: Stopa składki wypadkowej płatnika zgłaszającego nie więcej niż 9 ubezpieczonych
  unit: "% podstawy"
  versions:
    - valid_from: 2025-04-01
      valid_to: 2026-03-31
      value: 1.67
      note: >-
        Rok składkowy 2025/2026. 50% najwyższej stopy dla grup działalności (3,33% w załączniku nr 2
        w brzmieniu od 1 kwietnia 2024 r.), czyli 1,665, zaokrąglone do 0,01 zgodnie z § 6 ust. 2 rozporządzenia.
        Zmiana rozporządzenia Dz.U. 2025 poz. 1292 nie zmienia stóp.
        Stopa jest ustalana na cały rok składkowy (art. 28 ust. 1).
      sources:
        - title: Dz.U. 2025 poz. 1644, tekst jednolity ustawy o ubezpieczeniu społecznym z tytułu wypadków przy pracy i chorób zawodowych
          url: https://eli.gov.pl/eli/DU/2025/1644/ogl
          quote: "nie więcej niż 9 ubezpieczonych wynosi 50 % najwyższej stopy procentowej ustalonej na dany rok składkowy dla grup działalności"
          article: art. 28 ust. 1, art. 2 pkt 8
        - title: Dz.U. 2024 poz. 451, rozporządzenie MRPiPS z 25 marca 2024 r. zmieniające rozporządzenie w sprawie różnicowania stopy procentowej składki wypadkowej
          url: https://api.sejm.gov.pl/eli/acts/DU/2024/451/text.pdf
          quote: "Rozporządzenie wchodzi w życie z dniem 1 kwietnia 2024 r."
          article: załącznik nr 2, § 2
        - title: Dz.U. 2025 poz. 1874, tekst jednolity rozporządzenia w sprawie różnicowania stopy procentowej składki wypadkowej
          url: https://eli.gov.pl/eli/DU/2025/1874/ogl
          quote: "Wartości stóp procentowych składki, kategorii ryzyka i wskaźników częstości zaokrągla się zgodnie z zasadą matematyczną"
          article: § 6 ust. 2
        - title: Dz.U. 2025 poz. 1292, rozporządzenie MRPiPS z 18 września 2025 r.
          url: https://api.sejm.gov.pl/eli/acts/DU/2025/1292/text.pdf
        - title: ZUS, poradnik „Ustalanie stopy procentowej składki na ubezpieczenie wypadkowe”, stan prawny na 1 stycznia 2026 r.
          url: https://www.zus.pl/documents/10182/167567/poradnik_wypadkowe.pdf/15281e1b-c3f3-472a-81b3-7d10e1a434c8
          independent: true
          quote: "podlegasz wpisowi do rejestru REGON i zgłaszasz do ubezpieczenia wypadkowego nie więcej niż 9 ubezpieczonych, • nie podlegasz wpisowi do rejestru REGON (bez znaczenia jest w tym przypadku, ilu ubezpieczonych zgłaszasz do ubezpieczenia wypadkowego), obowiązuje Cię stopa zryczałtowana, która od 1 kwietnia 2018 r. wynosi 1,67%"
          as_of: 2026-01-01
      verification:
        checked_at: 2026-11-26
        open_issue: "Żaden cytat ze źródła pierwotnego nie podaje 1,67 wprost: wartość wynika z połączenia art. 28 ust. 1, najwyższej stopy 3,33 z tabeli w załączniku nr 2 i § 6 ust. 2; dosłownie podają ją tylko materiały ZUS. Potrzebny drugi dowód poza materiałem ZUS albo cytat, który sam daje najwyższą stopę."
    - valid_from: 2026-04-01
      valid_to: 2027-03-31
      value: 1.67
      note: >-
        50% najwyższej stopy dla grup działalności (3,33% w załączniku nr 2 rozporządzenia), czyli 1,665,
        zaokrąglone do 0,01 zgodnie z § 6 ust. 2 rozporządzenia.
        Okres to rok składkowy z art. 2 pkt 8; rozporządzenie nie ma daty końcowej (załącznik nr 2
        obowiązuje od 1 kwietnia 2024 r.; według obwieszczenia poz. 1874 jedyną późniejszą zmianą jest
        rozporządzenie z 18 września 2025 r., Dz.U. 2025 poz. 1292).
      sources:
        - title: Dz.U. 2025 poz. 1644, tekst jednolity ustawy o ubezpieczeniu społecznym z tytułu wypadków przy pracy i chorób zawodowych
          url: https://eli.gov.pl/eli/DU/2025/1644/ogl
          quote: "nie więcej niż 9 ubezpieczonych wynosi 50 % najwyższej stopy procentowej ustalonej na dany rok składkowy dla grup działalności"
          article: art. 28 ust. 1, art. 2 pkt 8
        - title: Dz.U. 2025 poz. 1874, tekst jednolity rozporządzenia w sprawie różnicowania stopy procentowej składki wypadkowej
          url: https://eli.gov.pl/eli/DU/2025/1874/ogl
          quote: "Wartości stóp procentowych składki, kategorii ryzyka i wskaźników częstości zaokrągla się zgodnie z zasadą matematyczną"
          article: załącznik nr 2, § 6 ust. 2
        - title: ZUS, Złóż informację ZUS IWA o danych do ustalenia stopy procentowej składki na ubezpieczenie wypadkowe (rok składkowy 2026/2027)
          url: https://www.zus.pl/-/z%C5%82%C3%B3%C5%BC-informacj%C4%99-zus-iwa-o-danych-do-ustalenia-stopy-procentowej-sk%C5%82adki-na-ubezpieczenie-wypadkowe
          independent: true
          quote: "Dla płatników zgłaszających do ubezpieczenia wypadkowego do 9 ubezpieczonych stopa procentowa składki na ubezpieczenie wypadkowe wynosi 50% najwyższej stopy procentowej ustalonej na dany rok składkowy dla grup działalności, tj. 1,67%"
          as_of: 2026-11-26
      verification:
        checked_at: 2026-11-26
        open_issue: "Żaden cytat ze źródła pierwotnego nie podaje 1,67 wprost: wartość wynika z połączenia art. 28 ust. 1, najwyższej stopy 3,33 z tabeli w załączniku nr 2 i § 6 ust. 2; dosłownie podają ją tylko materiały ZUS. Potrzebny drugi dowód poza materiałem ZUS albo cytat, który sam daje najwyższą stopę."


- id: zus.stawka.wypadkowa_do_9
  name: Stopa składki wypadkowej płatnika zgłaszającego nie więcej niż 9 ubezpieczonych
  unit: "% podstawy"
  versions:
    - valid_from: 2025-04-01
      valid_to: 2026-03-31
      value: 1.67
      note: >-
        Rok składkowy 2025/2026. 50% najwyższej stopy dla grup działalności (3,33% w załączniku nr 2
        w brzmieniu od 1 kwietnia 2024 r.), czyli 1,665, zaokrąglone do 0,01 zgodnie z § 6 ust. 2 rozporządzenia.
        Zmiana rozporządzenia Dz.U. 2025 poz. 1292 nie zmienia stóp.
        Uzupełnienie dowodów 2026-11-26: źródło kontrolne PIT.pl za cały rok składkowy.
      sources:
        - title: Dz.U. 2025 poz. 1644, tekst jednolity ustawy o ubezpieczeniu społecznym z tytułu wypadków przy pracy i chorób zawodowych
          url: https://eli.gov.pl/eli/DU/2025/1644/ogl
          quote: "nie więcej niż 9 ubezpieczonych wynosi 50 % najwyższej stopy procentowej ustalonej na dany rok składkowy dla grup działalności"
          article: art. 28 ust. 1, art. 2 pkt 8
        - title: Dz.U. 2024 poz. 451, rozporządzenie MRPiPS z 25 marca 2024 r. zmieniające rozporządzenie w sprawie różnicowania stopy procentowej składki wypadkowej
          url: https://api.sejm.gov.pl/eli/acts/DU/2024/451/text.pdf
          quote: "Rozporządzenie wchodzi w życie z dniem 1 kwietnia 2024 r."
          article: załącznik nr 2, § 2
        - title: Dz.U. 2025 poz. 1874, tekst jednolity rozporządzenia w sprawie różnicowania stopy procentowej składki wypadkowej
          url: https://eli.gov.pl/eli/DU/2025/1874/ogl
          quote: "Wartości stóp procentowych składki, kategorii ryzyka i wskaźników częstości zaokrągla się zgodnie z zasadą matematyczną"
          article: § 6 ust. 2
        - title: Dz.U. 2025 poz. 1292, rozporządzenie MRPiPS z 18 września 2025 r.
          url: https://api.sejm.gov.pl/eli/acts/DU/2025/1292/text.pdf
        - title: PIT.pl, Składka wypadkowa – stopy procentowe (podaje stopę dla płatników do 9 ubezpieczonych na rok składkowy 2025/2026)
          url: https://www.pit.pl/?p=9018
          kind: control
          quote: "od 1 kwietnia 2025 r. do 31 marca 2026 r. takich płatników obowiązuje stopa procentowa składki wypadkowej w wysokości 1,67%"
          as_of: 2026-11-26
      verification: {checked_at: 2026-11-26, agent_check: 2026-11-26}
    - valid_from: 2026-04-01
      valid_to: 2027-03-31
      value: 1.67
      note: >-
        50% najwyższej stopy dla grup działalności (3,33% w załączniku nr 2 rozporządzenia), czyli 1,665,
        zaokrąglone do 0,01 zgodnie z § 6 ust. 2 rozporządzenia.
        Okres to rok składkowy z art. 2 pkt 8; rozporządzenie nie ma daty końcowej (załącznik nr 2
        obowiązuje od 1 kwietnia 2024 r.; zmiana z 10 października 2025 r. dotyczy tylko kodów PKD).
      sources:
        - title: Dz.U. 2025 poz. 1644, tekst jednolity ustawy o ubezpieczeniu społecznym z tytułu wypadków przy pracy i chorób zawodowych
          url: https://eli.gov.pl/eli/DU/2025/1644/ogl
          quote: "nie więcej niż 9 ubezpieczonych wynosi 50 % najwyższej stopy procentowej ustalonej na dany rok składkowy dla grup działalności"
          article: art. 28 ust. 1, art. 2 pkt 8
        - title: Dz.U. 2025 poz. 1874, tekst jednolity rozporządzenia w sprawie różnicowania stopy procentowej składki wypadkowej
          url: https://eli.gov.pl/eli/DU/2025/1874/ogl
          quote: "Wartości stóp procentowych składki, kategorii ryzyka i wskaźników częstości zaokrągla się zgodnie z zasadą matematyczną"
          article: załącznik nr 2, § 6 ust. 2
        - title: Fakturownia, składka wypadkowa 2026
          url: https://fakturownia.pl/aktualnosci/skadka-wypadkowa-2026-nowe-stawki-i-jak-ja-ustalic
          kind: control
      verification: {checked_at: 2026-11-25, agent_check: 2026-11-25}


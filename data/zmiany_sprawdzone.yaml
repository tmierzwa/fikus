# Nowelizacje przejrzane przez człowieka albo agenta, które nie zmieniają żadnej wartości w danych.
# scripts/wykryj_zmiany.py ich nie zgłasza. Nowelizację, która zmienia wartość, obsługujemy nową
# wersją parametru, a nie wpisem tutaj.
#
# Każdy wpis potrzebuje trzech pól:
#   act: identyfikator ELI nowelizacji, np. DU/2026/986
#   checked_at: data przejrzenia
#   note: co zmienia i dlaczego nie dotyczy naszych parametrów, np. "zmienia tylko art. 15"
# Opcjonalnie `for: <ELI aktu>`, gdy wpis dotyczy tylko jednego z aktów zmienianych przez nowelizację.
# Nowelizacja cytowana jako źródło w tej samej wersji co zmieniany akt jest uznana za obsłużoną.

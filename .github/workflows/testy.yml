name: testy

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 5 * * 1"   # co tydzień: cytaty w tekstach i zmiany w aktach (zadanie zmiany)
  workflow_dispatch:

permissions:
  contents: read

jobs:
  testy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pyproject.toml
      # Lista pakietów obrazu zwykle wystarcza; apt-get update tylko wtedy, gdy instalacja się nie uda.
      - run: |
          sudo apt-get install -y --no-install-recommends poppler-utils \
            || { sudo apt-get update && sudo apt-get install -y --no-install-recommends poppler-utils; }
      - run: pip install -e ".[dev]"
      - run: pytest -q
      # Teksty źródeł: w PR z ostatniej zapisanej pamięci (pobierane są tylko brakujące adresy).
      # Na main, w cotygodniowym przebiegu i na żądanie wszystko od nowa, więc tekst zmieniony
      # na stronie urzędu wychodzi najpóźniej po tygodniu. PR widzi pamięć z main i swoją własną.
      - name: Pamięć tekstów źródeł
        if: github.event_name == 'pull_request'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: .cache/zrodla
          key: zrodla-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: zrodla-
      - run: python scripts/sprawdz_cytaty.py
      - name: Zapis pamięci tekstów źródeł
        if: always()
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: .cache/zrodla
          key: zrodla-${{ github.run_id }}-${{ github.run_attempt }}

  # Najstarszy Python z requires-python. Osobne zadanie, żeby nie zmieniać nazwy
  # wymaganego sprawdzenia „testy” w regułach gałęzi main.
  python-min:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: pip install -e ".[dev]"
      - run: pytest -q

  # Tylko w cotygodniowym przebiegu i na żądanie: nowe teksty jednolite, nowelizacje i wersje
  # kończące się bez następczyni. Czerwony przebieg znaczy „jest coś do przejrzenia”, a lista
  # jest w podsumowaniu zadania. Nie uruchamia się przy PR, bo zmiany w aktach nie zależą od kodu.
  zmiany:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.13"
      - run: pip install -e .
      - name: Zmiany w źródłach
        shell: bash      # z pipefail, żeby kod wyjścia skryptu przeszedł przez tee
        run: python scripts/wykryj_zmiany.py | tee -a "$GITHUB_STEP_SUMMARY"

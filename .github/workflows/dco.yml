name: dco

on:
  pull_request:

permissions:
  contents: read

jobs:
  dco:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
      - name: Każdy commit ma Signed-off-by (Developer Certificate of Origin)
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          missing=0
          for c in $(git rev-list --no-merges "$BASE..$HEAD"); do
            if ! git log -1 --format=%B "$c" | grep -q '^Signed-off-by: '; then
              echo "Brak Signed-off-by w commicie $(git log -1 --format='%h %s' "$c")"
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            echo "Dodaj podpis: git commit --amend -s (albo git rebase --signoff $BASE)"
            exit 1
          fi
